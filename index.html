  }
  o+=`<section class="pn"><h2>Estatísticas</h2><div class="kv">
  <div><small>Temporadas</small><b class="num">${ss.length}</b></div>
  <div><small>Jogos (V-D)</small><b class="num">${gw}-${gl}</b></div>

  if(d.tl.length)o+=`<section class="pn"><details class="det"><summary>Todos os títulos e prêmios</summary>${[...d.tl].reverse().map(x=>`<div class="tr"><b>${esc(x.t)}</b><small>${x.y}${x.tm?' · '+esc(x.tm):''}</small></div>`).join('')}</details></section>`;

  if(ss.length)o+=`<section class="pn"><h2>Temporadas</h2><div class="tw"><table class="tb"><thead><tr><th>Ano</th><th>Time</th><th>OVR</th><th>Idade</th><th>Nota</th><th>Pos.</th><th>Jogos</th><th>KDA</th></tr></thead><tbody>${[...ss].reverse().map(s=>`<tr><td class="num">${s.y}</td><td>${esc(s.tm)}</td><td class="num">${s.r}</td><td class="num">${s.age}</td><td class="num">${s.sc}</td><td class="num${s.pos===1?' c':''}">${pos(s.pos)}</td><td class="num">${s.gw}-${s.gl}</td><td class="num">${s.kda}</td></tr>`).join('')}</tbody></table></div><p class="note">Posição é o lugar do jogador na votação geral da temporada. KDA é simulado a partir do desempenho.</p></section>`;

  if(dHof===null)dHof=hofRank().map(n=>`${n},${r1(S.hof[n].pts)}`).join('\n');
  const mt=mgrT();
  const mgrPanel=mt?`<section class="pn"><h2>Modo carreira</h2><p class="note" style="margin:0 0 10px">Você é o manager do ${esc(mt.name)} desde ${S.mgr.since}. Meta atual: ${GOALS[S.mgr.goal]}.</p><div class="row" style="margin:0"><button class="ghost" data-act="tab" data-v="mgr">Abrir Gestão</button>${askEnd?'<button class="ghost danger" data-act="mgrEndOk">Confirmar</button><button class="ghost" data-act="mgrEndNo">Cancelar</button>':'<button class="ghost" data-act="mgrEnd">Encerrar carreira</button>'}</div></section>`:`<section class="pn"><h2>Modo carreira</h2><p class="note" style="margin:0 0 10px">${S.mgr&&S.mgr.fired?'Você foi demitido. Escolha um novo clube.':'Assuma um time como manager: administre o caixa, desenvolva promessas na base, venda e empreste jogadores, negocie na virada de ano e cumpra as metas da diretoria. O jogo continua simulando todas as ligas.'}</p>${pickerHTML()}</section>`;
  return `${msg?`<div class="msg">${esc(msg)}</div>`:''}
  ${slotsHTML()}
  ${mgrPanel}
  <section class="pn"><h2>Draft de campeões</h2><p class="note" style="margin:0 0 10px">Opcional, só no modo treinador. Antes de cada jogo você escolhe os campeões dos cinco titulares; o domínio de cada jogador e a força do campeão no ano mudam as chances (até 7% por mapa). Desligado, vale o plano de jogo simples.</p><div class="pills" style="margin:0">${[[1,'Ligado'],[0,'Desligado']].map(([k,l])=>`<button class="pill" aria-pressed="${(draftOn()?1:0)===k}" data-act="draftOpt" data-v="${k}">${l}</button>`).join('')}</div></section>
  <section class="pn"><h2>Sons</h2><p class="note" style="margin:0 0 10px">Efeitos curtos ao jogar, vencer, perder e conquistar títulos.</p><div class="pills" style="margin:0">${[[1,'Ligados'],[0,'Desligados']].map(([k,l])=>`<button class="pill" aria-pressed="${(sndOn()?1:0)===k}" data-act="snd" data-v="${k}">${l}</button>`).join('')}</div></section>
  <section class="pn"><h2>Aleatoriedade</h2><p class="note" style="margin:0 0 10px">Quanto o favorito se impõe. Em Menor, a vantagem de OVR pesa mais e as zebras ficam raras. Em Maior, qualquer time pode surpreender. Vale para os próximos jogos.</p><div class="pills" style="margin:0">${[['baixa','Menor'],['normal','Normal'],['alta','Maior']].map(([k,l])=>`<button class="pill" aria-pressed="${((S.opt&&S.opt.rnd)||'normal')===k}" data-act="rnd" data-v="${k}">${l}</button>`).join('')}</div></section>
  <section class="pn"><h2>Dificuldade do treinador</h2><p class="note" style="margin:0 0 10px">Muda a receita do clube, o preço do mercado e o quanto a diretoria perde a paciência. Fácil: receita +20%, mercado 15% mais barato. Difícil: receita −15%, mercado 20% mais caro.</p><div class="pills" style="margin:0">${[['facil','Fácil'],['normal','Normal'],['dificil','Difícil']].map(([k,l])=>`<button class="pill" aria-pressed="${((S.opt&&S.opt.dif)||'normal')===k}" data-act="dif" data-v="${k}">${l}</button>`).join('')}</div></section>
  <section class="pn"><h2>Bandeiras</h2><p class="note" style="margin:0 0 10px">Mostra a bandeira ao lado do código do país. Em alguns aparelhos (como Windows) a bandeira aparece só como letras; nesse caso, desligue.</p><div class="pills" style="margin:0">${[['1','Ligadas'],['0','Desligadas']].map(([k,l])=>`<button class="pill" aria-pressed="${flagOn()===(k==='1')}" data-act="flags" data-v="${k}">${l}</button>`).join('')}</div></section>
  <section class="pn"><h2>Cheats</h2><p class="note" style="margin:0 0 10px">Verba infinita e janela de transferências sempre aberta. Valem para o time do modo carreira e dão para contratar qualquer jogador ou agente livre de graça.</p><div class="row" style="margin:0"><button class="ghost${S.mgr&&S.mgr.cheat?' danger':''}" data-act="cheat">${S.mgr&&S.mgr.cheat?'Desligar cheats':'Ligar cheats'}</button>${S.mgr&&S.mgr.tid!=null?'<button class="ghost" data-act="tab" data-v="mgr">Abrir Gestão</button>':''}</div></section>
  <section class="pn"><h2>Ranking histórico inicial</h2><p class="note" style="margin:0 0 8px">Uma linha por jogador, no formato Nome,pontos. Aplicar substitui o ranking atual. Os títulos já ganhos na simulação ficam.</p>
  <textarea id="t-hof" aria-label="Ranking histórico">${esc(dHof)}</textarea><div class="row" style="margin:10px 0 0"><button class="ghost" data-act="applyHof">Aplicar ranking</button></div></section>
  <section class="pn"><h2>Backup do progresso</h2><p class="note" style="margin:0 0 8px">O progresso fica salvo neste navegador. Para levar para outro aparelho, gere o backup e cole lá.</p>
  <textarea id="t-bk" aria-label="Backup" placeholder="Cole aqui um backup para carregar">${esc(dBackup)}</textarea>
  <div class="row" style="margin:10px 0 0"><button class="ghost" data-act="copy">Gerar e copiar backup</button><button class="ghost" data-act="loadBk">Carregar backup</button></div><div class="row" style="margin:10px 0 0"><label class="ghost" style="cursor:pointer">Carregar de arquivo<input id="bk-file" type="file" accept=".json,text/plain" style="display:none"></label></div></section>
  <section class="pn"><h2>Recomeçar</h2><p class="note" style="margin:0 0 10px">Apaga o que foi simulado e volta ao Mundial 2026 no ponto real: Suíço com três rodadas e meia jogadas.</p>
  ${askReset?`<div class="row" style="margin:0"><button class="ghost danger" data-act="resetOk">Confirmar e apagar tudo</button><button class="ghost" data-act="resetNo">Cancelar</button></div>`:`<button class="ghost" data-act="reset">Reiniciar simulador</button>`}</section>`;
}

function render(){
  fixNat();
  const v={season:vSeason,bola:vBola,hof:vHof,teams:vTeams,set:vSet,prof:vProf,mgr:vMgr}[tab]();
  const ap=document.querySelector('#app');ap.className='wrap'+(animNext?' enter':'');animNext=false;
  ap.innerHTML=DEFS+header()+v+nav()+(msg&&tab!=='mgr'&&tab!=='set'?`<div class="toast" role="status">${esc(msg)}</div>`:'');
}

/* ---------- ações ---------- */
function act(a,v){
  msg='';
  if(['tab','player','team','nation','back','step','all'].includes(a))animNext=true;
  let top=false;
  if(a==='tab'){tab=v;askReset=false;askEnd=false;lastPlayed=null;prof=null;pstack=[]}
  else if(a==='step'){if(daysLeft()>0){msg='Ainda não é dia de jogo. Avance o calendário.'}else{step();sndAfter();save();top=true}}
  else if(a==='day'){advDay(+v);save()}
  else if(a==='dayTo'){advDay(999);save()}
  else if(a==='fl'){S.opt=S.opt||{};S.opt.fl=v;save()}
  else if(a==='all'){const c5=PHASES[S.phase]&&PHASES[S.phase].g===5;while(S.phase<PHASES.length&&(c5||PHASES[S.phase].g<5))step();lastPlayed=null;S.day=evDay();tab='bola';save();top=true}
  else if(a==='year'){selYear=+v}
  else if(a==='celeX'){cele=null}
  else if(a==='lg'){selLg=v}
  else if(a==='hv'){hofView=v}
  else if(a==='pf'){pf=v}
  else if(a==='player'){openProf('p',v);top=true}
  else if(a==='team'){openProf('t',+v);top=true}
  else if(a==='league'){openProf('l',v);top=true}
  else if(a==='nation'){if(v)openProf('n',v);top=true}
  else if(a==='nmSet'){S.nm={code:v,titles:0,cups:[]};msg=`Você agora é o técnico de ${NATN[v]||v}.`;save()}
  else if(a==='nmOff'){S.nm=null;msg='Você deixou a seleção.';save()}
  else if(a==='cupSwap'){const [r,n]=v.split('|');cupSwap(+r,n);save()}
  else if(a==='back'){if(pstack.length)prof=pstack.pop();else{tab=prevTab;prof=null}top=true}
  else if(a==='applyHof'){
    const nh={};
    dHof.split('\n').forEach(l=>{
      const m=l.trim().match(/^(.+?)[,;\t]\s*(-?\d+(?:[.,]\d+)?)$/);
      if(m){const n=m[1].trim();nh[n]={...(S.hof[n]||{bd:0,wc:0,msi:0,lg:0,mvp:0}),pts:parseFloat(m[2].replace(',','.'))}}
    });
    if(Object.keys(nh).length){S.hof=nh;S.mv={};dHof=null;msg='Ranking histórico atualizado.';save()}
    else msg='Nenhuma linha válida. Use o formato Nome,pontos.';
  }
  else if(a==='copy'){
    dBackup=JSON.stringify(S);msg='Backup gerado abaixo.';
    try{navigator.clipboard.writeText(dBackup).then(()=>{msg='Backup copiado.';render()},()=>{})}catch(e){}
  }
  else if(a==='loadBk'){
    try{
      const o=JSON.parse(dBackup);
      if(!o||!o.teams||!o.hof||!o.year||!o.pdb)throw 0;
      S=o;save();dHof=null;dBackup='';msg='Backup carregado.';
    }catch(e){msg='Backup inválido. Cole o texto completo gerado por esta versão do simulador.'}
  }
  else if(a==='mgrStart'){mgrStart(+mgrPick);tab='mgr';msg='Você assumiu o '+mgrT().name+'.';save()}
  else if(a==='mgrEnd'){askEnd=true}
  else if(a==='mgrEndNo'){askEnd=false}
  else if(a==='mgrEndOk'){S.mgr=null;askEnd=false;tab='set';msg='Modo carreira encerrado.';save()}
  else if(a==='cheat'){if(S.mgr){S.mgr.cheat=!S.mgr.cheat;msg=S.mgr.cheat?'Cheats ligados.':'Cheats desligados.';save()}else msg='Ative o modo carreira para usar cheats.'}
  else if(a==='rnd'){S.opt=S.opt||{};S.opt.rnd=v;save()}
  else if(a==='dif'){S.opt=S.opt||{};S.opt.dif=v;save()}
  else if(a==='flags'){S.opt=S.opt||{};S.opt.flags=v==='1';save()}
  else if(a==='spRR'){while(S.season.sp&&S.season.sp.stage==='rr')spStep();save();top=true}
  else if(a==='spAll'){const ph=S.phase;let g2=0;while(S.phase===ph&&g2++<400)step();save();top=true}
  else if(a==='mgrView'){mgrView=v}
  else if(a==='focus'){if(S.mgr){S.mgr.focus=v;save()}}
  else if(a==='mgrEv'){mgrEv(v);save()}
  else if(a==='mgrTr'){mgrTr(v);save()}
  else if(a==='mgrCoach'){mgrCoach(v);save()}
  else if(a==='dp'){const [i,c]=String(v).split('|');if(S.mgr){S.mgr.dr=myPicks(mgrT());S.mgr.dr[+i]=c;save()}}
  else if(a==='dpAuto'){if(S.mgr){S.mgr.dr=bestPicks(mgrT(),0);save()}}
  else if(a==='draftOpt'){S.opt=S.opt||{};S.opt.draft=+v;save()}
  else if(a==='plan'){if(S.mgr){S.mgr.plan=v;save()}}
  else if(a==='mgrRole'){mgrRole=+v}
  else if(a==='mgrBuy'){mgrBuy(v);mAch();save()}
  else if(a==='mgrSign'){mgrSign(v);save()}
  else if(a==='mgrSell'){mgrSell(v);mAch();save()}
  else if(a==='mgrRenew'){mgrRenew(v);save()}
  else if(a==='mgrLoan'){mgrLoan(v);save()}
  else if(a==='mgrPromote'){mgrPromote(v);mAch();save()}
  else if(a==='mgrRelease'){mgrRelease(v);save()}
  else if(a==='mgrUp'){mgrUp(v);save()}
  else if(a==='mgrOffer'){const [i,w]=v.split('|');mgrOffer(+i,w==='y');save()}
  else if(a==='reset'){askReset=true}
  else if(a==='slot'){slotGo(+v);save()}
  else if(a==='slotAsk'){askSlot=+v}
  else if(a==='slotDel'){try{localStorage.removeItem(SLOTK[+v])}catch(e){}askSlot=-1;msg='Slot '+(+v+1)+' apagado.'}
  else if(a==='snd'){S.opt=S.opt||{};S.opt.snd=+v;save();if(+v)snd('win')}
  else if(a==='resetNo'){askReset=false}
  else if(a==='resetOk'){freshGame();save();askReset=false;dHof=null;selYear=null;msg='Simulador reiniciado.'}
  render();
  if(top)window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset.v)});
document.addEventListener('change',e=>{
  if(e.target.id==='bk-file'&&e.target.files&&e.target.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{dBackup=String(rd.result);act('loadBk');render()};
    rd.readAsText(e.target.files[0]);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='t-hof')dHof=e.target.value;
  else if(e.target.id==='t-bk')dBackup=e.target.value;
  else if(e.target.id==='mgr-pick'){mgrPick=+e.target.value}
  else if(e.target.id==='mgr-q'){mgrQ=e.target.value;const l=document.querySelector('#mlist');if(l)l.innerHTML=mlistHTML()}
  else if(e.target.id==='q'){qStr=e.target.value;const l=document.querySelector('#plist');if(l)l.innerHTML=plistHTML()}
});
if(!S)freshGame();else{fixLPL();if(!S.lh)applyLeagueHist();if(!S.lh2)applyLeagueHist2();if(!S.lh3)applyLeagueHist3();save()}
render();
</script>
