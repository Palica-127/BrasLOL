<style>
/* Layout: HUD de jogo. Cabeçalho com temporada, trilha de etapas, botão JOGAR grande, painéis com cantos dourados, cartas hexagonais de OVR, fichas de jogador e time, navegação fixa embaixo. */
:root{
  --bg:#050C15;--bg2:#091524;--panel:#0C1A2A;--ink:#E8EEF4;--muted:#8194A8;--line:#1E3248;
  --gold:#D9B35F;--gold-hi:#F2D58C;--gold-lo:#A57C2E;--on-gold:#1B1405;
  --teal:#3AC6D3;--ok:#47C58C;--bad:#EF7064;--glow:rgba(217,179,95,.22);--tex:rgba(255,255,255,.025);--silver:#B9C4D0;--bronze:#C98A55;
  --d:'Barlow Condensed','Arial Narrow',sans-serif;--b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{background:var(--bg);color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);
  background-image:radial-gradient(900px 380px at 50% -140px,var(--glow),transparent 70%),repeating-linear-gradient(135deg,var(--tex) 0 1px,transparent 1px 14px);
  color:var(--ink);font-family:var(--b);font-size:15px;line-height:1.45;
  padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
small,.muted{color:var(--muted)}small{font-size:13px}
.lk{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow-wrap:anywhere}
.lk:hover{text-decoration-color:var(--gold)}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:34px;height:34px;flex:none;color:var(--gold)}
.eyebrow{font:600 12px var(--d);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font:700 32px/1 var(--d);text-transform:uppercase;letter-spacing:.04em;margin:0}
.season{text-align:right;border:1px solid var(--line);background:var(--panel);padding:4px 12px;flex:none}
.season small{display:block;font:600 10px var(--d);letter-spacing:.16em;text-transform:uppercase}
.season b{font:700 26px/1 var(--d);color:var(--gold)}

/* trilha */
.trk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;list-style:none;padding:0;margin:0 0 12px}
.trk li{font:600 11px var(--d);letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
.trk i{display:block;height:6px;background:var(--line);margin-bottom:5px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.trk .done{color:var(--ink)}.trk .done i{background:var(--teal)}

/* ===== Skin estilo FIFA/FC: azul profundo, neon, cartas, escudos; celular e PC ===== */
:root{
  --bg:#060A22;--bg2:#0B1240;--panel:#101A52;--ink:#F4F7FF;--muted:#9AA7DB;--line:#27358F;
  --acc:#00F5A0;--acc2:#00C2FF;--on-acc:#02161F;--glow:rgba(0,245,160,.18);
}
html{background:var(--bg)}
body{background-color:var(--bg);
  background-image:radial-gradient(800px 420px at 85% -120px,rgba(122,92,255,.45),transparent 70%),radial-gradient(700px 400px at -10% 20%,rgba(0,194,255,.22),transparent 70%),linear-gradient(165deg,#0A1250 0%,#14083D 55%,#050A26 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px);z-index:-1}
h1,h2,h3{font-style:italic}
h1{letter-spacing:.02em}
.eyebrow{color:var(--acc)}
.season{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.18);border-radius:10px}
.season b{color:var(--acc)}
.logo svg{color:var(--acc)}
.pn{background:linear-gradient(180deg,rgba(30,44,130,.62),rgba(11,18,64,.78));border:1px solid rgba(130,150,255,.24);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,20,.35)}
.pn::before,.pn::after{display:none}
.pn h2{color:var(--ink);font-style:italic;letter-spacing:.04em;position:relative;padding-left:12px}
.pn h2::before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:4px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.play{background:linear-gradient(100deg,var(--acc),var(--acc2));color:var(--on-acc);clip-path:none;border-radius:14px;font-style:italic;box-shadow:0 8px 24px rgba(0,245,160,.28);min-height:54px}

/* escudos */
.shield{display:inline-block;flex:none;width:30px;height:35px;vertical-align:middle;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.shield.sm{width:22px;height:26px}.shield.lg{width:58px;height:68px}.shield.xl{width:92px;height:107px}

/* cartas */
.futr{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.futr>*{scroll-snap-align:start}
.fut{--fb:linear-gradient(160deg,#D49A62,#7A4A26);--fc:#2A1606;--fm:rgba(42,22,6,.55);position:relative;display:block;flex:none;width:132px;height:190px;border:0;padding:0;margin:0;color:var(--fc);background:var(--fb);cursor:pointer;
  clip-path:polygon(50% 0,90% 6%,100% 15%,100% 80%,50% 100%,0 80%,0 15%,10% 6%);font-family:var(--d);text-align:center;transition:transform .15s}

function seriesP(q,n){
  const need=Math.ceil(n/2);let s=0,c=1;
  for(let k=0;k<need;k++){if(k>0)c=c*(need-1+k)/k;s+=c*Math.pow(1-q,k)}
  return s*Math.pow(q,need);
}
function perGame(P,n){
  if(n===1)return P;
  let lo=0,hi=1;
  for(let i=0;i<40;i++){const m=(lo+hi)/2;seriesP(m,n)<P?lo=m:hi=m}
  return(lo+hi)/2;
}
function mk(a,b,n){
  const d=eff(a)-eff(b);
  const qa=clamp(1/(1+Math.pow(10,-d/kgNow())),.2,.8);
  return{a:a.id,b:b.id,n,d,pa:seriesP(qa,n),qa,res:null};
}
const rvKey=(x,y)=>[x.name,y.name].sort().join('|');
const rvOf=(A,B)=>A.id<100&&B.id<100&&S.rv?S.rv[rvKey(A,B)]:null;
function rvTxt(A,B){const r=rvOf(A,B);if(!r||r.n<2)return'';const a=r.w[A.name]||0,b=r.w[B.name]||0;return `${a}–${b} no histórico`}
const isRival=(A,B)=>{const r=rvOf(A,B);if(!r||r.n<4)return false;const a=r.w[A.name]||0,b=r.w[B.name]||0;return Math.abs(a-b)<=2};
function play(m){
  const need=Math.ceil(m.n/2);let wa=0,wb=0;
  let qa=m.qa;
  m.cl=isRival(T(m.a),T(m.b));if(m.cl)qa=.5+(qa-.5)*.85;
  if(mineM(m)){const pdl=draftOn()?draftDelta(m):planDelta(m);qa=clamp(qa+pdl.d,.2,.8);m.pn={me:pdl.me,op:pdl.op,raw:pdl.raw,dr:draftOn()}}
  if(m.fx){wa=m.fx.wa;wb=m.fx.wb}else while(wa<need&&wb<need){Math.random()<qa?wa++:wb++}
  const w=wa>wb?m.a:m.b,l=wa>wb?m.b:m.a;
  m.res={wa,wb,w};
  const W=T(w),L=T(l);
  if(W.id<100&&L.id<100){S.rv=S.rv||{};const k=rvKey(W,L),r=S.rv[k]||(S.rv[k]={n:0,w:{}});r.n++;r.w[W.name]=(r.w[W.name]||0)+1}
  if(m.n>=3){const pw=w===m.a?m.pa:1-m.pa,z=S.season.zb;if(pw<.3&&(!z||pw<z.p))S.season.zb={w:W.name,l:L.name,p:pw,sc:Math.max(wa,wb)+'–'+Math.min(wa,wb),sw:m.sw||''}}
  W.hot=Math.min(1.2,W.hot+.3);L.hot=Math.max(-1.2,L.hot-.3);
  W.fm=((W.fm||'')+'V').slice(-5);L.fm=((L.fm||'')+'D').slice(-5);
  if(mineM(m)){const M=S.mgr;M.mor=clamp((M.mor==null?60:M.mor)+(w===M.tid?3:-3),10,100)}
  T(m.a).pl.forEach(p=>{const o=psOf(p.n);o.gw+=wa;o.gl+=wb});
  T(m.b).pl.forEach(p=>{const o=psOf(p.n);o.gw+=wb;o.gl+=wa});
  return w;
}
const loserOf=m=>m.res.w===m.a?m.b:m.a;

function perf(t,bonus,wt){
  t.pl.forEach(p=>{
    const o=S.season.perf[p.n]||(S.season.perf[p.n]={s:0,w:0});
    const ev=p.r+g()*2.5+bonus;
    o.s+=ev*wt;o.w+=wt;
    p.f=clamp(.55*p.f+.3*(ev-p.r),-4,4);
  });
}
function award(t,key,label){
  t.pl.forEach(p=>{
    const a=achOf(p.n);
    if(key==='lg')a.lg.push(label);else if(key==='msi')a.msi='C';else a.wc='C';
    hofOf(p.n)[key]++;
    pd(p.n).tl.push({y:S.year,t:label,tm:t.name});
  });
  t.tt.push({y:S.year,k:label,r:t.pl.map(p=>p.n)});
}
function mark(t,key,v){t.pl.forEach(p=>{const a=achOf(p.n);if(key==='lgf')a.lgf++;else a[key]=v})}
function giveMVP(label,champ,runner){
  const c=[];
  champ.pl.forEach(p=>c.push({p,t:champ,v:p.r+p.f+2.5+g()*3}));
  runner.pl.forEach(p=>c.push({p,t:runner,v:p.r+p.f+g()*3}));
  const x=c.sort((a,b)=>b.v-a.v)[0];
  achOf(x.p.n).mv.push(label);
  hofOf(x.p.n).mvp++;
  pd(x.p.n).tl.push({y:S.year,t:label,tm:x.t.name});
  return x.p.n;
}

/* ---------- splits ---------- */
const vOf=tr=>{if(!tr||!tr.elim)return'';const id=Object.keys(tr.elim).find(k=>tr.elim[k]==='Final');return id!=null?T(+id).name:''};
function closeLeague(lg,tag,st,m1,m2,fm){
  const top=st.slice(0,4).map(r=>r.t);
  const third=[T(loserOf(m1)),T(loserOf(m2))].sort((a,b)=>top.indexOf(a)-top.indexOf(b));
  const champ=T(fm.res.w),runner=T(loserOf(fm));
  const order=[champ,runner,...third,...st.slice(4).map(r=>r.t)];
  S.season.rank[tag+lg]=order.map(t=>t.id);
  const n=order.length;
  order.forEach((t,i)=>{
    t.cs=t.cs||{};t.cs[tag]=i+1;t.cs[tag+'d']=1;
    perf(t,[3,1.5,.5,.5,-.5,-1][i]??-1,1);
    t.mom=clamp(.55*t.mom+1.2*(1-2*i/(n-1))+(i===0?.5:0),-3,3);
    t.hot=0;
  });
  const label=`${lg} ${tag==='s1'?'Split 1':'Split 2'}`;
  award(champ,'lg',label);mark(runner,'lgf');
  if(champ.tt.some(x=>x.k===label&&x.y===S.year-1))news(`${champ.name} é bicampeão da ${label}.`);
  const mvp=giveMVP('MVP '+label,champ,runner);
  const fp=fm.res.w===fm.a?fm.pa:1-fm.pa;
  return{lg,champ:champ.name,cid:champ.id,runner:runner.name,third:third.map(t=>t.name),mvp,
    score:`${Math.max(fm.res.wa,fm.res.wb)}-${Math.min(fm.res.wa,fm.res.wb)}`,fp:Math.round(fp*100)};
}
function runLeagueFull(lg,tag){
  const ts=S.teams.filter(t=>t.lg===lg);
  const rec=new Map(ts.map(t=>[t.id,{t,w:0,l:0}]));
  for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++)for(let k=0;k<2;k++){
    const m=mk(ts[i],ts[j],1);const w=play(m);
    rec.get(w).w++;rec.get(loserOf(m)).l++;
  }
  const st=[...rec.values()].sort((x,y)=>y.w-x.w||Math.random()-.5);
  const top=st.slice(0,4).map(r=>r.t);
  const ser=(a,b)=>{const m=mk(a,b,5);play(m);return m};
  const m1=ser(top[0],top[3]),m2=ser(top[1],top[2]);
  const fm=ser(T(m1.res.w),T(m2.res.w));
  return closeLeague(lg,tag,st,m1,m2,fm);
}
function runSplit(tag){
  S.teams.forEach(t=>{t.mom*=.9;t.hot=0});rollInj();
  S.season.res[tag]=LGS.map(lg=>runLeagueFull(lg,tag));
  LGS.forEach(lg=>runD2(lg,tag));
}

/* ---------- split jogo a jogo (modo carreira) ---------- */
const winOpen=()=>((S.phase===0&&dayNow()<CAL.s1)||(S.phase===4&&dayNow()<CAL.s2))&&!S.season.sp;
function roundRobin(ids){
  const n=ids.length,arr=ids.slice(),rs=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];pairs.push(r%2?[b,a]:[a,b])}
    rs.push(pairs);arr.splice(1,0,arr.pop());
  }
  return[...rs,...rs.map(p=>p.map(([a,b])=>[b,a]))];
}
function spOrder(sp){
  return Object.keys(sp.rec).map(Number).sort((a,b)=>sp.rec[b].w-sp.rec[a].w||sp.rec[a].l-sp.rec[b].l||eff(T(b))-eff(T(a)));
}
function spPrep(){const sp=S.season.sp;sp.cur=sp.rounds[sp.ri].map(([a,b])=>mk(T(a),T(b),1))}
function spStart(tag){
  const mtp=mgrT()||pcT(),lg=mtp?mtp.lg:((S.opt&&S.opt.fl)||'LCK');
  S.teams.forEach(t=>{t.mom*=.9;t.hot=0});rollInj();
  const d2=!!(mtp&&mtp.d===2);
  S.season.res[tag]=LGS.filter(l=>d2||l!==lg).map(l=>runLeagueFull(l,tag));
  LGS.filter(l=>!d2||l!==lg).forEach(l=>runD2(l,tag));
  const ids=(d2?D2L():S.teams).filter(t=>t.lg===lg).map(t=>t.id);
  const rec={};ids.forEach(i=>rec[i]={w:0,l:0});
  S.season.sp={tag,lg,d2,rounds:roundRobin(shuffle(ids.slice())),ri:0,rec,stage:'rr',cur:null,last:[],sf:null};
  spPrep();
}
function spStep(){
  const sp=S.season.sp;
  if(sp.stage==='rr'){
    sp.cur.forEach(m=>{const w=play(m);sp.rec[w].w++;sp.rec[loserOf(m)].l++});
    sp.last=sp.cur;sp.ri++;lastPlayed={k:'sp'};
    if(sp.ri<sp.rounds.length){spPrep();return}
    const o=spOrder(sp);
    sp.stage='sf';sp.cur=[mk(T(o[0]),T(o[3]),5),mk(T(o[1]),T(o[2]),5)];return;
  }
  if(sp.stage==='sf'){
    sp.cur.forEach(m=>play(m));sp.sf=sp.cur;sp.last=sp.cur;lastPlayed={k:'sp'};
    sp.stage='fin';sp.cur=[mk(T(sp.sf[0].res.w),T(sp.sf[1].res.w),5)];return;
  }
  const fm=sp.cur[0];play(fm);
  if(sp.d2)closeD2(sp.lg,sp.tag,spOrder(sp).map(id=>({t:T(id)})),sp.sf[0],sp.sf[1],fm);
  else{const r=closeLeague(sp.lg,sp.tag,spOrder(sp).map(id=>({t:T(id)})),sp.sf[0],sp.sf[1],fm);
  const res=S.season.res[sp.tag];res.push(r);res.sort((a,b)=>LGS.indexOf(a.lg)-LGS.indexOf(b.lg))}
  S.season.sp=null;lastPlayed=null;
}
const spName=sp=>sp.tag==='s1'?'Split 1':'Split 2';
const spLabel=sp=>`${sp.lg} ${spName(sp)} · ${sp.stage==='rr'?`rodada ${sp.ri+1} de ${sp.rounds.length}`:sp.stage==='sf'?'semifinais':'final'}`;
const spBtn=sp=>sp.stage==='rr'?`Jogar rodada ${sp.ri+1}`:sp.stage==='sf'?'Jogar as semifinais':'Jogar a final';
const cmpRow=m=>{const r=m.res;return `<div class="cm"><span class="${r&&r.w===m.a?'w':''}">${tlk(T(m.a))}</span><b class="num">${r?`${r.wa}–${r.wb}`:'vs'}</b><span class="b ${r&&r.w===m.b?'w':''}">${tlk(T(m.b))}</span></div>`};
function spMatches(ms,fx){
  const mid=myTid();
  const mine=ms.filter(m=>m.a===mid||m.b===mid),rest=ms.filter(m=>m.a!==mid&&m.b!==mid);
  return mine.map((m,i)=>matchHTML(m,i,fx)).join('')+(rest.length?`<div class="cmw">${rest.map(cmpRow).join('')}</div>`:'');
}
function spHTML(){
  const sp=S.season.sp,mid=myTid(),ord=spOrder(sp);
  const fx=lastPlayed&&lastPlayed.k==='sp';
  let h=`<section class="pn"><h2>${sp.lg} · ${spName(sp)}</h2><p class="note" style="margin:0 0 8px">${sp.stage==='rr'?'Fase de grupos: todos contra todos, ida e volta. Os 4 primeiros vão aos playoffs.':'Playoffs: semifinais e final em melhor de 5.'}</p>`;
  h+=`<div class="grp">${ord.map((id,i)=>{const r=sp.rec[id];return `<div class="gr${i<4?' q':''}${id===mid?' mine':''}"><span>${i+1}. ${tlk(T(id))}</span><span class="num">${r.w}-${r.l}</span></div>`}).join('')}</div>`;
  h+=`<div class="sub">Próximos jogos · ${sp.stage==='rr'?`rodada ${sp.ri+1}`:sp.stage==='sf'?'semifinais':'final'}</div>${spMatches(sp.cur,false)}`;
  if(sp.last&&sp.last.length)h+=`<div class="sub">Resultados anteriores</div>${spMatches(sp.last,fx)}`;
  h+=`<div class="row" style="margin:12px 0 0">${sp.stage==='rr'?'<button class="ghost" data-act="spRR">Simular o resto da fase de grupos</button>':''}<button class="ghost" data-act="spAll">Simular o resto do split</button></div></section>`;
  return h;
}

/* ---------- MSI e Mundial ---------- */
const stageP=(name,pairs,n)=>({name,n,ms:pairs.map(([a,b])=>mk(a,b,n))});
const seedPairs=s=>[[s[0],s[7]],[s[3],s[4]],[s[2],s[5]],[s[1],s[6]]];

function startMSI(){
  const q=LGS.map(lg=>T(S.season.rank['s1'+lg][0]));
  ['LCK','LPL'].forEach(lg=>q.push(T(S.season.rank['s1'+lg][1])));
  q.forEach(t=>t.hot=0);
  q.sort((a,b)=>eff(b)-eff(a));
  S.season.msi={teams:q.map(t=>t.id),stages:[stageP('Quartas',seedPairs(q),5)],elim:{},champ:null,mvp:null};
}
function swissRound(tour,rnd){
  const open=tour.teams.filter(id=>tour.rec[id].w<3&&tour.rec[id].l<3);
  const groups={};
  open.forEach(id=>{const r=tour.rec[id],k=r.w+'-'+r.l;(groups[k]||(groups[k]=[])).push(id)});
  const ms=[];
  Object.keys(groups).sort().forEach(k=>{
    const ids=groups[k];let pairs=[];
    if(rnd===1){
      const h=ids.length/2,bot=shuffle(ids.slice(h));
      for(let i=0;i<h;i++)pairs.push([ids[i],bot[i]]);
    }else{
      let best=null;
      for(let a=0;a<80&&!best;a++){
        const s=shuffle(ids.slice());let ok=true;
        for(let i=0;i<s.length;i+=2)if(tour.rec[s[i]].opp.includes(s[i+1])){ok=false;break}
        if(ok)best=s;
      }
      if(!best)best=shuffle(ids.slice());
      for(let i=0;i<best.length;i+=2)pairs.push([best[i],best[i+1]]);
    }
    pairs.forEach(([a,b])=>{
      const dec=[a,b].some(id=>tour.rec[id].w===2||tour.rec[id].l===2);
      ms.push({...mk(T(a),T(b),dec?3:1),sw:k});
    });
  });
  return{name:`Suíço · Rodada ${rnd}`,n:0,ms,swiss:true,rnd};
}
function startWorlds(){
  const q=[];
  LGS.forEach(lg=>S.season.rank['s2'+lg].slice(0,SLOTS[lg]).forEach(id=>q.push(T(id))));
  q.forEach(t=>t.hot=0);
  q.sort((a,b)=>eff(b)-eff(a));
  const rec={};q.forEach(t=>rec[t.id]={w:0,l:0,opp:[]});
  const tour={teams:q.map(t=>t.id),rec,stages:[],elim:{},champ:null,mvp:null};
  tour.stages.push(swissRound(tour,1));
  S.season.wc=tour;
}
function playSwiss(tour){
  const si=tour.stages.length-1,st=tour.stages[si];
  st.ms.forEach(m=>{
    if(m.real)return;
    play(m);
    const w=m.res.w,l=loserOf(m),rw=tour.rec[w],rl=tour.rec[l];
    rw.w++;rl.l++;rw.opp.push(l);rl.opp.push(w);
    if(rl.l===3)tour.elim[l]='Suíço';
  });
  lastPlayed={k:'wc',si};
  const open=tour.teams.filter(id=>tour.rec[id].w<3&&tour.rec[id].l<3);
  if(open.length){tour.stages.push(swissRound(tour,st.rnd+1));return}
  const adv=tour.teams.filter(id=>tour.rec[id].w===3).sort((a,b)=>tour.rec[a].l-tour.rec[b].l||eff(T(b))-eff(T(a)));
  tour.stages.push(stageP('Quartas',seedPairs(adv.map(T)),5));
}
function playNext(tour,kind){
  const si=tour.stages.length-1,st=tour.stages[si];
  const ws=st.ms.map(m=>{play(m);tour.elim[loserOf(m)]=st.name;return m.res.w});
  lastPlayed={k:kind,si};
  if(ws.length===1){tour.champ=ws[0];return true}
  const pairs=[];for(let i=0;i<ws.length;i+=2)pairs.push([T(ws[i]),T(ws[i+1])]);
  tour.stages.push(stageP(ws.length===2?'Final':'Semifinais',pairs,5));
  return false;
}
function finishTour(tour,kind){
  const msi=kind==='msi';
  const B=msi?{C:4,F:2,SF:1,QF:-.5,G:0}:{C:5,F:3,SF:1.5,QF:0,G:-1.5};
  const M=msi?{C:1.5,F:1,SF:.5,QF:-.2,G:0}:{C:2,F:1.4,SF:.8,QF:.2,G:-.6};
  const WT=msi?1.3:2.2;
  const code=id=>id===tour.champ?'C':({Final:'F',Semifinais:'SF',Quartas:'QF'})[tour.elim[id]]||'G';
  tour.teams.forEach(id=>{
    const t=T(id),c=code(id);
    perf(t,B[c],WT);
    t.mom=clamp(.55*t.mom+M[c],-3,3);t.hot=0;
    if(c!=='C'){if(msi){if(c==='F'||c==='SF')mark(t,'msi',c)}else if(c!=='G')mark(t,'wc',c)}
  });
  S.teams.filter(t=>!tour.teams.includes(t.id)).forEach(t=>t.mom*=.85);
  const champ=T(tour.champ);
  const runner=T(+Object.keys(tour.elim).find(id=>tour.elim[id]==='Final'));
  award(champ,msi?'msi':'wc',msi?'MSI':'Mundial');
  {const lb=msi?'MSI':'Mundial',n=champ.tt.filter(x=>x.k===lb).length,bi=champ.tt.some(x=>x.k===lb&&x.y===S.year-1);news(`${champ.name} é campeão do ${lb} ${S.year}${bi?', bicampeão':''}: ${n}º título${n>1?'':''} do clube.`)}
  tour.mvp=giveMVP(msi?'MVP MSI':'MVP Mundial',champ,runner);
}

/* ---------- Bola de Ouro ---------- */
function chips(a){
  const c=[];
  if(a.wc==='C')c.push('Campeão do Mundial');else if(a.wc==='F')c.push('Vice do Mundial');else if(a.wc==='SF')c.push('Semifinal do Mundial');
  if(a.msi==='C')c.push('Campeão do MSI');else if(a.msi==='F')c.push('Vice do MSI');
  a.lg.forEach(l=>c.push('Campeão '+l));
  if(a.lgf)c.push(a.lgf>1?`Vice de liga ×${a.lgf}`:'Vice de liga');
  a.mv.forEach(l=>c.push(l));
  if(a.cp)c.push(a.cp);
  return c;
}
function awards(){
  const rows=[];
  S.teams.forEach(t=>t.pl.forEach(p=>{
    const o=S.season.perf[p.n];if(!o)return;
    const a=S.season.ach[p.n]||{lg:[],lgf:0,msi:'',wc:'',mv:[]};
    const ev=o.s/o.w;
    let sc=ev;
    const cb=(S.cupPend||{})[p.n];
    if(cb){sc+=cb.v;a.cp=cb.l}
    sc+=({C:10,F:4,SF:2})[a.wc]||0;
    sc+=({C:5,F:2})[a.msi]||0;
    sc+=a.lg.length*3+a.lgf;
    a.mv.forEach(l=>{sc+=l.startsWith('MVP Mundial')?2:l.startsWith('MVP MSI')?1.5:1});
    rows.push({n:p.n,role:p.role,team:t.name,tid:t.id,lg:t.lg,r:p.r,age:p.age,ev,sc,a});
  }));
  rows.sort((x,y)=>y.sc-x.sc);
  rows.forEach((x,i)=>{
    const o=psOf(x.n);
    const kda=clamp(KB[x.role]+(x.ev-x.r)*.1+(x.r-80)*.05+g()*.35,1.2,9);
    pd(x.n).seasons.push({y:S.year,tm:x.team,lg:x.lg,r:x.r,age:x.age,sc:r1(x.sc),pos:i+1,gw:o.gw,gl:o.gl,kda:r1(kda)});
  });
  S.cupPend=null;
  const top=rows.slice(0,10);
  const oldPos={};hofRank().forEach((n,i)=>oldPos[n]=i);
  top.forEach((x,i)=>{const h=hofOf(x.n);h.pts+=PTS[i];if(i===0)h.bd++});
  pd(top[0].n).tl.push({y:S.year,t:'Bola de Ouro',tm:top[0].team});
  {const hb=S.hof[top[0].n].bd;news(`${top[0].n} (${top[0].team}) vence a Bola de Ouro ${S.year}${hb>1?`, a ${hb}ª da carreira`:''}.`)}
  S.mv={};
  hofRank().slice(0,10).forEach((n,i)=>{S.mv[n]=oldPos[n]===undefined?'N':oldPos[n]-i});
  const msi=S.season.msi,wc=S.season.wc;
  const code=(tour,id)=>!tour.teams.includes(id)?'-':id===tour.champ?'C':({Final:'F',Semifinais:'SF',Quartas:'QF'})[tour.elim[id]]||'G';
  S.teams.forEach(t=>{
    const o=psOf(t.pl[0].n);
    t.yh.push({y:S.year,s1:(t.cs&&t.cs.s1)||0,s2:(t.cs&&t.cs.s2)||0,d:t.cs&&t.cs.s2d===2?2:undefined,
      msi:code(msi,t.id),wc:code(wc,t.id),gw:o.gw,gl:o.gl});t.cs0=t.cs;t.cs={};
    {const r=podItems(t.yh[t.yh.length-1]);if(r.it.length)t.pl.forEach(p=>{const d=pd(p.n);(d.pod=d.pod||[]).push({y:S.year,tm:t.name,it:r.it,v:r.v,q:r.q})})}
  });
  D2L().forEach(t=>{

    {const r=podItems(t.yh[t.yh.length-1]);if(r.it.length)t.pl.forEach(p=>{const d=pd(p.n);(d.pod=d.pod||[]).push({y:S.year,tm:t.name,it:r.it,v:r.v,q:r.q})})}

/* ---------- modo carreira (manager) ---------- */
const MCAP=30;
const goalTxt=(m,t)=>t&&t.d===2?'Subir para a primeira divisão (campeão da D2 e vencer o play-off)':GOALS[m.goal];
const GOALS=['Fazer boa campanha na liga','Classificar para o Mundial','Chegar às quartas do Mundial','Chegar às semifinais do Mundial','Chegar à final do Mundial'];
const fmtM=n=>`US$ ${(Math.round(n*10)/10).toFixed(1).replace('.',',')} mi`;
function mvOf(p){
  let v=Math.pow(Math.max(0,(p.r-68)/4),2);
  if(p.age<=23)v+=Math.max(0,p.pot-p.r)*.5*clamp((p.r-50)/25,.15,1);else if(p.age>=29)v*=Math.max(.3,1-.1*(p.age-28));
  return Math.max(.3,Math.round(v*10)/10);
}
const salOf=p=>Math.max(.2,Math.round(mvOf(p)*.18*10)/10);
const payroll=t=>r1(t.pl.reduce((s,p)=>s+salOf(p),0)+(S.mgr&&S.mgr.tid===t.id&&S.mgr.bench?S.mgr.bench.reduce((s,p)=>s+salOf(p),0):0));
const mgrT=()=>S.mgr&&S.mgr.tid!=null?T(S.mgr.tid):null;
const rankOfTeam=t=>t.d===2?99:S.teams.slice().sort((a,b)=>baseOvr(b)-baseOvr(a)).indexOf(t)+1;
function goalFor(t){if(t.d===2)return 3;const r=rankOfTeam(t);return r<=4?4:r<=10?3:r<=20?2:r<=36?1:0}
function genFA(){
  const out=[];
  for(let i=0;i<12;i++){
    const role=i%5,age=19+Math.floor(Math.random()*12);
    const r=clamp(72+Math.floor(Math.abs(g())*6)+(Math.random()<.2?5:0),72,90);
    const pot=age<=23?clamp(r+Math.floor(Math.random()*8),r,97):r;
    let n=uniqueName();while(out.some(x=>x.n===n))n=uniqueName();
    out.push({n,role,r,age,pot,f:0,d:0,nat:pick(poolM())});
  }
  return out;
}
function mgrStart(tid){
  const t=T(tid);
  S.mgr={tid,cash:t.d===2?6:12,sat:65,goal:goalFor(t),since:S.year,hist:[],log:[`Contratado pelo ${t.name} em ${S.year}.`],fa:genFA(),fired:false,acLv:1,ct:0,bench:[],loan:[],offers:[]};S.mgr.fa=genFA();mEnsure();
}
function mgrSeasonEnd(){
  const m=S.mgr,t=mgrT();if(!m||!t)return;
  const y=t.yh.find(x=>x.y===S.year);if(!y)return;
  const c0=t.cs0||{},d2m=c0.s2d?c0.s2d===2:t.d===2;
  const ach=d2m?(y.s2===1?5:(y.s2&&y.s2<=2)?3:(y.s2&&y.s2<=4)?1:0):y.wc==='C'?5:y.wc==='F'?4:y.wc==='SF'?3:y.wc==='QF'?2:y.wc==='G'?1:0;
  const lp=p=>p===1?3:p===2?1.5:p&&p<=4?.5:0;
  const gate=IM()*(d2m?4:10),spons=IM()*Math.max(0,baseOvr(t)-(d2m?62:70))*(d2m?.6:1),prize=d2m?IM()*(lp(y.s1)+lp(y.s2))*.6:IM()*(lp(y.s1)+lp(y.s2)+(({C:4,F:2.5,SF:1,QF:.3,G:0})[y.msi]||0)+(({C:10,F:6,SF:4,QF:2.5,G:.5})[y.wc]||0)),income=gate+spons+prize;
  mEnsure();const pay=payOn()?r1(payroll(t)):0,fixo=d2m?(payOn()?4:7):payOn()?8:14,up=r1(AC_UP[m.acLv]+CT_UP[m.ct]),net=r1(income-pay-fixo-up);
  m.cash=r1(m.cash+net);
  const best=Math.min(y.s1||99,y.s2||99);
  let d=(ach-m.goal)*9+(ach===5?8:0)+(best===1?8:best<=4?4:0);
  let note='';
  if(m.cash<0){m.cash=0;d-=10;note=' Caixa negativo: diretoria irritada.'}
  if(d<0)d*=SM();
  m.sat=clamp(Math.round(m.sat+d),0,100);
  m.hist.push({y:S.year,income:r1(income),gate:r1(gate),spons:r1(spons),prize:r1(prize),fixo,pay,up,net,cashEnd:m.cash,goal:m.goal,ach,sat:m.sat,wc:y.wc});
  m.log.unshift(`${S.year}: ${d2m?`D2: ${y.s1||'-'}º no Split 1 e ${y.s2||'-'}º no Split 2`:y.wc==='C'?'campeão do Mundial':y.wc==='-'?'fora do Mundial':'Mundial: '+CODE[y.wc]}; saldo ${net>=0?'+':''}${fmtM(net)}; confiança ${m.sat}%.${note}`);
  m.fa.forEach(p=>{if(S.pdb[p.n])S.pdb[p.n].ret=S.year});
  mAch();
  m.rep=clamp((m.rep==null?50:m.rep)+(ach>=m.goal?4+2*(ach-m.goal):-4+ (ach-m.goal)),0,100);
  if(m.sat<25){m.rep=clamp(m.rep-15,0,100);m.fired=true;m.tid=null;m.log.unshift(`${S.year}: demitido pela diretoria.`)}
}
function mgrNewYear(){
  const m=S.mgr,t=mgrT();if(!m)return;
  m.fa=genFA();
  if(t){m.goal=Math.min(5,goalFor(t)+((m.rep||50)>=80?1:0));m.log.unshift(`${S.year}: janela aberta. Meta da diretoria: ${goalTxt(m,t)}.`);mBaseYear()}
  m.log=m.log.slice(0,30);

function canBuy(p,t){
  const m=S.mgr;
  if(m.cheat)return{ok:true,net:0};
  if(!winOpen())return{ok:false,why:'Fechada'};
  const net=r1(Math.round(mvOf(p)*(p.r>=88?1.4:1.15)*PM()*10)/10);
  if(m.cash-net<0)return{ok:false,why:'Sem caixa',net};
  return{ok:true,net};
}
function mgrBuy(name,price){
  const mine=mgrT(),m=S.mgr;mEnsure();
  let src=null;S.teams.forEach(t=>t.pl.forEach(p=>{if(p.n===name)src={t,p}}));
  if(!src||src.t===mine)return;
  const c=canBuy(src.p,src.t);if(!c.ok){msg=c.why;return}
  const p=src.p,i=p.role,oth=src.t.pl.filter((_,j)=>j!==i);
  /* o time vendedor é obrigado a contratar alguém no lugar */
  const nr=fillSlot(src.t,i).p;
  src.t.pl[i]=nr;const d=pd(nr.n);d.role=i;d.debut=S.year+1;
  m.bench.push(p);pd(p.n).role=i;mCtr(p,3);
  const pay=price!=null?price:c.net;m.cash=r1(m.cash-pay);
  mlog(m.cheat?`${S.year}: cheat: ${p.n} (${src.t.name}) para as reservas.`:`${S.year}: comprou ${p.n} (${src.t.name}) por ${fmtM(pay)}; ele foi para as reservas e o ${src.t.name} contratou ${nr.n}.`);
  msg=`${p.n} está nas suas reservas. Promova-o a titular quando quiser.`;
}
let NG=null;
function mgrBid(v){
  const [name,pc]=String(v).split('|'),pct=+pc,m=S.mgr;mEnsure();
  let src=null;S.teams.forEach(t=>t.pl.forEach(p=>{if(p.n===name)src={t,p}}));
  if(!src||src.t===mgrT())return;
  const c=canBuy(src.p,src.t);if(!c.ok){msg=c.why;return}
  if(m.cheat){mgrBuy(name);NG=null;return}
  const key=S.year+':'+(S.phase<4?'a':'b');
  m.neg=m.neg||{};let ng=m.neg[name];if(!ng||ng.k!==key)ng=m.neg[name]={k:key,tries:0,counter:null};
  if(ng.tries>=2){msg=`${src.t.name} encerrou a negociação por ${name} nesta janela.`;return}
  const price=pct===-1?ng.counter:r1(c.net*pct/100);
  if(price==null)return;
  if(m.cash<price){msg='Sem caixa';return}
  let ok=pct===-1||pct>=100;
  if(!ok){
    let pr=pct>=90?.6:.28;
    if(src.p.age>=29)pr+=.15;if(rankOfTeam(src.t)<=6)pr-=.2;if(src.p.r>=90)pr-=.1;
    ok=Math.random()<pr;
  }
  if(ok){delete m.neg[name];NG=null;mgrBuy(name,price);return}
  ng.tries++;
  if(ng.tries>=2){ng.counter=null;msg=`${src.t.name} recusou e encerrou a negociação por ${name}.`}
  else{ng.counter=r1(Math.max(price,c.net*(pct>=90?.97:.95)));msg=`${src.t.name} recusou ${fmtM(price)} e pede ${fmtM(ng.counter)} por ${name}.`}
}
function mgrList(name){
  const m=S.mgr,f=mFind(name);if(!m||!f)return;
  m.listed=m.listed||{};
  if(m.listed[name]){delete m.listed[name];msg=`${name} saiu da lista de transferências.`}
  else{m.listed[name]=r1(mvOf(f.p)*1.25);msg=`${name} está à venda por ${fmtM(m.listed[name])}. Os clubes farão ofertas durante a janela.`}
}
function mgrSign(name){
  const mine=mgrT(),m=S.mgr;mEnsure();
  if(!winOpen()&&!m.cheat){msg='Janela fechada';return}
  const k=m.fa.findIndex(p=>p.n===name);if(k<0)return;

  const d=pd(p.n);d.role=p.role;d.debut=S.year+1;if(p.nat)d.nat=p.nat;

/* ---------- base, reservas, vendas e empréstimos ---------- */
const AC_UP=[0,1,2.5,4.5],CT_UP=[0,1.5,3.5,6],AC_COST=[0,0,6,12],CT_COST=[0,5,9,15];
const acCap=m=>3+2*(m.acLv||1);
const mlog=x=>{const m=S.mgr;m.log.unshift(x);m.log=m.log.slice(0,30)};
const mOpen=()=>!!S.mgr&&(winOpen()||!!S.mgr.cheat);
function prospect(){
  const m=S.mgr,lv=m.acLv||1;
  const role=Math.floor(Math.random()*5),age=16+Math.floor(Math.random()*3);
  const r=clamp(Math.round(56+Math.random()*8+lv*2+g()),54,70);
  const pot=clamp(Math.round(74+Math.abs(g())*7+Math.random()*6+lv*2),r+8,96);
  let n=uniqueName();
  while(m.fa&&m.fa.some(x=>x.n===n)||(m.acad||[]).some(x=>x.n===n))n=uniqueName();
  S.pdb[n]={role,debut:S.year+1,ret:null,seasons:[],tl:[],nat:pick(poolM())};
  return{n,role,r,pot,age,f:0,d:0,home:true};
}
function mEnsure(){
  const m=S.mgr;if(!m)return;
  m.acLv=m.acLv||1;m.ct=m.ct||0;m.bench=m.bench||[];m.loan=m.loan||[];m.offers=m.offers||[];
  if(!m.acad){m.acad=[];for(let i=0;i<3;i++)m.acad.push(prospect())}
  const t=mgrT();if(t)t.pl.concat(m.bench).forEach(p=>{if(p.ctr==null)p.ctr=2+Math.floor(Math.random()*3)});
}
function growProspect(p,bonus){
  const lv=S.mgr.acLv||1,o=p.r;p.age++;
  p.r=clamp(Math.round(p.r+clamp((p.pot-p.r)*.3+g()*1.5+lv*.5+(bonus||0),0,8)),50,p.pot);
  p.d=p.r-o;p.pot=Math.max(p.r,Math.round(p.pot+g()*1.2));
}
function growBench(p,bonus){
  const o=p.r;p.age++;
  p.r=clamp(Math.round(p.r+ageDelta(p)*.8+(bonus||0)-Math.max(0,p.r-88)*.2),55,99);
  p.d=p.r-o;p.pot=p.age<=24?Math.max(p.r,Math.round(p.pot+g()*.8)):p.r;
}
const bestRep=role=>{const m=S.mgr;return m.bench.concat(m.acad).filter(x=>x.role===role).sort((a,b)=>b.r-a.r)[0]||null};
function dropFrom(p){const m=S.mgr;let i=m.bench.indexOf(p);if(i>=0){m.bench.splice(i,1);return}i=m.acad.indexOf(p);if(i>=0)m.acad.splice(i,1)}
function mFind(n){
  const m=S.mgr,t=mgrT();if(!m||!t)return null;
  let i=t.pl.findIndex(p=>p.n===n);if(i>=0)return{k:'pl',i,p:t.pl[i]};
  i=m.bench.findIndex(p=>p.n===n);if(i>=0)return{k:'bench',i,p:m.bench[i]};
  i=m.acad.findIndex(p=>p.n===n);if(i>=0)return{k:'acad',i,p:m.acad[i]};
  return null;
}
const sellPrice=f=>r1(mvOf(f.p)*(f.k==='acad'?.6:f.k==='bench'?.85:.9));
function mExtra(n){
  const m=S.mgr,t=mgrT();if(!m||!t)return null;
  const p=(m.bench||[]).concat(m.acad||[]).find(x=>x.n===n);
  if(p)return{p,t:{name:t.name+' (reservas/base)'}};
  const l=(m.loan||[]).find(x=>x.p.n===n);
  return l?{p:l.p,t:{name:l.to+' (emprestado)'}}:null;
}
function mBaseYear(){
  const m=S.mgr,t=mgrT();mEnsure();
  t.pl.concat(m.bench).forEach(p=>{p.ctr=(p.ctr==null?2:p.ctr)-1;if(p.ctr<=0){p.exp=true;mlog(`${S.year}: o contrato de ${p.n} vence. Renove antes do Split 1 ou ele sai.`)}});
  m.acad.forEach(p=>growProspect(p,(m.focus==='jv'?1:0)+coachB(m)));
  m.bench.forEach(p=>growBench(p,(m.focus==='jv'?1:0)+coachB(m)));
  m.loan.forEach(l=>{
    if(l.from==='acad'){growProspect(l.p,1.2);m.acad.push(l.p)}else{growBench(l.p,1);m.bench.push(l.p)}
    mlog(`${S.year}: ${l.p.n} voltou do empréstimo (${l.to}) com OVR ${l.p.r}.`);
  });
  m.loan=[];
  m.acad=m.acad.filter(p=>{if(p.age>=21){m.bench.push(p);mlog(`${S.year}: ${p.n} saiu da base e foi para as reservas.`);return false}return true});
  m.bench=m.bench.filter(p=>{if(p.age>=33&&Math.random()<(p.age-31)*.18){pd(p.n).ret=S.year;mlog(`${S.year}: ${p.n} se aposentou nas reservas.`);return false}return true});
  const room=acCap(m)-m.acad.length;
  for(let i=0;i<Math.min(1+m.acLv,room);i++)m.acad.push(prospect());
  /* ofertas de outros clubes */
  m.offers=[];
  /* os clubes têm prioridade: chegam pedidos pelos seus melhores jogadores, mas você não é obrigado a vender */
  const cand=t.pl.concat(m.bench,m.acad);
  const nO=Math.min(cand.length,3+(Math.random()<.5?1:0));
  for(let k=0;k<nO;k++){
    const tot=cand.reduce((a,x)=>a+mvOf(x)+1,0);let r=Math.random()*tot,ix=0;
    for(;ix<cand.length-1;ix++){r-=mvOf(cand[ix])+1;if(r<=0)break}
    const p=cand.splice(ix,1)[0];
    const f=mFind(p.n);if(!f)continue;
    const w=S.teams.filter(x=>x!==t&&x.pl[p.role].r<p.r);
    const buyer=pick(w.length?w:S.teams.filter(x=>x!==t));
    m.offers.push({n:p.n,to:buyer.id,price:r1(mvOf(p)*(1.1+Math.random()*.4)*(f.k==='acad'?.85:1))});
  }
}
function mgrSell(name,price,buyerId){

  if(f.k==='pl'){dropFrom(rp);t.pl[f.i]=rp;pd(rp.n).role=rp.role}else dropFrom(p);
  const out=buyer.pl[p.role];
  buyer.pl[p.role]=p;pd(p.n).role=p.role;
  m.fa.push({...out,f:0,d:0});m.fa=m.fa.slice(-16);
  m.cash=r1(m.cash+price);if(p.home&&price>=10)m.homeSale=true;

  mlog(`${S.year}: vendeu ${p.n} (OVR ${p.r}) ao ${buyer.name} por ${fmtM(price)}${f.k==='pl'?`; ${rp.n} assume a vaga`:''}.`);
  msg=`${p.n} foi vendido ao ${buyer.name} por ${fmtM(price)}.`;
  return true;
}
function mgrLoan(name){
  const m=S.mgr,t=mgrT();mEnsure();

function mgrPromote(name){

function mgrRelease(name){

function mgrUp(k){
  const m=S.mgr;mEnsure();
  const key=k==='ac'?'acLv':'ct',cur=m[key]||0;
  if(cur>=3){msg='Nível máximo';return}

  m[key]=cur+1;
  mlog(`${S.year}: ${k==='ac'?'Academia':'Centro de treinamento'} no nível ${m[key]}.`);
  msg=`${k==='ac'?'Academia':'Centro de treinamento'} no nível ${m[key]}.`;

function mgrOffer(i,yes){
  const m=S.mgr,o=m.offers[i];if(!o)return;

}
const mb=(act,v,label,ok,cls)=>`<button class="mini${cls?' '+cls:''}" data-act="${act}" data-v="${esc(v)}"${ok?'':' disabled'}>${label}</button>`;
const more=(label,inner)=>`<details class="more"><summary class="mini sell">${label}</summary><div class="acts">${inner}</div></details>`;
const ctrTxt=p=>p.exp?'<span class="inj">contrato vence</span>':p.ctr!=null?`contrato ${p.ctr} ano${p.ctr>1?'s':''}`:'';
function elencoHTML(t,m,pay,lastH){
  const open=mOpen();

function pcYear(){
  const pc=S.pc;if(!pc||pc.ended)return;
  const f=pcFind();if(!f)return;
  const p=f.p,t=f.t,o=S.season.perf[p.n],y=t.yh[t.yh.length-1],a=S.season.ach[p.n]||{lg:[],msi:'',wc:'',mv:[]};
  /* crescimento anual dos atributos */
  const d=ageDelta(p)*.5;
  pc.at=pc.at.map(v=>clamp(Math.round(v+d+g()*.7),38,Math.min(99,pc.cap)));
  const bh=S.hist[S.hist.length-1],ix=bh?bh.top.findIndex(x=>x.n===p.n):-1;
  let rating=null;
  if(!f.bn&&!o){const c=t.cs0||t.cs||{},ps=[c.s1,c.s2].filter(Boolean);if(ps.length){const bn=ps.reduce((a,b)=>a+b,0)/ps.length;rating=clamp(r1(6.8-(bn-4)*.25),3,10)}}
  if(!f.bn&&o){
    const ev=o.s/o.w;
    const bon=(y?(({C:1.2,F:.8,SF:.4,QF:.4})[y.wc]||0)+(y.s1&&y.s1<=2?.3:0)+(y.s2&&y.s2<=2?.3:0):0)+(ix>=0?.8:0);
    rating=clamp(r1(6.3+(ev-pc.r0)*.3+bon),3,10);
    if(pc.mr&&pc.mr.length){const ma=pc.mr.reduce((a,b)=>a+b,0)/pc.mr.length;rating=clamp(r1(.5*rating+.5*ma),3,10)}
  }
  pc.mr=[];
  const trophies=(a.lg||[]).length+(a.msi==='C'?1:0)+(a.wc==='C'?2:0);
  pc.fame=clamp(Math.round(pc.fame+(rating!=null?(rating-6)*3:-1)+trophies*4+(ix>=0?5:0)),0,100);
  if(rating!=null&&rating>=7)pc.pts=(pc.pts||0)+(rating>=8.5?3:rating>=8?2:1);
  pc.cash=r1(pc.cash+pc.sal);pc.ctr--;
  pcSync();pc.r0=p.r;pc.cap=Math.max(pc.cap,p.pot+2);
  pc.hist.push({y:S.year,team:t.name,div:t.d===2?2:1,role:p.role,ovr:p.r,age:p.age,rating,bn:f.bn,titles:trophies,top:ix>=0?ix+1:0});
  pcLog(`temporada fechada no ${t.name}: ${rating!=null?'nota '+String(rating).replace('.',','):'no banco'}; OVR ${p.r}.`);
  /* metas */
  const wc=S.season.wc,msi=S.season.msi,ctx={msi:!!(msi&&msi.teams.includes(t.id)),wc:!!(wc&&wc.teams.includes(t.id)),lg:(a.lg||[]).length>0,top10:ix>=0,wcc:a.wc==='C',bola:ix===0};
  PGOALS.forEach(([id,l,dsc,fn,fm])=>{if(!pc.goals[id]&&fn(f,ctx)){pc.goals[id]=S.year;pc.fame=clamp(pc.fame+fm,0,100);pc.pts=(pc.pts||0)+2;pcLog(`meta cumprida: ${l} (+2 pontos de atributo).`)}});
  /* renovação automática do contrato */
  if(pc.ctr<=0){pc.ctr=1;pcLog('contrato renovado por mais um ano nas mesmas condições.')}
}
function pcPlayOk(){return winOpen()||S.phase===0}
function pcOffers(){
  const pc=S.pc;if(!pc||pc.ended)return;
  const f=pcFind();if(!f){pc.offers=[];return}
  const p=f.p,role=p.role,L=[];
  ALLT().forEach(t=>{
    if(t===f.t)return;
    const st=t.pl[role],tier=t.d===2?0:1;
    let kind=null;
    if(p.r>=st.r-1)kind='T';else if(tier===1&&p.r>=st.r-8&&p.r>=70)kind='R';
    if(!kind)return;
    const base=salOf(p)*(tier?1.35:.9)*(1+pc.fame/180)*(kind==='R'?.6:1);
    L.push({tn:t.name,k:kind,sal:Math.max(.2,r1(base)),yrs:1+Math.floor(Math.random()*3),pr:baseOvr(t)});
  });
  L.sort((a,b)=>b.pr-a.pr);
  const pick_=[...L.slice(0,2),...shuffle(L.slice(2)).slice(0,2)];
  pc.offers=pick_.map(x=>({tn:x.tn,k:x.k,sal:x.sal,yrs:x.yrs}));
  pc.offers.unshift({tn:f.t.name,k:f.bn?'R':'T',sal:r1(Math.max(pc.sal,salOf(p))*1.1),yrs:2,ren:true});
}
function pcAccept(i){
  const pc=S.pc,o=pc.offers[i],f=pcFind();if(!o||!f)return;
  if(!pcPlayOk()){msg='A janela de transferências está fechada.';return}
  if(o.ren){pc.sal=o.sal;pc.ctr=o.yrs;pcLog(`renova com o ${o.tn} por ${o.yrs} ano${o.yrs>1?'s':''}.`);msg='Contrato renovado.';pc.offers=pc.offers.filter((_,j)=>j!==i);return}
  const nt=ALLT().find(t=>t.name===o.tn);if(!nt)return;
  const p=f.p,role=p.role,ot=f.t;
  if(f.bn)ot.bn.splice(ot.bn.indexOf(p),1);else ot.pl[role]=fillSlot(ot,role).p;
  nt.bn=nt.bn||[];
  if(o.k==='T'){const old=nt.pl[role];nt.pl[role]=p;nt.bn.push(old)}else nt.bn.push(p);
  nt.bn.sort((a,b)=>b.r-a.r);while(nt.bn.length>3){const w=nt.bn.pop();if(w.pc)nt.bn.unshift(w)}
  pd(p.n).role=role;pc.sal=o.sal;pc.ctr=o.yrs;pc.offers=[];
  pcLog(`assina com o ${nt.name} (${o.k==='T'?'titular':'reserva'}) por ${o.yrs} ano${o.yrs>1?'s':''}, salário ${fmtM(o.sal)}.`);
  news(`${p.n} deixa o ${ot.name} e assina com o ${nt.name}.`);
  msg=`Você assinou com o ${nt.name}.`;
}

}

}
function pcDraftD(m){
  const f=pcFind();if(!f||!m.od||!S.pc.dr)return 0;
  const t=f.t,op=T(m.a===t.id?m.b:m.a),bp=bestPicks(t,0),pk=t.pl.map((p,i)=>S.pc.dr[i]||bp[i]);
  return clamp((compScore(t,pk,m.odm)-compScore(op,m.od,compMaj(pk)))*.012,-.07,.07);

function lvRec(){
  if(LV.pc){
    const f=pcFind(),pc=S.pc,p=f.p,op=lvTeam('op').pl[p.role],gap=p.r-op.r,pr=lvP(),lead=LV.lead,cp=LV.cp;
    if(pc.en<40)return{k:'sf',why:'Energia baixa: jogue seguro para não errar.'};
    if(lead>=3)return{k:'sf',why:'Seu time está à frente: jogue seguro e feche o mapa.'};
    if(lead<=-3)return gap>=0?{k:'cr',why:`Atrás no mapa, mas você leva vantagem na lane (${gap>=0?'+':''}${gap} de OVR): busque a virada.`}:{k:'tm',why:'Atrás e sem vantagem na lane: ajude o time com visão e peel.'};
    if(gap>=3&&cp<2)return{k:'cr',why:`Você tem +${gap} de OVR sobre ${op.n}: abuse da lane.`};
    if(pr<.42)return{k:'tm',why:'O time é azarão neste mapa: priorize o coletivo.'};
    if(cp===2&&pr>=.55)return{k:'sf',why:'Fase final com vantagem: evite erros.'};
    return{k:'sf',why:'Jogo parelho: jogue pelo básico e espere o erro do rival.'};
  }
  const m=LV.m,cp=LV.cp,lead=LV.lead,my=LV.us==='a'?lead:-lead;
  const ctr=h=>Object.keys(BEATS).find(k=>BEATS[k]===h);
  if(cp===0&&m.hint)return{k:ctr(m.hint)||'eq',why:`O analista aponta que o rival joga ${planName(m.hint)}: ${planName(ctr(m.hint)||'eq')} leva vantagem.`};
  if(my>=3)return{k:'co',why:'Você está à frente: Controle fecha o mapa com segurança.'};
  if(my<=-3)return{k:'ag',why:'Você está atrás: Agressivo tenta a virada.'};
  return{k:'eq',why:'Jogo parelho: Equilibrado evita riscos.'};
}
const lvRecHTML=r=>`<p class="lvrec">💡 <b>Recomendado: ${r.k==='sf'?'Seguro':r.k==='cr'?'Buscar o jogo':r.k==='tm'?'Pelo time':planName(r.k)}.</b> ${esc(r.why)}</p>`;
function lvPick(c){
  if(!LV||!LV.pc||LV.state!=='pick'||!c)return;
  if(LV.used.includes(c)){msg='Fearless: você já usou esse campeão nesta série.';return}
  const f=pcFind(),pc=S.pc;
  LV.ch=c;
  const d=(mastOf(pc.n,c)-.5)*.06+metaOf(c)*.03;
  LV.adj=clamp(LV.adj+d,-.15,.15);
  LV.log.unshift({m:0,t:`Você escolhe ${c} (domínio ${Math.round(mastOf(pc.n,c)*100)}%${metaOf(c)>=.2?', forte no meta':metaOf(c)<=-.2?', fraco no meta':''}).`,k:'sys'});
  LV.state='ckpt';
}
function lvPosture(k){
  if(!LV||!LV.pc||LV.state!=='ckpt')return;
  const f=pcFind(),pc=S.pc,p=f.p,op=lvTeam('op').pl[p.role];
  let t='';
  if(k==='sf'){LV.adj+=.005;LV.ps+=.2;t='Postura segura: você joga pelo básico.'}
  else if(k==='tm'){LV.adj+=.015;LV.ps+=.1;t='Você prioriza o time: visão, rotação e peel.'}
  else{
    const q=clamp(.5+(p.r-op.r)*.03+(mastOf(pc.n,LV.ch)-.5)*.2+(pc.en-50)*.002+(LV.lead>0?.05:0),.15,.85);
    if(Math.random()<q){LV.adj+=.03;LV.ps+=1;t=`Você busca o jogo e acerta: ${p.n} domina ${op.n}.`}
    else{LV.adj-=.02;LV.ps-=.8;t=`Você força demais e paga caro contra ${op.n}.`}
  }
  LV.adj=clamp(LV.adj,-.18,.18);
  LV.log.unshift({m:LV.min,t,k:'sys'});
  if(LV.cp===2)LV.win=Math.random()<lvP();
  LV.state='run';lvLoop();
}
function pcGameEnd(win){
  const f=pcFind(),pc=S.pc,p=f.p,role=p.role;
  const rt=clamp(r1(6+LV.ps+(win?.7:-.5)+(mastOf(pc.n,LV.ch)-.5)*1.2+g()*.5),3,10);
  const x=rt-6,ka=role===4?.5:1;
  const k=Math.max(0,Math.round((1.5+x*1.3+Math.random()*2)*ka)),d=Math.max(0,Math.round(4.5-x*.9+Math.random()*2)),a=Math.max(0,Math.round((role===4?9:role===1?6:4)+x*1.4+Math.random()*3));
  LV.gr.push({c:LV.ch,rt,k,d,a,win});LV.used.push(LV.ch);
  LV.log.unshift({m:LV.min,t:`Sua nota no mapa: ${String(rt).replace('.',',')} (${k}/${d}/${a}) com ${LV.ch}.`,k:'end'});
}
function pcMatchEnd(){
  const pc=S.pc;if(!pc||!LV||!LV.gr.length)return;
  const avg=r1(LV.gr.reduce((s,x)=>s+x.rt,0)/LV.gr.length);
  pc.mr=(pc.mr||[]).concat(avg).slice(-60);
  if(avg>=8.5)pc.fame=clamp(pc.fame+1,0,100);
  const pp=avg>=9.2?2:avg>=8.4?1:0;
  if(pp)pcPts(pp,`série ${LV.me>LV.op?'vencida':'perdida'}, nota ${String(avg).replace('.',',')}`);
  const best=LV.gr.slice().sort((a,b)=>b.rt-a.rt)[0];
  pcLog(`série ${LV.me>LV.op?'vencida':'perdida'} ${LV.me}–${LV.op}, nota ${String(avg).replace('.',',')}; destaque: ${best.c} (${best.k}/${best.d}/${best.a}).`);
}

function chem(t){
  const ns=t.pl.map(p=>natC(p.n)).filter(Boolean);let s=0;
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){if(ns[i]===ns[j])s+=2;else if(CONT&&CONT[ns[i]]&&CONT[ns[i]]===CONT[ns[j]])s+=1}
  return Math.min(100,Math.round(s*100/20));
}

function closeD2(lg,tag,st,m1,m2,fm){

  const champ=T(fm.res.w),runner=T(loserOf(fm));
  const order=[champ,runner,...third,...st.slice(4).map(r=>r.t)];
  S.season.rank['d'+tag+lg]=order.map(t=>t.id);
  const n=order.length;
  order.forEach((t,i)=>{t.cs=t.cs||{};t.cs[tag]=i+1;t.cs[tag+'d']=2;perf(t,[3,1.5,.5,.5,-.5,-1][i]??-1,1);t.mom=clamp(.55*t.mom+1.2*(1-2*i/(n-1))+(i===0?.5:0),-3,3);t.hot=0});

function runD2(lg,tag){
  const ts=D2L().filter(t=>t.lg===lg);
  const rec=new Map(ts.map(t=>[t.id,{t,w:0,l:0}]));
  for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++)for(let k=0;k<2;k++){
    const m=mk(ts[i],ts[j],1);const w=play(m);rec.get(w).w++;rec.get(loserOf(m)).l++;
  }
  const st=[...rec.values()].sort((x,y)=>y.w-x.w||Math.random()-.5);
  const top=st.slice(0,4).map(r=>r.t);
  const ser=(a,b)=>{const m=mk(a,b,5);play(m);return m};
  const m1=ser(top[0],top[3]),m2=ser(top[1],top[2]);

/* Copa do Mundo de LoL: de 4 em 4 anos (2026, 2030...), 8 seleções com o melhor de cada posição */
const CUPY=y=>y>=2026&&(y-2026)%4===0;
const CONT={KOR:'AS',CHN:'AS',VIE:'AS',TWN:'AS',JPN:'AS',AUS:'OC',USA:'NA',CAN:'NA',MEX:'NA',BRA:'SA',ARG:'SA',CHI:'SA'};
['FRA','GER','ESP','DEN','SWE','POL','GRE','TUR','CZE','UKR','SLO','BUL','BEL','SVK','NED','ITA','POR','LTU','ROU','CRO','EST','FIN','NOR','SRB','HUN','IRL'].forEach(c=>CONT[c]='EU');
['THA','PHI','IDN','MAS','SIN','HKG','IND','KAZ'].forEach(c=>CONT[c]='AS');['COL','PER','URU'].forEach(c=>CONT[c]='SA');CONT.NZL='OC';
const NEAR={EU:['EU'],AS:['AS','OC'],OC:['OC','AS'],NA:['NA','SA'],SA:['SA','NA']};
/* formato da Copa do Mundo de futebol: grupos de 4 (todos contra todos, 3 rodadas), os 2 primeiros avançam,
   mata-mata (oitavas/quartas/semifinais), disputa de 3º lugar e final. 32 seleções quando há países suficientes, senão 16 ou 8. */
function startCup(){
  fixNat();
  const by={};
  S.teams.forEach(t=>t.pl.forEach(p=>{const c=natC(p.n);if(!c||(S.inj&&S.inj[p.n]))return;(by[c]=by[c]||[]).push(p)}));
  const all=Object.keys(by).map(c=>{
    const pl=[],cov=[];
    for(let i=0;i<5;i++){const b=by[c].filter(p=>p.role===i).sort((a,b)=>b.r-a.r)[0];if(b){pl[i]=b;cov.push(b.r)}}
    return{c,pl,n:cov.length,sum:cov.reduce((a,b)=>a+b,0)/Math.max(1,cov.length)};
  });
  let cand=all.filter(x=>x.n>=2);
  if(cand.length<8)cand=all.filter(x=>x.n>=1);
  cand.sort((a,b)=>(b.n>=3)-(a.n>=3)||b.sum-a.sum);
  const N=cand.length>=32?32:cand.length>=16?16:8;
  const top=cand.slice(0,N);
  const used=new Set();top.forEach(x=>x.pl.forEach(p=>p&&used.add(p.n)));
  const teams=top.map(x=>{
    const pl=[0,1,2,3,4].map(i=>{
      let p=x.pl[i],ext=false;
      if(!p){
        const al=S.teams.flatMap(t=>t.pl).filter(q=>q.role===i&&!used.has(q.n)&&!(S.inj&&S.inj[q.n]));
        const cont=CONT[x.c]||'EU',near=NEAR[cont]||[cont];
        for(const ck of [[cont],near,null]){
          const pool=ck?al.filter(q=>ck.includes(CONT[natC(q.n)])):al;
          if(pool.length){p=pool.sort((a,b)=>b.r-a.r)[0];break}
        }
        used.add(p.n);ext=true;
      }
      return{n:p.n,r:p.r,f:p.f,role:i,ext};
    });
    return{id:x.c,name:NATN[x.c]||x.c,pl,mom:0,hot:0};
  });
  teams.sort((a,b)=>eff(b)-eff(a));
  /* sorteio: 4 potes por força, um de cada pote em cada grupo */
  const G=N/4,groups=[];
  const pots=[0,1,2,3].map(k=>shuffle(teams.slice(k*G,(k+1)*G).map(t=>t.id)));
  for(let i=0;i<G;i++)groups.push({name:'Grupo '+String.fromCharCode(65+i),ids:[0,1,2,3].map(k=>pots[k][i])});
  const rec={};teams.forEach(t=>rec[t.id]={j:0,p:0,w:0,d:0,l:0,gw:0,gl:0});
  const cup={y:S.year,N,teams,groups,rec,gst:[],stages:[],elim:{},champ:null,third:null,mvp:null,gi:0};
  const RR=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  RR.forEach((rd,ri)=>{
    const ms=[];
    groups.forEach((g,gi)=>rd.forEach(([a,b])=>ms.push({...cupMk(CT2(cup,g.ids[a]),CT2(cup,g.ids[b]),2),grp:gi})));
    cup.gst.push({name:`Fase de grupos · Rodada ${ri+1}`,ms});
  });
  S.season.cup=cup;
}
const CT2=(cup,id)=>cup.teams.find(t=>t.id===id);
const CT=id=>CT2(S.season.cup,id);
function cupMk(a,b,n){
  const d=eff(a)-eff(b),qa=1/(1+Math.pow(10,-d/kgNow()));
  return{a:a.id,b:b.id,n,d,pa:n===2?qa*qa:seriesP(qa,n),pd:n===2?2*qa*(1-qa):0,qa,res:null};
}
function cupPlay(m){
  if(m.n===2){
    let wa=0,wb=0;for(let k=0;k<2;k++)Math.random()<m.qa?wa++:wb++;
    m.res={wa,wb,w:wa>wb?m.a:wb>wa?m.b:null};return m.res.w;
  }
  const need=Math.ceil(m.n/2);let wa=0,wb=0;
  while(wa<need&&wb<need){Math.random()<m.qa?wa++:wb++}
  m.res={wa,wb,w:wa>wb?m.a:m.b};
  return m.res.w;

function cupGroupOrder(cup,g){
  const sd=id=>cup.teams.findIndex(t=>t.id===id);
  return g.ids.slice().sort((a,b)=>{const x=cup.rec[a],y=cup.rec[b];return y.p-x.p||(y.gw-y.gl)-(x.gw-x.gl)||y.gw-x.gw||sd(a)-sd(b)});
}
const koName=n=>n>=8?'Oitavas':n>=4?'Quartas':'Semifinais';
function cupStep(){
  const cup=S.season.cup;if(!cup||cup.champ!=null)return;
  if(cup.gi<3){
    const st=cup.gst[cup.gi];
    st.ms.forEach(m=>{
      cupPlay(m);const r=m.res,A=cup.rec[m.a],B=cup.rec[m.b];
      A.j++;B.j++;A.gw+=r.wa;A.gl+=r.wb;B.gw+=r.wb;B.gl+=r.wa;
      if(r.w===m.a){A.w++;A.p+=3;B.l++}else if(r.w===m.b){B.w++;B.p+=3;A.l++}else{A.d++;B.d++;A.p++;B.p++}

      ord.forEach(o=>{cup.elim[o[2]]='Fase de grupos';cup.elim[o[3]]='Fase de grupos'});
      const l1=[],l2=[],G=cup.groups.length;
      for(let k=0;k<G;k+=2){l1.push([ord[k][0],ord[k+1][1]]);l2.push([ord[k+1][0],ord[k][1]])}
      const pairs=[...l1,...l2];

    cup.elim[m3.res.w===m3.a?m3.b:m3.a]='Quarto';cup.elim[mf.res.w===mf.a?mf.b:mf.a]='Vice';cup.elim[cup.third]='Terceiro';

let AC=null;
function tone(f,d,t0,type,v){
  const c=AC,o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);
  const t=c.currentTime+(t0||0);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.06,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.start(t);o.stop(t+d+.02);
}
function snd(k){
  if(!sndOn())return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    if(k==='win'){tone(523,.12,0,'triangle');tone(659,.12,.1,'triangle');tone(784,.22,.2,'triangle')}
    else if(k==='lose'){tone(330,.16,0,'sawtooth',.04);tone(247,.28,.14,'sawtooth',.04)}
    else if(k==='cheer'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.09,'triangle',.07));tone(1047,.5,.4,'sine',.06)}
    else tone(660,.05,0,'sine',.03);
  }catch(e){}
}
function sndAfter(){

}

function ovrChart(ss){
  const pts=ss.filter(x=>x.r).map(x=>({y:x.y,r:x.r,a:x.age}));

  const W=320,H=130,P=26,lo=Math.min(...pts.map(p=>p.r))-2,hi=Math.max(...pts.map(p=>p.r))+2;
  const X=i=>P+i*(W-P*1.6)/(pts.length-1),Y=r=>H-22-(r-lo)*(H-40)/Math.max(1,hi-lo);

  return `<section class="pn"><h2>Evolução do OVR</h2><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do OVR por temporada" style="display:block"><polyline points="${pts.map((p,i)=>X(i)+','+Y(p.r)).join(' ')}" fill="none" stroke="#00F5A0" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.r)}" r="${p===pk?5:3}" fill="${p===pk?'#FFE27A':'#00C2FF'}"/>${i%step===0||p===pk?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#A9B4E6">${p.y}</text>`:''}`).join('')}<text x="${X(pts.indexOf(pk))}" y="${Y(pk.r)-9}" text-anchor="middle" font-size="12" font-weight="700" fill="#FFE27A">${pk.r}</text></svg><p class="note" style="margin:6px 0 0">Pico: ${pk.r} em ${pk.y}, aos ${pk.a} anos.</p></section>`;
}

function heroMatch(){

  return ms.find(m=>m.a===mid||m.b===mid)||ms.slice().sort((a,b)=>(eff(T(b.a))+eff(T(b.b)))-(eff(T(a.a))+eff(T(a.b))))[0]||null;

function calGrid(){
  const td=dayNow(),x=dmy(td),f=new Date(Date.UTC(S.year,x.m,1)).getUTCDay(),n=MDN[x.m];

  const cells=[];for(let i=0;i<f;i++)cells.push('<i></i>');
  for(let d=1;d<=n;d++)cells.push(`<span class="cd${d===x.d?' td':''}${evs[d]?' ev':''}${base+d<td?' past':''}" ${evs[d]?`title="${esc(evs[d])}"`:''}>${d}</span>`);
  return `<div class="cgrid"><div class="chd">${DSEM.map(s=>`<b>${s}</b>`).join('')}</div><div class="cbd">${cells.join('')}</div></div>`;
}

  if(S.year===2026&&cur&&cur.g<=3&&S.phase>0)d+=`<section class="pn"><h2>Ponto de partida real</h2><p class="note" style="margin:0">Mundial 2026 no Suíço: jogos já decididos aparecem como resultado real; só o que falta é simulado. MSI e ligas de 2026 e os títulos da carreira (Faker com 6 Mundiais e 4 Bolas de Ouro) já estão no histórico. OVR e idades são notas minhas.</p></section>`;
  d+=cupHTML()+tourHTML(S.season.wc,'wc','Mundial')+splitHTML('s2','Split 2')+tourHTML(S.season.msi,'msi','MSI')+splitHTML('s1','Split 1');
  h+=`<details class="pn det more2"${lastPlayed?' open':''}><summary>Detalhes: calendário do mês, tabelas e resultados</summary>${d}</details>`;
  if(S.phase===0&&!S.off.length)h+=`<p class="empty">Cada temporada tem dois splits, o MSI e o Mundial com fase suíça. Você joga fase por fase e vê as chances de cada partida antes de simular. Toque em qualquer nome para abrir a ficha.</p>`;
  return h;
}

/* ---------- bola de ouro ---------- */
function preHTML(){
  if(!S.pre||!S.pre.length)return '';
  return `<section class="pn"><h2>Top 5 de 2011 a 2025</h2>${[...S.pre].reverse().map(x=>`<div class="rowl"><span class="lg num">${x.y}</span><span class="grow"><b>${lk(x.top[0].n)}</b> <small>${esc(x.top[0].team)}</small>${x.top.length>1?`<br><small>${x.top.slice(1).map(t=>lk(t.n)).join(' · ')}</small>`:''}</span></div>`).join('')}<p class="note">Seu ranking dos anos anteriores. Faker tem 4 Bolas de Ouro; Ruler e Chovy, 2 cada.</p></section>`;
}
function vBola(){
  if(!S.hist.length)return `<p class="empty">Nenhuma temporada de 2026 em diante fechada ainda. Jogue até a Bola de Ouro para ver o top 10 do ano.</p><button class="ghost" data-act="tab" data-v="season">Ir para a temporada</button>`+preHTML();
  const ys=S.hist.map(h=>h.y).reverse();
  const cur=S.hist.find(h=>h.y===selYear)||S.hist[S.hist.length-1];
  const w=cur.top[0];
  let h=`<div class="pills">${ys.map(y=>`<button class="pill" aria-pressed="${y===cur.y}" data-act="year" data-v="${y}">${y}</button>`).join('')}</div>`;
  h+=`<section class="hero"><div class="k">Bola de Ouro ${cur.y}</div><div class="nm">${lk(w.n)}</div>${hx(w.r,'dk lg')}<div class="tm">${esc(w.team)} · ${esc(w.lg)} · ${RN[w.role]}</div><div>${w.ch.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></section>`;
  const pdm=i=>{const x=cur.top[i];return `<div class="pd p${i+1}">${hx(x.r,'sm')}<b>${lk(x.n)}</b><small>${esc(x.team)}</small><div class="bs">${i+1}</div></div>`};
  h+=`<div class="podium">${pdm(1)}${pdm(0)}${pdm(2)}</div>`;

  const c=cur.champs;
  h+=`<section class="pn"><h2>Campeões de ${cur.y}</h2><div class="rowl"><span class="grow"><b>Mundial</b> ${esc(c.wc)}<br><small>MVP ${lk(c.mvp)}</small></span></div><div class="rowl"><span class="grow"><b>MSI</b> ${esc(c.msi)}<br><small>MVP ${c.msiMvp?lk(c.msiMvp):'–'}</small></span></div><div class="rowl"><span class="grow"><b>Split 1</b><br><small>${c.s1.map(esc).join(' · ')}</small>${c.mv1?`<br><small>MVPs: ${c.mv1.map(esc).join(' · ')}</small>`:''}</span></div><div class="rowl"><span class="grow"><b>Split 2</b><br><small>${c.s2.map(esc).join(' · ')}</small>${c.mv2?`<br><small>MVPs: ${c.mv2.map(esc).join(' · ')}</small>`:''}</span></div></section>`;
  return h+preHTML();
}

/* ---------- lendas ---------- */
function ttCount(t){
  return{wc:t.tt.filter(x=>x.k==='Mundial').length,msi:t.tt.filter(x=>x.k==='MSI').length,lg:t.tt.filter(x=>x.k!=='Mundial'&&x.k!=='MSI').length};
}
function plistHTML(){
  const PM=pmap();
  const names=[...new Set([...Object.keys(S.pdb),...Object.keys(S.hof)])];
  let rows=names.map(n=>{
    const P=PM[n],d=S.pdb[n]||{seasons:[]},h=S.hof[n]||{pts:0,bd:0,wc:0,msi:0,lg:0,mvp:0};
    const last=d.seasons[d.seasons.length-1];
    return{n,P,h,act:!!P,r:P?P.p.r:(last?last.r:0)};
  });
  if(pf==='a')rows=rows.filter(x=>x.act);else if(pf==='r')rows=rows.filter(x=>!x.act);
  const q=qStr.trim().toLowerCase();
  if(q)rows=rows.filter(x=>x.n.toLowerCase().includes(q));
  rows.sort((a,b)=>sc(b.h)-sc(a.h)||b.r-a.r||a.n.localeCompare(b.n));
  const tot=rows.length;
  let h=rows.slice(0,60).map(x=>{
    const tt=[x.h.bd?`${x.h.bd} Bola${x.h.bd>1?'s':''}`:'',x.h.wc?`${x.h.wc} Mundial${x.h.wc>1?'is':''}`:'',x.h.msi?`${x.h.msi} MSI`:''].filter(Boolean).join(' · ');
    return `<div class="pl">${x.r?hx(x.r,'sm'):'<span class="hx sm">–</span>'}<span><span class="nm2">${lk(x.n)}</span><span class="tag">${x.act?'ativo':'aposentado'}</span><br><small>${x.act?esc(x.P.t.name)+' · '+RN[x.P.p.role]:'fora do jogo'}${tt?' · '+tt:''}</small></span><span class="pt num">${r1(x.h.pts)}<small>pts</small></span></div>`;
  }).join('');
  if(!tot)h=`<p class="empty">Nenhum jogador encontrado.</p>`;
  if(tot>60)h+=`<p class="note">Mostrando 60 de ${tot}. Use a busca para achar os demais.</p>`;
  return h;
}

function pwr(t){
  let ti=0;t.tt.forEach(x=>{const a=S.year-x.y;if(a<0||a>4)return;const w=[1,.7,.5,.35,.2][a];ti+=w*(x.k==='Mundial'?10:x.k==='MSI'?5:2)});
  const yh=t.yh.slice(-2),gw=yh.reduce((a,s)=>a+s.gw,0),gl=yh.reduce((a,s)=>a+s.gl,0);
  const wr=gw+gl?gw/(gw+gl):.5;
  return (eff(t)-60)*2+Math.min(ti,30)*1.2+(wr-.5)*20;
}
function pwRank(){return S.teams.map(t=>({t,v:pwr(t)})).sort((a,b)=>b.v-a.v)}
function pwPos(t){return pwRank().findIndex(x=>x.t.id===t.id)+1}
function pwHTML(){
  const r=pwRank();
  if(!S.pwCur){S.pwCur={};r.forEach((x,i)=>S.pwCur[x.t.id]=i+1)}
  const rows=r.slice(0,30).map((x,i)=>{
    const o=S.pwCur[x.t.id],d=o?o-(i+1):0;
    const m=d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv dn">▼${-d}</span>`:'';
    const c=ttCount(x.t);
    return `<li><span class="pos num">${i+1}</span>${hx(Math.round(baseOvr(x.t)),'sm')}<span><span class="nm2">${tlk(x.t)}</span>${m}<span class="tag">${x.t.lg}</span><br><small>${c.wc} Mundial · ${c.msi} MSI · ${c.lg} ligas</small></span><span class="pt num">${Math.round(x.v)}<small>power</small></span></li>`;
  }).join('');
  return `<section class="pn"><h2>Power ranking</h2><ol class="rank">${rows}</ol><p class="note">Muda a cada jogo: força atual do elenco com a forma, títulos dos últimos 5 anos (peso maior nos recentes; Mundial pesa mais que MSI e liga) e aproveitamento das duas últimas temporadas. As setas comparam com o fim da última temporada.</p></section>`;
}
function vHof(){
  const PM=pmap();
  let h=`<div class="pills stk">${[['rank','Ranking'],['wc','Mundial'],['msi','MSI'],['teams','Times'],['nat','Seleções'],['players','Jogadores']].map(([k,l])=>`<button class="pill" aria-pressed="${hofView===k}" data-act="hv" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(hofView==='rank'){
    const r=hofRank().slice(0,10);
    const rows=r.map((n,i)=>{
      const hh=S.hof[n],mv=S.mv[n],p=PM[n];
      const m=mv==='N'?'<span class="mv new">novo</span>':mv>0?`<span class="mv up">▲${mv}</span>`:mv<0?`<span class="mv dn">▼${-mv}</span>`:'';
      const tt=[hh.bd?`${hh.bd} Bola${hh.bd>1?'s':''} de Ouro`:'',hh.wc?`${hh.wc} Mundial${hh.wc>1?'is':''}`:'',hh.msi?`${hh.msi} MSI`:'',hh.lg?`${hh.lg} liga${hh.lg>1?'s':''}`:'',hh.mvp?`${hh.mvp} MVP${hh.mvp>1?'s':''}`:''].filter(Boolean).join(' · ');
      return `<li><span class="pos num">${i+1}</span>${p?hx(p.p.r,'sm'):'<span class="hx sm">–</span>'}<span><span class="nm2">${lk(n)}</span>${m}<span class="tag">${p?'ativo':'aposentado'}</span>${tt?`<br><small>${tt}</small>`:''}</span><span class="pt num">${Math.round(sc(hh))}<small>pts</small></span></li>`;
    }).join('');
    h+=`<section class="pn"><h2>Top 10 de todos os tempos</h2><ol class="rank">${rows}</ol><p class="note">Pontos = Bola de Ouro/temporada (${PTS.join(' · ')}) + Mundial 6 + MSI 3 + MVP 1,5 + liga 0,5. O hexágono mostra o OVR atual de quem ainda joga. Toque em um nome para abrir a ficha.</p></section>`;
    const bl=[...(S.pre||[]).map(x=>({y:x.y,n:x.top[0].n,team:x.top[0].team})),...S.hist.map(x=>({y:x.y,n:x.top[0].n,team:x.top[0].team}))].reverse();
    h+=`<section class="pn"><h2>Bolas de Ouro</h2>${bl.map(x=>`<div class="rowl"><span class="lg num">${x.y}</span><span class="grow"><b>${lk(x.n)}</b> <small>${esc(x.team)}</small></span></div>`).join('')}</section>`;
  }else if(hofView==='wc'||hofView==='msi'){
    h+=cupHistHTML(hofView);
  }else if(hofView==='nat'){
    h+=natRankHTML();
  }else if(hofView==='teams'){
    h+=pwHTML();
    const rows=S.teams.map(t=>({t,c:ttCount(t)})).sort((a,b)=>b.c.wc-a.c.wc||b.c.msi-a.c.msi||b.c.lg-a.c.lg||baseOvr(b.t)-baseOvr(a.t));
    h+=`<section class="pn"><h2>Histórico de títulos</h2>${rows.map(({t,c})=>`<div class="pl"><span class="tag" style="margin:0">${t.lg}</span><span><span class="nm2">${tlk(t)}</span><br><small>${c.wc} Mundial · ${c.msi} MSI · ${c.lg} ligas</small></span>${hx(Math.round(baseOvr(t)),'sm')}</div>`).join('')}</section>`;
  }else{
    h+=`<div class="pills">${[['all','Todos'],['a','Ativos'],['r','Aposentados']].map(([k,l])=>`<button class="pill" aria-pressed="${pf===k}" data-act="pf" data-v="${k}">${l}</button>`).join('')}</div>`;
    h+=`<input id="q" class="search" type="search" placeholder="Buscar jogador" value="${esc(qStr)}" aria-label="Buscar jogador"><section class="pn"><h2>Jogadores</h2><div id="plist">${plistHTML()}</div></section>`;
  }
  return h;
}

/* ---------- elencos ---------- */
function fmtF(f){
  const v=r1(f);
  return Math.abs(v)<.5?'<span class="fm z">–</span>':v>0?`<span class="fm up">▲${v.toFixed(1)}</span>`:`<span class="fm dn">▼${(-v).toFixed(1)}</span>`;
}
function vTeams(){
  let h=`<div class="pills stk">${LGS.map(l=>`<button class="pill" aria-pressed="${l===selLg}" data-act="lg" data-v="${l}">${l}</button>`).join('')}<button class="pill" aria-pressed="${selLg==='TOP'}" data-act="lg" data-v="TOP">TOP 25</button><button class="pill" aria-pressed="${selLg==='NAT'}" data-act="lg" data-v="NAT">PAÍSES</button></div>`;
  if(selLg==='NAT')return h+natListHTML();
  if(selLg==='TOP'){
    const all=S.teams.flatMap(t=>t.pl.map(p=>({p,t}))).sort((a,b)=>(b.p.r+b.p.f)-(a.p.r+a.p.f)).slice(0,25);
    return h+`<section class="pn"><h2>Melhores jogadores agora</h2><ol class="rank">${all.map((x,i)=>`<li><span class="pos num">${i+1}</span>${hx(x.p.r,'sm')}<span><span class="nm2">${lk(x.p.n)}</span><br><small>${esc(x.t.name)} · ${RN[x.p.role]} · ${x.p.age} anos</small></span>${fmtF(x.p.f)}</li>`).join('')}</ol></section>`;
  }
  const ts=pmSort(S.teams.filter(t=>t.lg===selLg)).map(x=>x.t);
  h+=`<div class="row"><button class="ghost" data-act="league" data-v="${selLg}">Ficha da liga ${selLg}</button></div>`;
  const cardF=t=>{
    const f=r1(eff(t)-baseOvr(t));
    return `<section class="pn"><div class="th"><h3>${crest(t)}<span>${tlk(t)}${t.est?' <span class="tag">estimado</span>':''} ${pmBadge(pmInfo(t))}</span></h3><span>${hx(Math.round(baseOvr(t)),'sm')}</span></div><small>Forma do time ${f>0?`<span class="st up">▲${f.toFixed(1)}</span>`:f<0?`<span class="st dn">▼${(-f).toFixed(1)}</span>`:'estável'}</small>
    ${t.pl.map(p=>`<div class="pr"><span class="role">${RN[p.role]}</span><span class="who">${lk(p.n)}<small>${p.age} anos${p.age<=24?` · potencial ${Math.round(p.pot)}`:''}${p.d?` · ${p.d>0?'+':''}${p.d} na virada`:''}</small><div class="ovb"><i style="width:${clamp((p.r-60)*2.5,4,100)}%"></i></div></span>${fmtF(p.f)}${hx(p.r,'sm')}</div>`).join('')}</section>`;
  };
  h+=ts.map(cardF).join('');
  const t2=pmSort(D2L().filter(t=>t.lg===selLg)).map(x=>x.t);
  if(t2.length)h+=`<section class="pn"><h2>Segunda divisão · ${selLg}</h2><p class="note" style="margin:0">Elencos da D2, na ordem do último Split 2. Quem subiu ou caiu aparece marcado.</p></section>`+t2.map(cardF).join('');
  return h+`<p class="note">Elencos de 2026: os 19 times do Mundial seguem as listas divulgadas; os marcados como estimado são chutes meus. OVR e idades são notas minhas, não oficiais. O OVR sobe e cai com idade, potencial e desempenho; a seta mostra a forma atual, que também entra nas chances de vitória.</p>`;
}

/* ---------- ficha das seleções ---------- */
const natHue=c=>{let h=0;for(const x of c)h=(h*37+x.charCodeAt(0))%360;return h};
const natCrest=(c,cl='')=>{const i=ISO2[c];return `<span class="crest ${cl}" style="--h:${natHue(c)}" aria-hidden="true">${i?`<img class="flg" src="https://flagcdn.com/w160/${i.toLowerCase()}.png" alt="" loading="lazy" onerror="this.remove()">`:''}${esc(c)}</span>`};
function natActive(c){return S.teams.flatMap(t=>t.pl.filter(p=>natC(p.n)===c).map(p=>({p,t})))}
function natXI(c){
  const a=natActive(c),pl=[];
  for(let i=0;i<5;i++){const b=a.filter(x=>x.p.role===i).sort((x,y)=>y.p.r-x.p.r)[0];pl.push(b||null)}
  return pl;
}
function natListHTML(){
  const cs={};
  S.teams.forEach(t=>t.pl.forEach(p=>{const c=natC(p.n);if(c)(cs[c]=cs[c]||[]).push(p)}));
  const rows=Object.keys(cs).map(c=>{const xi=natXI(c).filter(Boolean);return{c,n:cs[c].length,best:Math.max(...cs[c].map(p=>p.r)),cov:xi.length,avg:xi.length?xi.reduce((a,x)=>a+x.p.r,0)/xi.length:0}}).sort((a,b)=>b.avg*(b.cov>=4?1:.9)-a.avg*(a.cov>=4?1:.9)||b.n-a.n);
  return `<section class="pn"><h2>Seleções</h2>${rows.map((r,i)=>`<div class="pl" style="grid-template-columns:30px minmax(0,1fr) auto"><span class="pos num" style="font-size:20px">${i+1}</span><span><span class="nm2"><button class="lk" data-act="nation" data-v="${r.c}">${esc(NATN[r.c]||r.c)}</button></span><br><small>${r.n} jogador${r.n>1?'es':''} ativo${r.n>1?'s':''} · melhor ${r.best}${r.cov<5?` · ${r.cov}/5 posições`:''}</small></span>${hx(Math.round(r.avg),'sm')}</div>`).join('')}<p class="note">Ordenadas pelo OVR médio do melhor jogador de cada posição. Toque num país para abrir a ficha.</p></section>`;
}
function cupHistHTML(k){
  const wc=k==='wc',CH_=wc?WCT:MST,VV=wc?WCV:MSV,lbl=wc?'Mundial':'MSI';
  const mv={};Object.keys(S.pdb).forEach(n=>(S.pdb[n].tl||[]).forEach(e=>{if(e.t===(wc?'MVP Mundial':'MVP MSI'))mv[e.y]=n}));
  const rows={};
  Object.keys(CH_).forEach(y=>{rows[y]={y:+y,c:CH_[y],v:VV[y]||''}});
  S.hist.forEach(h=>{rows[h.y]={y:h.y,c:wc?h.champs.wc:h.champs.msi,v:(wc?h.champs.wcv:h.champs.msiv)||'',mv:wc?h.champs.mvp:h.champs.msiMvp}});
  const L=Object.values(rows).sort((a,b)=>b.y-a.y);
  const tn=n=>{const t=S.teams.find(x=>x.name===(BALIAS[n]||n));return t?tlk(t):esc(n)};
  const cnt={};L.forEach(r=>{const nn=BALIAS[r.c]||r.c;cnt[nn]=(cnt[nn]||0)+1});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
  let h=`<section class="pn pod"><h2>${lbl} · campeões e vices</h2><div class="chips">${top.map(([n,c])=>`<span><b class="num">${c}</b>${esc(n)}</span>`).join('')}</div>`;
  h+=L.map(r=>{const m=r.mv||mv[r.y];return `<div class="pr2" style="grid-template-columns:44px minmax(0,1fr)"><b class="num">${r.y}</b><span><b>🏆 ${tn(r.c)}</b><br><small style="color:var(--muted)">Vice: ${r.v?tn(r.v):'—'}${m?` · MVP: ${lk(m)}`:' · MVP: —'}</small></span></div>`}).join('');
  if(k==='msi')h+=`<p class="note" style="margin:6px 0 0">O MSI de 2020 não aconteceu.</p>`;
  return h+`<p class="note" style="margin:6px 0 0">Até 2025: edições reais. Depois: as do seu jogo. MVP só aparece quando o jogo tem o registro.</p></section>`;
}
function natTit(c,t){const ys=new Set();Object.keys(S.pdb).forEach(n=>{if(natC(n)===c)(S.pdb[n].tl||[]).forEach(e=>{if(e.t===t)ys.add(e.y)})});return ys.size}
function natRank(){
  const cs={};
  const g=c=>cs[c]||(cs[c]={c,pts:0,bd:0,wc:0,msi:0,cups:0,vice:0,n:0,top:null});
  Object.keys(S.hof).forEach(n=>{
    const c=natC(n);if(!c)return;const h=S.hof[n],x=g(c);
    x.pts+=sc(h);x.bd+=h.bd||0;
    if(sc(h)>0)x.n++;
    if(!x.top||sc(h)>x.top.pts)x.top={n,pts:sc(h)};
  });
  (S.cups||[]).forEach(cp=>{if(cp.code){g(cp.code).cups++;g(cp.code).pts+=40}Object.keys(cp.res||{}).forEach(c=>{if(cp.res[c]==='Vice'){g(c).vice++;g(c).pts+=15}})});
  Object.values(cs).forEach(x=>{x.wc=natTit(x.c,'Mundial');x.msi=natTit(x.c,'MSI')});
  return Object.values(cs).filter(x=>x.pts>0).sort((a,b)=>b.pts-a.pts);
}
function natRankHTML(){
  const rows=natRank();
  return `<section class="pn"><h2>Seleções de todos os tempos</h2><ol class="rank">${rows.map((x,i)=>{
    const tt=[x.bd?`${x.bd} Bola${x.bd>1?'s':''}`:'',x.wc?`${x.wc} Mundia${x.wc>1?'is':'l'}`:'',x.msi?`${x.msi} MSI`:'',x.cups?`${x.cups} Copa${x.cups>1?'s':''}`:'',x.vice?`${x.vice} vice${x.vice>1?'s':''} na Copa`:''].filter(Boolean).join(' · ');
    return `<li><span class="pos num">${i+1}</span>${natCrest(x.c,'sm')}<span><span class="nm2"><button class="lk" data-act="nation" data-v="${x.c}">${esc(NATN[x.c]||x.c)}</button></span><br><small>${tt||'sem títulos'} · ${x.n} lenda${x.n>1?'s':''}${x.top?` · melhor: ${esc(x.top.n)}`:''}</small></span><span class="pt num">${Math.round(x.pts)}<small>pts</small></span></li>`}).join('')}</ol><p class="note">Pontos do país = soma dos pontos de todas as lendas nascidas lá, mais 40 por Copa do Mundo de LoL vencida e 15 por vice. Toque num país para abrir a ficha.</p></section>`;

function vNation(c){

function pmInfo(t){
  const h=(S.promoH||[]).filter(x=>x.y>=S.year-1&&(x.up===t.name||x.down===t.name)).pop();
  const y=t.yh[t.yh.length-1],ok=y&&y.y>=S.year-1;

}

  msg='';
  if(['tab','player','team','nation','back','step','all'].includes(a))animNext=true;
  let top=false;
  if(a==='tab'){tab=v;askReset=false;askEnd=false;lastPlayed=null;prof=null;pstack=[]}
  else if(a==='step'){if(daysLeft()>0){msg='Ainda não é dia de jogo. Avance o calendário.'}else if(dvNeeded()&&(dvOpen(),dvAll(),dvGo(),!lvNeeded())){step();sndAfter();save();top=true}else if(lvNeeded()){lvOpen();top=true}else{step();sndAfter();save();top=true}}
  else if(a==='dvBan'||a==='dvPick'){if(DV){const [r,c]=String(v).split('|'),t=SEQ[DV.i];if(t&&t[1]===DV.us&&!dvTaken(c)){
    if(a==='dvBan'&&t[0]==='ban'){DV.bans[DV.us].push(c);DV.i++;dvAdv()}
    else if(a==='dvPick'&&t[0]==='pick'&&!DV.pk[DV.us][+r]&&(!DV.pc||+r===DV.prole)){DV.pk[DV.us][+r]=c;DV.i++;dvAdv()}}}}
  else if(a==='dvRole'){if(DV)DV.role=+v}
  else if(a==='dvAuto'){if(DV&&DV.i<SEQ.length&&SEQ[DV.i][1]===DV.us){dvAI();dvAdv()}}
  else if(a==='dvAll'){if(DV)dvAll()}
  else if(a==='dvX'){clearTimeout(DVT);DV=null}
  else if(a==='dvGo'){if(DV&&DV.done){dvGo();if(lvNeeded())lvOpen();else step();sndAfter();save();top=true}}
  else if(a==='lvTac'){if(LV&&LV.pc)lvPosture(v);else lvTac(v)}else if(a==='lvPick'){lvPick(v)}else if(a==='lvSub'){lvSub(v);save()}else if(a==='lvNext'){lvNext()}else if(a==='lvSkip'){lvSkipPhase()}else if(a==='lvAll'){lvAll()}else if(a==='lvX'){lvDone()}
  else if(a==='lvDone'){if(LV&&LV.state==='done'){if(LV.pc)pcMatchEnd();lvDone();step();sndAfter();save();top=true}}
  else if(a==='liveOpt'){S.opt=S.opt||{};S.opt.live=+v;save()}
  else if(a==='day'){advDay(+v);save()}
  else if(a==='dayTo'){advDay(999);save()}
  else if(a==='fl'){S.opt=S.opt||{};S.opt.fl=v;save()}
  else if(a==='all'){const c5=PHASES[S.phase]&&PHASES[S.phase].g===5;while(S.phase<PHASES.length&&(c5||PHASES[S.phase].g<5))step();lastPlayed=null;S.day=evDay();tab='bola';save();top=true}
  else if(a==='year'){selYear=+v}
  else if(a==='celeX'){cele=null}
  else if(a==='lg'){selLg=v}
  else if(a==='hv'){hofView=v}
  else if(a==='pf'){pf=v}
  else if(a==='player'){openProf('p',v);top=true}
  else if(a==='team'){openProf('t',+v);top=true}
  else if(a==='league'){openProf('l',v);top=true}
  else if(a==='nation'){if(v)openProf('n',v);top=true}
  else if(a==='nmSet'){S.nm={code:v,titles:0,cups:[]};msg=`Você agora é o técnico de ${NATN[v]||v}.`;save()}
  else if(a==='nmOff'){S.nm=null;msg='Você deixou a seleção.';save()}
  else if(a==='cupSwap'){const [r,n]=v.split('|');cupSwap(+r,n);save()}
  else if(a==='back'){if(pstack.length)prof=pstack.pop();else{tab=prevTab;prof=null}top=true}
  else if(a==='applyHof'){
    const nh={};
    dHof.split('\n').forEach(l=>{
      const m=l.trim().match(/^(.+?)[,;\t]\s*(-?\d+(?:[.,]\d+)?)$/);
      if(m){const n=m[1].trim();nh[n]={...(S.hof[n]||{bd:0,wc:0,msi:0,lg:0,mvp:0}),pts:parseFloat(m[2].replace(',','.'))}}
    });
    if(Object.keys(nh).length){S.hof=nh;S.mv={};dHof=null;msg='Ranking histórico atualizado.';save()}
    else msg='Nenhuma linha válida. Use o formato Nome,pontos.';
  }
  else if(a==='copy'){
    dBackup=JSON.stringify(S);msg='Backup gerado abaixo.';
    try{navigator.clipboard.writeText(dBackup).then(()=>{msg='Backup copiado.';render()},()=>{})}catch(e){}
  }
  else if(a==='loadBk'){
    try{
      const o=JSON.parse(dBackup);
      if(!o||!o.teams||!o.hof||!o.year||!o.pdb)throw 0;
      S=o;save();dHof=null;dBackup='';msg='Backup carregado.';
    }catch(e){msg='Backup inválido. Cole o texto completo gerado por esta versão do simulador.'}
  }
  else if(a==='mgrStart'){S.pc=null;menuV='home';menuAsk=null;mgrStart(+mgrPick);tab='mgr';msg='Você assumiu o '+mgrT().name+'.';save()}
  else if(a==='mgrEnd'){askEnd=true}
  else if(a==='mgrEndNo'){askEnd=false}
  else if(a==='menuGo'){menuV=v;menuAsk=null;if(v==='home')menuAsk=null;top=true}
  else if(a==='menuAsk'){menuAsk=v||null}
  else if(a==='modeSet'){S.mgr=null;S.pc=null;menuAsk=null;msg='Você voltou ao simulador.';save()}
  else if(a==='pcF'){const [k,x]=String(v).split('|');pcF[k]=k==='role'?+x:x}
  else if(a==='pcCreate'){if(pcCreate(pcF)){pcF.name='';menuV='home';tab='pc';msg='Carreira criada. Boa sorte!';save();top=true}}
  else if(a==='pcPick'){if(pcAdopt(v)){menuV='home';tab='pc';msg='Você assumiu a carreira de '+v+'.';save();top=true}}
  else if(a==='pcTrain'){pcTrain(v);save()}
  else if(a==='pcFocus'){S.pc.focus=+v;save()}
  else if(a==='pcSpend'){pcSpend(+v);save()}
  else if(a==='pcRest'){pcRest();save()}
  else if(a==='pcPool'){pcPoolTrain(v);save()}
  else if(a==='pcVaga'){pcVaga();save()}
  else if(a==='pcOffer'){pcAccept(+v);save()}
  else if(a==='pcEv'){pcEv(v);save()}
  else if(a==='setg'){setOpen[v]=!setOpen[v]}
  else if(a==='mgrEndOk'){S.mgr=null;askEnd=false;tab='set';msg='Modo carreira encerrado.';save()}
  else if(a==='cheat'){if(S.mgr){S.mgr.cheat=!S.mgr.cheat;msg=S.mgr.cheat?'Cheats ligados.':'Cheats desligados.';save()}else msg='Ative o modo carreira para usar cheats.'}
  else if(a==='rnd'){S.opt=S.opt||{};S.opt.rnd=v;save()}
  else if(a==='dif'){S.opt=S.opt||{};S.opt.dif=v;save()}
  else if(a==='flags'){S.opt=S.opt||{};S.opt.flags=v==='1';save()}
  else if(a==='spRR'){while(S.season.sp&&S.season.sp.stage==='rr')spStep();save();top=true}
  else if(a==='spAll'){const ph=S.phase;let g2=0;while(S.phase===ph&&g2++<400)step();save();top=true}
  else if(a==='mgrView'){mgrView=v}
  else if(a==='focus'){if(S.mgr){S.mgr.focus=v;save()}}
  else if(a==='mgrEv'){mgrEv(v);save()}
  else if(a==='mgrTr'){mgrTr(v);save()}
  else if(a==='mgrPt'){const [n,c]=String(v).split('|');if(S.mgr){S.mgr.pt=S.mgr.pt||{};S.mgr.pt[n]=c;save()}}
  else if(a==='mgrCoach'){mgrCoach(v);save()}
  else if(a==='dp'){const [i,c]=String(v).split('|');if(S.mgr){S.mgr.dr=myPicks(mgrT());S.mgr.dr[+i]=c;save()}}
  else if(a==='dpAuto'){if(S.mgr){S.mgr.dr=bestPicks(mgrT(),0);save()}}
  else if(a==='payOpt'){S.opt=S.opt||{};S.opt.pay=+v;save()}
  else if(a==='draftOpt'){S.opt=S.opt||{};S.opt.draft=+v;save()}
  else if(a==='plan'){if(S.mgr){S.mgr.plan=v;save()}}
  else if(a==='mgrRole'){mgrRole=+v}
  else if(a==='mgrNeg'){NG=NG===v?null:v}
  else if(a==='mgrBid'){mgrBid(v);save()}
  else if(a==='mgrList'){mgrList(v);save()}
  else if(a==='mgrBuy'){mgrBuy(v);mAch();save()}
  else if(a==='mgrSign'){mgrSign(v);save()}
  else if(a==='mgrSell'){mgrSell(v);mAch();save()}
  else if(a==='mgrRenew'){mgrRenew(v);save()}
  else if(a==='mgrLoan'){mgrLoan(v);save()}
  else if(a==='mgrPromote'){mgrPromote(v);mAch();save()}
  else if(a==='mgrRelease'){mgrRelease(v);save()}
  else if(a==='mgrUp'){mgrUp(v);save()}
  else if(a==='mgrOffer'){const [i,w]=v.split('|');mgrOffer(+i,w==='y');save()}
  else if(a==='reset'){askReset=true}
  else if(a==='slot'){slotGo(+v);save()}
  else if(a==='slotAsk'){askSlot=+v}
  else if(a==='slotDel'){try{localStorage.removeItem(SLOTK[+v])}catch(e){}askSlot=-1;msg='Slot '+(+v+1)+' apagado.'}
  else if(a==='snd'){S.opt=S.opt||{};S.opt.snd=+v;save();if(+v)snd('win')}
  else if(a==='resetNo'){askReset=false}
  else if(a==='resetOk'){freshGame();save();askReset=false;dHof=null;selYear=null;msg='Simulador reiniciado.'}
  render();
  if(top)window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset.v)});
document.addEventListener('change',e=>{
  if(e.target.id==='bk-file'&&e.target.files&&e.target.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{dBackup=String(rd.result);act('loadBk');render()};
    rd.readAsText(e.target.files[0]);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='t-hof')dHof=e.target.value;
  else if(e.target.id==='t-bk')dBackup=e.target.value;
  else if(e.target.id==='mgr-pick'){mgrPick=+e.target.value}
  else if(e.target.id==='pc-name'){pcF.name=e.target.value}
  else if(e.target.id==='pc-nat'){pcF.nat=e.target.value}
  else if(e.target.id==='pc-team'){pcF.team=e.target.value}
  else if(e.target.id==='pc-q'){pcQ=e.target.value;const l=document.querySelector('#pc-list');if(l)l.innerHTML=pcListHTML()}
  else if(e.target.id==='mgr-q'){mgrQ=e.target.value;const l=document.querySelector('#mlist');if(l)l.innerHTML=mlistHTML()}
  else if(e.target.id==='q'){qStr=e.target.value;const l=document.querySelector('#plist');if(l)l.innerHTML=plistHTML()}
});
if(!S)freshGame();else{fixLPL();fixNatFix();ensureD2();fixNat();if(!S.lh)applyLeagueHist();if(!S.lh2)applyLeagueHist2();if(!S.lh3)applyLeagueHist3();save()}
render();
</script>
