<title>Bola de Ouro LoL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050C15">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: HUD de jogo. Cabeçalho com temporada, trilha de etapas, botão JOGAR grande, painéis com cantos dourados, cartas hexagonais de OVR, fichas de jogador e time, navegação fixa embaixo. */
:root{
  --bg:#050C15;--bg2:#091524;--panel:#0C1A2A;--ink:#E8EEF4;--muted:#8194A8;--line:#1E3248;
  --gold:#D9B35F;--gold-hi:#F2D58C;--gold-lo:#A57C2E;--on-gold:#1B1405;
  --teal:#3AC6D3;--ok:#47C58C;--bad:#EF7064;--glow:rgba(217,179,95,.22);--tex:rgba(255,255,255,.025);--silver:#B9C4D0;--bronze:#C98A55;
  --d:'Barlow Condensed','Arial Narrow',sans-serif;--b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{background:var(--bg);color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);
  background-image:radial-gradient(900px 380px at 50% -140px,var(--glow),transparent 70%),repeating-linear-gradient(135deg,var(--tex) 0 1px,transparent 1px 14px);
  color:var(--ink);font-family:var(--b);font-size:15px;line-height:1.45;
  padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
small,.muted{color:var(--muted)}small{font-size:13px}
.lk{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow-wrap:anywhere}
.lk:hover{text-decoration-color:var(--gold)}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:34px;height:34px;flex:none;color:var(--gold)}
.eyebrow{font:600 12px var(--d);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font:700 32px/1 var(--d);text-transform:uppercase;letter-spacing:.04em;margin:0}
.season{text-align:right;border:1px solid var(--line);background:var(--panel);padding:4px 12px;flex:none}
.season small{display:block;font:600 10px var(--d);letter-spacing:.16em;text-transform:uppercase}
.season b{font:700 26px/1 var(--d);color:var(--gold)}

/* trilha */
.trk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;list-style:none;padding:0;margin:0 0 12px}
.trk li{font:600 11px var(--d);letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
.trk i{display:block;height:6px;background:var(--line);margin-bottom:5px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.trk .done{color:var(--ink)}.trk .done i{background:var(--teal)}
.trk .now{color:var(--gold)}.trk .now i{background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));box-shadow:0 0 10px var(--glow)}
.banner{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.banner small{font:600 11px var(--d);letter-spacing:.16em;text-transform:uppercase}
.banner b{font:700 24px/1 var(--d);text-transform:uppercase;letter-spacing:.03em;text-align:right}

/* botões */
.playw{filter:drop-shadow(0 0 14px var(--glow));margin-bottom:10px}
.play{display:block;width:100%;padding:15px 20px;border:0;font:700 22px/1 var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--on-gold);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));cursor:pointer;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.play:active{filter:brightness(.92)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font:600 14px var(--b);padding:10px 14px;cursor:pointer}
.ghost:active{background:var(--bg2)}
.ghost.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

/* painel */
.pn{position:relative;background:var(--panel);border:1px solid var(--line);padding:14px 14px 12px;margin-bottom:14px;min-width:0}
.pn::before,.pn::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold);pointer-events:none}
.pn::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.pn::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
h2{font:700 20px/1.1 var(--d);text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{margin:14px 0 8px;font:600 12px var(--d);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.empty{padding:14px 2px;color:var(--muted)}
.msg{border-left:3px solid var(--teal);padding:8px 12px;margin-bottom:14px;background:var(--panel);font-size:14px}

/* partidas */
.m{position:relative;border:1px solid var(--line);background:var(--bg2);padding:10px 12px 8px;margin-bottom:9px}
.mt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.tn{font:700 18px/1.1 var(--d);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.tn.b{text-align:right}
.tn.win{color:var(--gold)}.tn.lose{color:var(--muted)}
.sc{font:700 28px/1 var(--d);min-width:62px;text-align:center;letter-spacing:.04em}
.sc i{font-style:normal;color:var(--muted);padding:0 3px}
.sc em{font:600 14px var(--d);letter-spacing:.2em;color:var(--muted);font-style:normal}
.od{display:flex;gap:2px;height:6px;margin:8px 0 5px}
.od i{display:block;background:var(--teal)}.od i.o2{background:var(--gold-lo)}
.ol{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.ol b{font:700 15px var(--d);color:var(--ink)}
.zb{position:absolute;top:-8px;right:10px;background:var(--bad);color:#fff;font:700 11px var(--d);letter-spacing:.14em;text-transform:uppercase;padding:1px 7px}
.fx{animation:pop .4s both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}

.crown{position:relative;overflow:hidden;text-align:center;padding:16px 12px;margin-bottom:12px;color:var(--on-gold);
  background:radial-gradient(120% 140% at 50% 0%,var(--gold-hi),var(--gold-lo) 75%)}
.crown small{color:var(--on-gold);font:700 12px var(--d);letter-spacing:.2em;text-transform:uppercase}
.crown b{display:block;font:700 38px/1 var(--d);text-transform:uppercase;margin:4px 0;overflow-wrap:anywhere}
.crown span{font-size:13px;font-weight:600}

/* suíço */
.grp{border:1px solid var(--line);background:var(--bg2);padding:8px 10px;margin-bottom:8px}
.gr{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0 3px 8px;border-left:3px solid transparent}
.gr.q{border-left-color:var(--gold);font-weight:700}
.gr.x{opacity:.5}
.gr span:first-child{min-width:0;overflow-wrap:anywhere}

.fav{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.fav:first-of-type{border-top:0}
.fav b{font:700 15px var(--d);letter-spacing:.1em;color:var(--teal);width:52px;flex:none}
.fav span{min-width:0;flex:1}
.lines{list-style:none;margin:0;padding:0;font-size:14px}.lines li{padding:4px 0;border-top:1px solid var(--line)}.lines li:first-child{border-top:0}
.rowl{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline;min-width:0}
.rowl:first-child{border-top:0}
.rowl .lg{font:700 15px var(--d);letter-spacing:.08em;color:var(--teal);width:52px;flex:none}
.rowl .grow{flex:1;min-width:0}

/* hex OVR */
.hx{--t:linear-gradient(160deg,#58667A,#3A4656);--on:#fff;display:inline-grid;place-items:center;flex:none;width:42px;height:48px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font:700 20px/1 var(--d);background:var(--t);color:var(--on)}
.hx.t2{--t:linear-gradient(160deg,#6E8FB5,#3B5778)}
.hx.t3{--t:linear-gradient(160deg,#5FDCE8,#1B8E9B);--on:#041417}
.hx.t4{--t:linear-gradient(160deg,var(--gold-hi),var(--gold-lo));--on:var(--on-gold)}
.hx.dk{--t:linear-gradient(160deg,#2B2108,#120D02);--on:#F2D58C}
.hx.sm{width:34px;height:39px;font-size:16px}
.hx.lg{width:64px;height:73px;font-size:30px}

/* rankings */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:30px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.pos{font:700 26px/1 var(--d);color:var(--muted)}
.pt{font:700 24px/1 var(--d);text-align:right;color:var(--gold)}
.pt small{display:block;font:600 10px var(--b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nm2{font-weight:700;overflow-wrap:anywhere}
.mv{font:700 12px var(--b);margin-left:6px}.mv.up{color:var(--ok)}.mv.dn{color:var(--bad)}.mv.new{color:var(--teal)}
.tag{font:600 10px var(--b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:0 5px;margin-left:6px;white-space:nowrap}
.pl{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}

.hero{position:relative;overflow:hidden;text-align:center;padding:20px 14px 18px;margin-bottom:14px;color:var(--on-gold);
  background:radial-gradient(130% 120% at 50% 0%,var(--gold-hi),var(--gold-lo) 78%);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 3.2s .5s 1;pointer-events:none}
@keyframes sheen{to{transform:translateX(120%)}}
.hero .k{font:700 13px var(--d);letter-spacing:.24em;text-transform:uppercase}
.hero .nm{font:700 54px/1 var(--d);text-transform:uppercase;margin:8px 0 2px;overflow-wrap:anywhere}
.hero .tm{font-weight:600}
.hero .hx{margin:6px 0}
.chip{display:inline-block;font:600 12px var(--b);padding:2px 9px;border:1px solid currentColor;border-radius:99px;margin:6px 5px 0 0}
.hero .chip{margin:6px 3px 0}

.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin-bottom:12px}
.pd{text-align:center;min-width:0}
.pd .hx{margin-bottom:4px}
.pd b{display:block;font:700 17px/1.1 var(--d);text-transform:uppercase;overflow-wrap:anywhere}
.pd small{display:block;font-size:12px}
.pd .bs{margin-top:6px;display:grid;place-items:center;font:700 30px var(--d);background:linear-gradient(180deg,var(--line),var(--bg2));color:var(--muted);border-top:3px solid var(--gold)}
.p1 .bs{height:84px;color:var(--gold)}.p2 .bs{height:58px}.p3 .bs{height:42px}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;font:700 14px var(--d);letter-spacing:.08em;cursor:pointer}
.pill[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--on-gold);border-color:var(--gold)}
.search{width:100%;padding:10px 12px;margin-bottom:10px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);font:15px var(--b)}

.th{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.th h3{font:700 22px/1 var(--d);text-transform:uppercase;letter-spacing:.04em;margin:0}
.st{font:600 12px var(--b);margin-left:6px}.st.up{color:var(--ok)}.st.dn{color:var(--bad)}
.pr{display:grid;grid-template-columns:38px minmax(0,1fr) auto 40px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.pr .role{font:700 12px var(--d);letter-spacing:.1em;color:var(--muted)}
.pr .who{min-width:0;overflow-wrap:anywhere}.pr .who small{display:block;font-size:12px}
.fm{font:700 12px var(--b);text-align:right;min-width:44px}
.fm.up{color:var(--ok)}.fm.dn{color:var(--bad)}.fm.z{color:var(--muted)}

/* fichas */
.ph{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.ph h3{font:700 36px/1 var(--d);text-transform:uppercase;letter-spacing:.02em;margin:0;overflow-wrap:anywhere}
.ph small{display:block}
.cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:8px;margin-bottom:4px}
.cnt div{border:1px solid var(--line);background:var(--bg2);padding:8px 4px;text-align:center}
.cnt b{display:block;font:700 30px/1 var(--d);color:var(--gold)}
.cnt small{font:600 10px var(--b);letter-spacing:.08em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px}
.kv div{border-top:1px solid var(--line);padding-top:6px}
.kv small{display:block;font:600 11px var(--b);letter-spacing:.08em;text-transform:uppercase}
.kv b{font:700 20px/1.2 var(--d)}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}
.tb th{font:600 11px var(--d);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.tb td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td.c{color:var(--gold);font-weight:700}
.tr{padding:8px 0;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr b{font:700 17px var(--d);letter-spacing:.04em;text-transform:uppercase}
.tr small{display:block}

textarea{width:100%;min-height:150px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--panel);border-top:1px solid var(--gold-lo);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nb{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font:600 11px var(--d);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;position:relative}
.nb svg{width:22px;height:22px}
.nb[aria-selected="true"]{color:var(--gold)}
.nb[aria-selected="true"]::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:3px;background:var(--gold)}

@media (max-width:420px){h1{font-size:27px}.hero .nm{font-size:44px}.crown b{font-size:32px}.ph h3{font-size:30px}}
@media (prefers-reduced-motion:reduce){.fx,.hero::after{animation:none}}

/* v6 */
.hud{margin-bottom:12px}
.logo svg{width:30px;height:30px}
.eyebrow{font-size:11px;white-space:nowrap}
h1{white-space:nowrap}
.crest{--h:200;--s:34px;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 30% 25%,hsl(var(--h) 55% 46%),hsl(var(--h) 60% 20%) 80%);border:2px solid hsl(var(--h) 65% 64%);
  color:#fff;font:700 calc(var(--s)*.36)/1 var(--d);letter-spacing:.02em;text-transform:uppercase;box-shadow:0 0 0 2px var(--panel),0 2px 8px rgba(0,0,0,.4)}
.crest.sm{--s:24px}.crest.lg{--s:66px}
.tn{display:flex;align-items:center;gap:7px;min-width:0}
.tn.b{flex-direction:row-reverse;text-align:right}
.tn .lk{min-width:0}
.th h3{display:flex;align-items:center;gap:10px}
.lgb{font:700 11px var(--d);letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
.rank li:nth-child(1) .pos,.cab .g{color:var(--gold)}
.rank li:nth-child(2) .pos{color:var(--silver)}
.rank li:nth-child(3) .pos{color:var(--bronze)}
.rank li:nth-child(-n+3){background:linear-gradient(90deg,var(--glow),transparent 60%)}
.balls{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.balls i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold-lo));box-shadow:0 0 6px var(--glow)}
.cab{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:4px}
.cab div{border:1px solid var(--line);background:var(--bg2);padding:10px 4px 8px;text-align:center}
.cab svg{width:22px;height:22px;color:var(--gold);display:block;margin:0 auto 2px}
.cab b{display:block;font:700 32px/1 var(--d);color:var(--gold)}
.cab small{font:600 10px var(--b);letter-spacing:.08em;text-transform:uppercase}
.trp{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.trp:first-child{border-top:0}
.trp .y{font:700 20px/1.1 var(--d);color:var(--gold)}
.trp b{font:700 17px var(--d);letter-spacing:.04em;text-transform:uppercase}
.trp small{display:block;overflow-wrap:anywhere}
.ovb{height:5px;background:var(--line);margin-top:4px}.ovb i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi))}
.gr .pips{display:flex;gap:3px;align-items:center}.gr .pips i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.gr .pips i.l{background:var(--bad)}
.enter .pn,.enter .hero,.enter .podium,.enter .crown{animation:pop .38s both}
.enter .pn:nth-child(2){animation-delay:60ms}.enter .pn:nth-child(3){animation-delay:120ms}.enter .pn:nth-child(4){animation-delay:180ms}
.nb[aria-selected="true"] svg{filter:drop-shadow(0 0 6px var(--glow))}
.nav{background:linear-gradient(180deg,var(--panel),var(--bg))}
@media (max-width:420px){h1{font-size:21px;letter-spacing:.02em}.logo{gap:8px}.season b{font-size:22px}.season{padding:3px 9px}}
.ph h3{color:var(--ink)}
.m .tn{font-size:16px}.m .tn .lk{overflow-wrap:normal;word-break:normal;hyphens:none}.m .sc{min-width:54px;font-size:26px}
@media (prefers-reduced-motion:reduce){.enter .pn,.enter .hero,.enter .podium,.enter .crown{animation:none}}

.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mrow .who{min-width:0;overflow-wrap:anywhere}.mrow .who small{display:block;font-size:12px}
.buy{border:1px solid var(--gold);color:var(--gold);background:none;padding:7px 10px;font:700 13px var(--d);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;min-width:88px;text-align:center}
.nat{background:none;cursor:pointer;display:inline-block;white-space:nowrap;flex:none;writing-mode:horizontal-tb;font:700 10px var(--d);letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);padding:0 4px;margin:0 6px 0 5px;vertical-align:middle;line-height:15px}
.cn{overflow-wrap:normal;word-break:normal;font-size:16px;line-height:1.1}
.inj{display:inline-block;font:700 10px var(--d);letter-spacing:.08em;color:#ff8a80;border:1px solid #ff8a80;padding:0 4px;margin-left:5px;vertical-align:middle;line-height:15px}
.more{display:inline-block}.more summary{list-style:none;display:inline-block}.more summary::-webkit-details-marker{display:none}.more[open]{display:block;width:100%}.more[open] summary{margin-bottom:6px}
.cele{position:relative;margin:0 0 12px;padding:16px;text-align:center;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(217,179,95,.18),rgba(217,179,95,.04));box-shadow:0 0 28px var(--glow);animation:cele .9s ease-out both}
.cele svg{width:44px;height:58px;display:block;margin:0 auto 6px;filter:drop-shadow(0 0 10px var(--glow))}
.cele small{display:block;font:700 12px var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* ===== Skin estilo FIFA/FC: azul profundo, neon, cartas, escudos; celular e PC ===== */
:root{
  --bg:#060A22;--bg2:#0B1240;--panel:#101A52;--ink:#F4F7FF;--muted:#9AA7DB;--line:#27358F;
  --acc:#00F5A0;--acc2:#00C2FF;--on-acc:#02161F;--glow:rgba(0,245,160,.18);
}
html{background:var(--bg)}
body{background-color:var(--bg);
  background-image:radial-gradient(800px 420px at 85% -120px,rgba(122,92,255,.45),transparent 70%),radial-gradient(700px 400px at -10% 20%,rgba(0,194,255,.22),transparent 70%),linear-gradient(165deg,#0A1250 0%,#14083D 55%,#050A26 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px);z-index:-1}
h1,h2,h3{font-style:italic}
h1{letter-spacing:.02em}
.eyebrow{color:var(--acc)}
.season{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.18);border-radius:10px}
.season b{color:var(--acc)}
.logo svg{color:var(--acc)}
.pn{background:linear-gradient(180deg,rgba(30,44,130,.62),rgba(11,18,64,.78));border:1px solid rgba(130,150,255,.24);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,20,.35)}
.pn::before,.pn::after{display:none}
.pn h2{color:var(--ink);font-style:italic;letter-spacing:.04em;position:relative;padding-left:12px}
.pn h2::before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:4px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.play{background:linear-gradient(100deg,var(--acc),var(--acc2));color:var(--on-acc);clip-path:none;border-radius:14px;font-style:italic;box-shadow:0 8px 24px rgba(0,245,160,.28);min-height:54px}
.playw{filter:none}
.ghost{border-radius:12px;border-color:rgba(130,150,255,.4);background:rgba(255,255,255,.04);min-height:44px}

.tag{border-radius:6px}
.search{border-radius:12px}
/* escudos */
.shield{display:inline-block;flex:none;width:30px;height:35px;vertical-align:middle;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

/* cartas */
.futr{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.futr>*{scroll-snap-align:start}
.fut{--fb:linear-gradient(160deg,#D49A62,#7A4A26);--fc:#2A1606;--fm:rgba(42,22,6,.55);position:relative;display:block;flex:none;width:132px;height:190px;border:0;padding:0;margin:0;color:var(--fc);background:var(--fb);cursor:pointer;
  clip-path:polygon(50% 0,90% 6%,100% 15%,100% 80%,50% 100%,0 80%,0 15%,10% 6%);font-family:var(--d);text-align:center;transition:transform .15s}

function g(){let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())}

function freshSeason(){return{res:{},perf:{},ach:{},rank:{},ps:{},msi:null,wc:null,real:null}}
function newState(){
  const teams=[],pdb={};let id=0;
  for(const lg of LGS)for(const row of DATA[lg]){
    const pl=row.slice(1).map((s,i)=>{
      const p=s.split(' ');const age=+p.pop(),r=+p.pop();
      const pot=age<=24?Math.round(r+(25-age)*1.5+g()*2.5):r;
      const n=p.join(' ');
      pdb[n]={role:i,debut:2026,ret:null,seasons:[],tl:[]};
      return{n,role:i,r,age,pot:Math.max(r,pot),f:r1(g()*.8),d:0};
    });
    teams.push({id:id++,name:row[0],lg,pl,mom:0,hot:0,tt:[],yh:[],est:EST.has(row[0])});
  }
  return{year:2026,phase:0,teams,hof:{},pdb,hist:[],pre:[],season:freshSeason(),mv:{},off:[]};
}

const KGS={baixa:9,normal:13,alta:18};
const kgNow=()=>KGS[(S&&S.opt&&S.opt.rnd)||'normal'];
const KG=13; /* a chance é por jogo (mapa); a da série sai da soma dos jogos. 6 pontos de OVR de diferença: ~74% por jogo, ~89% em melhor de 5 */
function seriesP(q,n){
  const need=Math.ceil(n/2);let s=0,c=1;
  for(let k=0;k<need;k++){if(k>0)c=c*(need-1+k)/k;s+=c*Math.pow(1-q,k)}
  return s*Math.pow(q,need);
}
function perGame(P,n){
  if(n===1)return P;
  let lo=0,hi=1;
  for(let i=0;i<40;i++){const m=(lo+hi)/2;seriesP(m,n)<P?lo=m:hi=m}
  return(lo+hi)/2;
}
function mk(a,b,n){
  const d=eff(a)-eff(b);
  const qa=1/(1+Math.pow(10,-d/kgNow()));
  return{a:a.id,b:b.id,n,d,pa:seriesP(qa,n),qa,res:null};
}
function play(m){
  const need=Math.ceil(m.n/2);let wa=0,wb=0;
  let qa=m.qa;
  if(mineM(m)){const pdl=draftOn()?draftDelta(m):planDelta(m);qa=clamp(qa+pdl.d,.03,.97);m.pn={me:pdl.me,op:pdl.op,raw:pdl.raw,dr:draftOn()}}
  while(wa<need&&wb<need){Math.random()<qa?wa++:wb++}
  const w=wa>wb?m.a:m.b,l=wa>wb?m.b:m.a;
  m.res={wa,wb,w};
  const W=T(w),L=T(l);
  W.hot=Math.min(1.2,W.hot+.3);L.hot=Math.max(-1.2,L.hot-.3);
  if(mineM(m)){const M=S.mgr;M.mor=clamp((M.mor==null?60:M.mor)+(w===M.tid?3:-3),10,100)}
  T(m.a).pl.forEach(p=>{const o=psOf(p.n);o.gw+=wa;o.gl+=wb});
  T(m.b).pl.forEach(p=>{const o=psOf(p.n);o.gw+=wb;o.gl+=wa});
  return w;
}
const loserOf=m=>m.res.w===m.a?m.b:m.a;

function perf(t,bonus,wt){
  t.pl.forEach(p=>{
    const o=S.season.perf[p.n]||(S.season.perf[p.n]={s:0,w:0});
    const ev=p.r+g()*2.5+bonus;
    o.s+=ev*wt;o.w+=wt;
    p.f=clamp(.55*p.f+.3*(ev-p.r),-4,4);
  });
}
function award(t,key,label){
  t.pl.forEach(p=>{
    const a=achOf(p.n);
    if(key==='lg')a.lg.push(label);else if(key==='msi')a.msi='C';else a.wc='C';
    hofOf(p.n)[key]++;
    pd(p.n).tl.push({y:S.year,t:label,tm:t.name});
  });
  t.tt.push({y:S.year,k:label,r:t.pl.map(p=>p.n)});
}
function mark(t,key,v){t.pl.forEach(p=>{const a=achOf(p.n);if(key==='lgf')a.lgf++;else a[key]=v})}
function giveMVP(label,champ,runner){
  const c=[];
  champ.pl.forEach(p=>c.push({p,t:champ,v:p.r+p.f+2.5+g()*3}));
  runner.pl.forEach(p=>c.push({p,t:runner,v:p.r+p.f+g()*3}));
  const x=c.sort((a,b)=>b.v-a.v)[0];
  achOf(x.p.n).mv.push(label);
  hofOf(x.p.n).mvp++;
  pd(x.p.n).tl.push({y:S.year,t:label,tm:x.t.name});
  return x.p.n;
}

/* ---------- splits ---------- */
function closeLeague(lg,tag,st,m1,m2,fm){
  const top=st.slice(0,4).map(r=>r.t);
  const third=[T(loserOf(m1)),T(loserOf(m2))].sort((a,b)=>top.indexOf(a)-top.indexOf(b));
  const champ=T(fm.res.w),runner=T(loserOf(fm));
  const order=[champ,runner,...third,...st.slice(4).map(r=>r.t)];
  S.season.rank[tag+lg]=order.map(t=>t.id);
  const n=order.length;
  order.forEach((t,i)=>{
    perf(t,[3,1.5,.5,.5,-.5,-1][i]??-1,1);
    t.mom=clamp(.55*t.mom+1.2*(1-2*i/(n-1))+(i===0?.5:0),-3,3);
    t.hot=0;
  });
  const label=`${lg} ${tag==='s1'?'Split 1':'Split 2'}`;
  award(champ,'lg',label);mark(runner,'lgf');
  if(champ.tt.some(x=>x.k===label&&x.y===S.year-1))news(`${champ.name} é bicampeão da ${label}.`);
  const mvp=giveMVP('MVP '+label,champ,runner);
  const fp=fm.res.w===fm.a?fm.pa:1-fm.pa;
  return{lg,champ:champ.name,cid:champ.id,runner:runner.name,third:third.map(t=>t.name),mvp,
    score:`${Math.max(fm.res.wa,fm.res.wb)}-${Math.min(fm.res.wa,fm.res.wb)}`,fp:Math.round(fp*100)};
}
function runLeagueFull(lg,tag){
  const ts=S.teams.filter(t=>t.lg===lg);
  const rec=new Map(ts.map(t=>[t.id,{t,w:0,l:0}]));
  for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++)for(let k=0;k<2;k++){
    const m=mk(ts[i],ts[j],1);const w=play(m);
    rec.get(w).w++;rec.get(loserOf(m)).l++;
  }
  const st=[...rec.values()].sort((x,y)=>y.w-x.w||Math.random()-.5);
  const top=st.slice(0,4).map(r=>r.t);
  const ser=(a,b)=>{const m=mk(a,b,5);play(m);return m};
  const m1=ser(top[0],top[3]),m2=ser(top[1],top[2]);
  const fm=ser(T(m1.res.w),T(m2.res.w));
  return closeLeague(lg,tag,st,m1,m2,fm);
}
function runSplit(tag){
  S.teams.forEach(t=>{t.mom*=.9;t.hot=0});rollInj();

const winOpen=()=>((S.phase===0&&dayNow()<CAL.s1)||(S.phase===4&&dayNow()<CAL.s2))&&!S.season.sp;
function roundRobin(ids){
  const n=ids.length,arr=ids.slice(),rs=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];pairs.push(r%2?[b,a]:[a,b])}
    rs.push(pairs);arr.splice(1,0,arr.pop());
  }
  return[...rs,...rs.map(p=>p.map(([a,b])=>[b,a]))];
}
function spOrder(sp){
  return Object.keys(sp.rec).map(Number).sort((a,b)=>sp.rec[b].w-sp.rec[a].w||sp.rec[a].l-sp.rec[b].l||eff(T(b))-eff(T(a)));

function spStep(){
  const sp=S.season.sp;
  if(sp.stage==='rr'){
    sp.cur.forEach(m=>{const w=play(m);sp.rec[w].w++;sp.rec[loserOf(m)].l++});
    sp.last=sp.cur;sp.ri++;lastPlayed={k:'sp'};
    if(sp.ri<sp.rounds.length){spPrep();return}
    const o=spOrder(sp);
    sp.stage='sf';sp.cur=[mk(T(o[0]),T(o[3]),5),mk(T(o[1]),T(o[2]),5)];return;
  }
  if(sp.stage==='sf'){
    sp.cur.forEach(m=>play(m));sp.sf=sp.cur;sp.last=sp.cur;lastPlayed={k:'sp'};
    sp.stage='fin';sp.cur=[mk(T(sp.sf[0].res.w),T(sp.sf[1].res.w),5)];return;

  const fm=sp.cur[0];play(fm);
  const r=closeLeague(sp.lg,sp.tag,spOrder(sp).map(id=>({t:T(id)})),sp.sf[0],sp.sf[1],fm);
  const res=S.season.res[sp.tag];res.push(r);res.sort((a,b)=>LGS.indexOf(a.lg)-LGS.indexOf(b.lg));

  ['LCK','LPL'].forEach(lg=>q.push(T(S.season.rank['s1'+lg][1])));

  q.sort((a,b)=>eff(b)-eff(a));
  S.season.msi={teams:q.map(t=>t.id),stages:[stageP('Quartas',seedPairs(q),5)],elim:{},champ:null,mvp:null};
}
function swissRound(tour,rnd){
  const open=tour.teams.filter(id=>tour.rec[id].w<3&&tour.rec[id].l<3);
  const groups={};
  open.forEach(id=>{const r=tour.rec[id],k=r.w+'-'+r.l;(groups[k]||(groups[k]=[])).push(id)});
  const ms=[];
  Object.keys(groups).sort().forEach(k=>{
    const ids=groups[k];let pairs=[];
    if(rnd===1){
      const h=ids.length/2,bot=shuffle(ids.slice(h));
      for(let i=0;i<h;i++)pairs.push([ids[i],bot[i]]);
    }else{
      let best=null;
      for(let a=0;a<80&&!best;a++){
        const s=shuffle(ids.slice());let ok=true;
        for(let i=0;i<s.length;i+=2)if(tour.rec[s[i]].opp.includes(s[i+1])){ok=false;break}
        if(ok)best=s;
      }
      if(!best)best=shuffle(ids.slice());
      for(let i=0;i<best.length;i+=2)pairs.push([best[i],best[i+1]]);
    }
    pairs.forEach(([a,b])=>{
      const dec=[a,b].some(id=>tour.rec[id].w===2||tour.rec[id].l===2);
      ms.push({...mk(T(a),T(b),dec?3:1),sw:k});
    });
  });
  return{name:`Suíço · Rodada ${rnd}`,n:0,ms,swiss:true,rnd};
}
function startWorlds(){
  const q=[];
  LGS.forEach(lg=>S.season.rank['s2'+lg].slice(0,SLOTS[lg]).forEach(id=>q.push(T(id))));
  q.forEach(t=>t.hot=0);
  q.sort((a,b)=>eff(b)-eff(a));
  const rec={};q.forEach(t=>rec[t.id]={w:0,l:0,opp:[]});
  const tour={teams:q.map(t=>t.id),rec,stages:[],elim:{},champ:null,mvp:null};
  tour.stages.push(swissRound(tour,1));
  S.season.wc=tour;
}
function playSwiss(tour){
  const si=tour.stages.length-1,st=tour.stages[si];
  st.ms.forEach(m=>{
    if(m.real)return;
    play(m);
    const w=m.res.w,l=loserOf(m),rw=tour.rec[w],rl=tour.rec[l];
    rw.w++;rl.l++;rw.opp.push(l);rl.opp.push(w);
    if(rl.l===3)tour.elim[l]='Suíço';
  });
  lastPlayed={k:'wc',si};
  const open=tour.teams.filter(id=>tour.rec[id].w<3&&tour.rec[id].l<3);
  if(open.length){tour.stages.push(swissRound(tour,st.rnd+1));return}
  const adv=tour.teams.filter(id=>tour.rec[id].w===3).sort((a,b)=>tour.rec[a].l-tour.rec[b].l||eff(T(b))-eff(T(a)));
  tour.stages.push(stageP('Quartas',seedPairs(adv.map(T)),5));
}
function playNext(tour,kind){
  const si=tour.stages.length-1,st=tour.stages[si];
  const ws=st.ms.map(m=>{play(m);tour.elim[loserOf(m)]=st.name;return m.res.w});
  lastPlayed={k:kind,si};
  if(ws.length===1){tour.champ=ws[0];return true}
  const pairs=[];for(let i=0;i<ws.length;i+=2)pairs.push([T(ws[i]),T(ws[i+1])]);
  tour.stages.push(stageP(ws.length===2?'Final':'Semifinais',pairs,5));
  return false;
}
function finishTour(tour,kind){
  const msi=kind==='msi';
  const B=msi?{C:4,F:2,SF:1,QF:-.5,G:0}:{C:5,F:3,SF:1.5,QF:0,G:-1.5};
  const M=msi?{C:1.5,F:1,SF:.5,QF:-.2,G:0}:{C:2,F:1.4,SF:.8,QF:.2,G:-.6};
  const WT=msi?1.3:2.2;
  const code=id=>id===tour.champ?'C':({Final:'F',Semifinais:'SF',Quartas:'QF'})[tour.elim[id]]||'G';
  tour.teams.forEach(id=>{
    const t=T(id),c=code(id);
    perf(t,B[c],WT);
    t.mom=clamp(.55*t.mom+M[c],-3,3);t.hot=0;
    if(c!=='C'){if(msi){if(c==='F'||c==='SF')mark(t,'msi',c)}else if(c!=='G')mark(t,'wc',c)}
  });
  S.teams.filter(t=>!tour.teams.includes(t.id)).forEach(t=>t.mom*=.85);
  const champ=T(tour.champ);
  const runner=T(+Object.keys(tour.elim).find(id=>tour.elim[id]==='Final'));
  award(champ,msi?'msi':'wc',msi?'MSI':'Mundial');
  {const lb=msi?'MSI':'Mundial',n=champ.tt.filter(x=>x.k===lb).length,bi=champ.tt.some(x=>x.k===lb&&x.y===S.year-1);news(`${champ.name} é campeão do ${lb} ${S.year}${bi?', bicampeão':''}: ${n}º título${n>1?'':''} do clube.`)}
  tour.mvp=giveMVP(msi?'MVP MSI':'MVP Mundial',champ,runner);
}

/* ---------- Bola de Ouro ---------- */
function chips(a){
  const c=[];
  if(a.wc==='C')c.push('Campeão do Mundial');else if(a.wc==='F')c.push('Vice do Mundial');else if(a.wc==='SF')c.push('Semifinal do Mundial');
  if(a.msi==='C')c.push('Campeão do MSI');else if(a.msi==='F')c.push('Vice do MSI');
  a.lg.forEach(l=>c.push('Campeão '+l));
  if(a.lgf)c.push(a.lgf>1?`Vice de liga ×${a.lgf}`:'Vice de liga');
  a.mv.forEach(l=>c.push(l));
  if(a.cp)c.push(a.cp);
  return c;
}
function awards(){
  const rows=[];
  S.teams.forEach(t=>t.pl.forEach(p=>{
    const o=S.season.perf[p.n];if(!o)return;
    const a=S.season.ach[p.n]||{lg:[],lgf:0,msi:'',wc:'',mv:[]};
    const ev=o.s/o.w;
    let sc=ev;
    const cb=(S.cupPend||{})[p.n];
    if(cb){sc+=cb.v;a.cp=cb.l}
    sc+=({C:10,F:4,SF:2})[a.wc]||0;
    sc+=({C:5,F:2})[a.msi]||0;
    sc+=a.lg.length*3+a.lgf;
    a.mv.forEach(l=>{sc+=l.startsWith('MVP Mundial')?2:l.startsWith('MVP MSI')?1.5:1});
    rows.push({n:p.n,role:p.role,team:t.name,tid:t.id,lg:t.lg,r:p.r,age:p.age,ev,sc,a});
  }));
  rows.sort((x,y)=>y.sc-x.sc);
  rows.forEach((x,i)=>{
    const o=psOf(x.n);
    const kda=clamp(KB[x.role]+(x.ev-x.r)*.1+(x.r-80)*.05+g()*.35,1.2,9);
    pd(x.n).seasons.push({y:S.year,tm:x.team,lg:x.lg,r:x.r,age:x.age,sc:r1(x.sc),pos:i+1,gw:o.gw,gl:o.gl,kda:r1(kda)});
  });
  S.cupPend=null;
  const top=rows.slice(0,10);
  const oldPos={};hofRank().forEach((n,i)=>oldPos[n]=i);
  top.forEach((x,i)=>{const h=hofOf(x.n);h.pts+=PTS[i];if(i===0)h.bd++});
  pd(top[0].n).tl.push({y:S.year,t:'Bola de Ouro',tm:top[0].team});
  {const hb=S.hof[top[0].n].bd;news(`${top[0].n} (${top[0].team}) vence a Bola de Ouro ${S.year}${hb>1?`, a ${hb}ª da carreira`:''}.`)}
  S.mv={};
  hofRank().slice(0,10).forEach((n,i)=>{S.mv[n]=oldPos[n]===undefined?'N':oldPos[n]-i});
  const msi=S.season.msi,wc=S.season.wc;
  const code=(tour,id)=>!tour.teams.includes(id)?'-':id===tour.champ?'C':({Final:'F',Semifinais:'SF',Quartas:'QF'})[tour.elim[id]]||'G';
  S.teams.forEach(t=>{
    const o=psOf(t.pl[0].n);
    t.yh.push({y:S.year,s1:S.season.rank['s1'+t.lg].indexOf(t.id)+1,s2:S.season.rank['s2'+t.lg].indexOf(t.id)+1,
      msi:code(msi,t.id),wc:code(wc,t.id),gw:o.gw,gl:o.gl});
  });
  S.pwCur={};pwRank().forEach((x,i)=>S.pwCur[x.t.id]=i+1);
  const r=S.season.res;
  S.hist.push({y:S.year,
    top:top.map((x,i)=>({n:x.n,team:x.team,lg:x.lg,role:x.role,r:x.r,sc:r1(x.sc),pts:PTS[i],ch:chips(x.a)})),
    champs:{s1:r.s1.map(x=>`${x.lg}: ${x.champ}`),s2:r.s2.map(x=>`${x.lg}: ${x.champ}`),
      mv1:r.s1.map(x=>`${x.lg}: ${x.mvp}`),mv2:r.s2.map(x=>`${x.lg}: ${x.mvp}`),
      msi:T(msi.champ).name,msiMvp:msi.mvp,wc:T(wc.champ).name,mvp:wc.mvp}});
  selYear=S.year;
}


/* ---------- modo carreira (manager) ---------- */
const MCAP=30;
const GOALS=['Fazer boa campanha na liga','Classificar para o Mundial','Chegar às quartas do Mundial','Chegar às semifinais do Mundial','Chegar à final do Mundial'];
const fmtM=n=>`US$ ${(Math.round(n*10)/10).toFixed(1).replace('.',',')} mi`;
function mvOf(p){
  let v=Math.pow(Math.max(0,(p.r-68)/4),2);
  if(p.age<=23)v+=Math.max(0,p.pot-p.r)*.5*clamp((p.r-50)/25,.15,1);else if(p.age>=29)v*=Math.max(.3,1-.1*(p.age-28));
  return Math.max(.3,Math.round(v*10)/10);
}
const salOf=p=>Math.max(.2,Math.round(mvOf(p)*.18*10)/10);
const payroll=t=>r1(t.pl.reduce((s,p)=>s+salOf(p),0)+(S.mgr&&S.mgr.tid===t.id&&S.mgr.bench?S.mgr.bench.reduce((s,p)=>s+salOf(p),0):0));
const mgrT=()=>S.mgr&&S.mgr.tid!=null?S.teams[S.mgr.tid]:null;
const rankOfTeam=t=>S.teams.slice().sort((a,b)=>baseOvr(b)-baseOvr(a)).indexOf(t)+1;
function goalFor(t){const r=rankOfTeam(t);return r<=4?4:r<=10?3:r<=20?2:r<=36?1:0}
function genFA(){
  const out=[];
  for(let i=0;i<12;i++){
    const role=i%5,age=19+Math.floor(Math.random()*12);
    const r=clamp(72+Math.floor(Math.abs(g())*6)+(Math.random()<.2?5:0),72,90);
    const pot=age<=23?clamp(r+Math.floor(Math.random()*8),r,97):r;
    let n=uniqueName();while(out.some(x=>x.n===n))n=uniqueName();
    out.push({n,role,r,age,pot,f:0,d:0,nat:pick(poolM())});
  }
  return out;
}
function mgrStart(tid){
  const t=S.teams[tid];
  S.mgr={tid,cash:12,sat:65,goal:goalFor(t),since:S.year,hist:[],log:[`Contratado pelo ${t.name} em ${S.year}.`],fa:genFA(),fired:false,acLv:1,ct:0,bench:[],loan:[],offers:[]};S.mgr.fa=genFA();mEnsure();
}
function mgrSeasonEnd(){
  const m=S.mgr,t=mgrT();if(!m||!t)return;
  const y=t.yh.find(x=>x.y===S.year);if(!y)return;
  const ach=y.wc==='C'?5:y.wc==='F'?4:y.wc==='SF'?3:y.wc==='QF'?2:y.wc==='G'?1:0;
  const lp=p=>p===1?3:p===2?1.5:p&&p<=4?.5:0;
  const income=IM()*(10+Math.max(0,baseOvr(t)-70)+lp(y.s1)+lp(y.s2)+(({C:4,F:2.5,SF:1,QF:.3,G:0})[y.msi]||0)+(({C:10,F:6,SF:4,QF:2.5,G:.5})[y.wc]||0));
  mEnsure();const pay=0,up=r1(AC_UP[m.acLv]+CT_UP[m.ct]),net=r1(income-pay-14-up);
  m.cash=r1(m.cash+net);
  const best=Math.min(y.s1||99,y.s2||99);
  let d=(ach-m.goal)*9+(ach===5?8:0)+(best===1?8:best<=4?4:0);
  let note='';
  if(m.cash<0){m.cash=0;d-=10;note=' Caixa negativo: diretoria irritada.'}
  if(d<0)d*=SM();
  m.sat=clamp(Math.round(m.sat+d),0,100);
  m.hist.push({y:S.year,income:r1(income),pay,up,net,goal:m.goal,ach,sat:m.sat,wc:y.wc});
  m.log.unshift(`${S.year}: ${y.wc==='C'?'campeão do Mundial':y.wc==='-'?'fora do Mundial':'Mundial: '+CODE[y.wc]}; saldo ${net>=0?'+':''}${fmtM(net)}; confiança ${m.sat}%.${note}`);
  m.fa.forEach(p=>{if(S.pdb[p.n])S.pdb[p.n].ret=S.year});
  mAch();
  m.rep=clamp((m.rep==null?50:m.rep)+(ach>=m.goal?4+2*(ach-m.goal):-4+ (ach-m.goal)),0,100);
  if(m.sat<25){m.rep=clamp(m.rep-15,0,100);m.fired=true;m.tid=null;m.log.unshift(`${S.year}: demitido pela diretoria.`)}
}
function mgrNewYear(){
  const m=S.mgr,t=mgrT();if(!m)return;
  m.fa=genFA();
  if(t){m.goal=Math.min(5,goalFor(t)+((m.rep||50)>=80?1:0));m.log.unshift(`${S.year}: janela aberta. Meta da diretoria: ${GOALS[m.goal]}.`);mBaseYear()}
  m.log=m.log.slice(0,30);
}
function canBuy(p,t){
  const m=S.mgr;
  if(m.cheat)return{ok:true,net:0};
  if(!winOpen())return{ok:false,why:'Fechada'};
  const net=r1(Math.round(mvOf(p)*(p.r>=88?1.4:1.15)*PM()*10)/10);
  if(m.cash-net<0)return{ok:false,why:'Sem caixa',net};
  return{ok:true,net};
}
function mgrBuy(name){
  const mine=mgrT(),m=S.mgr;mEnsure();
  let src=null;S.teams.forEach(t=>t.pl.forEach(p=>{if(p.n===name)src={t,p}}));
  if(!src||src.t===mine)return;
  const c=canBuy(src.p,src.t);if(!c.ok){msg=c.why;return}
  const p=src.p,i=p.role,oth=src.t.pl.filter((_,j)=>j!==i);
  /* o time vendedor é obrigado a contratar alguém no lugar */
  const nr=rookie(i,{r:p.r,avg:oth.reduce((a,x)=>a+x.r,0)/oth.length});
  src.t.pl[i]=nr;const d=pd(nr.n);d.role=i;d.debut=S.year+1;
  m.bench.push(p);pd(p.n).role=i;mCtr(p,3);
  m.cash=r1(m.cash-c.net);
  mlog(m.cheat?`${S.year}: cheat: ${p.n} (${src.t.name}) para as reservas.`:`${S.year}: comprou ${p.n} (${src.t.name}) por ${fmtM(c.net)}; ele foi para as reservas e o ${src.t.name} contratou ${nr.n}.`);
  msg=`${p.n} está nas suas reservas. Promova-o a titular quando quiser.`;
}
function mgrSign(name){
  const mine=mgrT(),m=S.mgr;mEnsure();
  if(!winOpen()&&!m.cheat){msg='Janela fechada';return}
  const k=m.fa.findIndex(p=>p.n===name);if(k<0)return;
  const p=m.fa[k],fee=m.cheat?0:r1(mvOf(p)*.6*PM());
  if(m.cash-fee<0){msg='Sem caixa';return}
  m.fa.splice(k,1);m.bench.push(p);mCtr(p,3);
  const d=pd(p.n);d.role=p.role;d.debut=S.year+1;if(p.nat)d.nat=p.nat;
  m.cash=r1(m.cash-fee);
  mlog(`${S.year}: contratou ${p.n} (OVR ${p.r}) como agente livre; foi para as reservas.`);
  msg=`${p.n} assinou e está nas suas reservas.`;
}

/* ---------- base, reservas, vendas e empréstimos ---------- */
const AC_UP=[0,1,2.5,4.5],CT_UP=[0,1.5,3.5,6],AC_COST=[0,0,6,12],CT_COST=[0,5,9,15];
const acCap=m=>3+2*(m.acLv||1);
const mlog=x=>{const m=S.mgr;m.log.unshift(x);m.log=m.log.slice(0,30)};
const mOpen=()=>!!S.mgr&&(winOpen()||!!S.mgr.cheat);
function prospect(){
  const m=S.mgr,lv=m.acLv||1;
  const role=Math.floor(Math.random()*5),age=16+Math.floor(Math.random()*3);
  const r=clamp(Math.round(56+Math.random()*8+lv*2+g()),54,70);
  const pot=clamp(Math.round(74+Math.abs(g())*7+Math.random()*6+lv*2),r+8,96);
  let n=uniqueName();
  while(m.fa&&m.fa.some(x=>x.n===n)||(m.acad||[]).some(x=>x.n===n))n=uniqueName();
  S.pdb[n]={role,debut:S.year+1,ret:null,seasons:[],tl:[],nat:pick(poolM())};
  return{n,role,r,pot,age,f:0,d:0,home:true};
}
function mEnsure(){
  const m=S.mgr;if(!m)return;
  m.acLv=m.acLv||1;m.ct=m.ct||0;m.bench=m.bench||[];m.loan=m.loan||[];m.offers=m.offers||[];
  if(!m.acad){m.acad=[];for(let i=0;i<3;i++)m.acad.push(prospect())}
  const t=mgrT();if(t)t.pl.concat(m.bench).forEach(p=>{if(p.ctr==null)p.ctr=2+Math.floor(Math.random()*3)});
}
function growProspect(p,bonus){
  const lv=S.mgr.acLv||1,o=p.r;p.age++;
  p.r=clamp(Math.round(p.r+clamp((p.pot-p.r)*.3+g()*1.5+lv*.5+(bonus||0),0,8)),50,p.pot);
  p.d=p.r-o;p.pot=Math.max(p.r,Math.round(p.pot+g()*1.2));
}
function growBench(p,bonus){
  const o=p.r;p.age++;
  p.r=clamp(Math.round(p.r+ageDelta(p)*.8+(bonus||0)-Math.max(0,p.r-88)*.2),55,99);
  p.d=p.r-o;p.pot=p.age<=24?Math.max(p.r,Math.round(p.pot+g()*.8)):p.r;
}
const bestRep=role=>{const m=S.mgr;return m.bench.concat(m.acad).filter(x=>x.role===role).sort((a,b)=>b.r-a.r)[0]||null};
function dropFrom(p){const m=S.mgr;let i=m.bench.indexOf(p);if(i>=0){m.bench.splice(i,1);return}i=m.acad.indexOf(p);if(i>=0)m.acad.splice(i,1)}
function mFind(n){
  const m=S.mgr,t=mgrT();if(!m||!t)return null;
  let i=t.pl.findIndex(p=>p.n===n);if(i>=0)return{k:'pl',i,p:t.pl[i]};
  i=m.bench.findIndex(p=>p.n===n);if(i>=0)return{k:'bench',i,p:m.bench[i]};
  i=m.acad.findIndex(p=>p.n===n);if(i>=0)return{k:'acad',i,p:m.acad[i]};
  return null;
}
const sellPrice=f=>r1(mvOf(f.p)*(f.k==='acad'?.6:f.k==='bench'?.85:.9));
function mExtra(n){
  const m=S.mgr,t=mgrT();if(!m||!t)return null;
  const p=(m.bench||[]).concat(m.acad||[]).find(x=>x.n===n);
  if(p)return{p,t:{name:t.name+' (reservas/base)'}};
  const l=(m.loan||[]).find(x=>x.p.n===n);
  return l?{p:l.p,t:{name:l.to+' (emprestado)'}}:null;
}
function mBaseYear(){
  const m=S.mgr,t=mgrT();mEnsure();
  t.pl.concat(m.bench).forEach(p=>{p.ctr=(p.ctr==null?2:p.ctr)-1;if(p.ctr<=0){p.exp=true;mlog(`${S.year}: o contrato de ${p.n} vence. Renove antes do Split 1 ou ele sai.`)}});
  m.acad.forEach(p=>growProspect(p,(m.focus==='jv'?1:0)+coachB(m)));
  m.bench.forEach(p=>growBench(p,(m.focus==='jv'?1:0)+coachB(m)));
  m.loan.forEach(l=>{
    if(l.from==='acad'){growProspect(l.p,1.2);m.acad.push(l.p)}else{growBench(l.p,1);m.bench.push(l.p)}
    mlog(`${S.year}: ${l.p.n} voltou do empréstimo (${l.to}) com OVR ${l.p.r}.`);
  });
  m.loan=[];
  m.acad=m.acad.filter(p=>{if(p.age>=21){m.bench.push(p);mlog(`${S.year}: ${p.n} saiu da base e foi para as reservas.`);return false}return true});
  m.bench=m.bench.filter(p=>{if(p.age>=33&&Math.random()<(p.age-31)*.18){pd(p.n).ret=S.year;mlog(`${S.year}: ${p.n} se aposentou nas reservas.`);return false}return true});
  const room=acCap(m)-m.acad.length;
  for(let i=0;i<Math.min(1+m.acLv,room);i++)m.acad.push(prospect());
  /* ofertas de outros clubes */
  m.offers=[];
  /* os clubes têm prioridade: chegam pedidos pelos seus melhores jogadores, mas você não é obrigado a vender */
  const cand=t.pl.concat(m.bench,m.acad);
  const nO=Math.min(cand.length,3+(Math.random()<.5?1:0));
  for(let k=0;k<nO;k++){
    const tot=cand.reduce((a,x)=>a+mvOf(x)+1,0);let r=Math.random()*tot,ix=0;
    for(;ix<cand.length-1;ix++){r-=mvOf(cand[ix])+1;if(r<=0)break}
    const p=cand.splice(ix,1)[0];
    const f=mFind(p.n);if(!f)continue;

const CH=[
 [['Aatrox','ag'],['Ornn','co'],['Jax','eq'],['Gnar','eq'],['Renekton','ag'],["K'Sante",'co']],
 [['Lee Sin','ag'],['Sejuani','co'],['Vi','eq'],['Viego','ag'],['Maokai','co'],['Nidalee','ag']],

const archOf=c=>{for(const r of CH)for(const [n,a] of r)if(n===c)return a;return'eq'};
const metaOf=c=>((hs(c+'|'+S.year)%7)-3)/3*.5;
const mastOf=(n,c)=>(hs(n+'|'+c)%100)/100;
function pickScore(p,c){return mastOf(p.n,c)+metaOf(c)*.6}
function bestPicks(t,noise){return t.pl.map((p,i)=>CH[i].map(([c])=>({c,v:pickScore(p,c)+(noise?(Math.random()-.5)*noise:0)})).sort((a,b)=>b.v-a.v)[0].c)}
function compMaj(pk){const n={eq:0,ag:0,co:0};pk.forEach(c=>n[archOf(c)]++);return Object.keys(n).sort((a,b)=>n[b]-n[a])[0]}
function compScore(t,pk,opMaj){
  let s=pk.reduce((a,c,i)=>a+pickScore(t.pl[i],c),0);
  const n={eq:0,ag:0,co:0};pk.forEach(c=>n[archOf(c)]++);
  if(Math.max(n.eq,n.ag,n.co)>=3)s+=.5;
  if(opMaj&&BEATS[compMaj(pk)]===opMaj)s+=.5;
  return s;
}

function uniqueName(){
  const used=new Set([...Object.keys(S.hof),...Object.keys(S.pdb),...S.teams.flatMap(t=>t.pl.map(p=>p.n))]);
  const A=['Ka','Ri','Zu','Mo','Vex','Tae','Jin','Lum','Nox','Ash','Dro','Kei','Syn','Ori','Pax','Rem','Tiv','Yun','Bao','Cal','Fen','Hux','Izo','Kor'];
  const B=['n','x','o','ra','is','el','on','ix','y','ko','ta','ru'];
  const M=['','ra','mi','lo','ve','ni','sa','do'];
  for(let i=0;i<600;i++){const n=pick(A)+pick(M)+pick(B);if(!used.has(n))return n}
  for(let i=2;;i++){const n=pick(A)+pick(B)+' '+'I'.repeat(i);if(!used.has(n))return n}
}
function rookie(role,ref){
  /* a vaga é preenchida por um talento já pronto para o nível do time: perto do aposentado e do resto do elenco */
  const prodigy=Math.random()<.1;
  const base=Math.max(ref.r-7,ref.avg-4,74);
  const r=clamp(Math.round(base+g()*2.2+(prodigy?3:0)),72,92);
  const pot=clamp(Math.round(r+2+Math.abs(g())*4+(prodigy?5:0)),r,98);
  return{n:uniqueName(),role,r,pot,age:18+Math.floor(Math.random()*5),f:0,d:0};
}
function ageDelta(p){
  const a=p.age;
  if(a<=24)return clamp((p.pot-p.r)*.3,0,5)+g()*1.2;
  if(a<=27)return .3+g()*1.3;
  if(a<=30)return -.8+g()*1.4;
  return -2.2+g()*1.5;
}
function nextSeason(){
  if(mgrT())mgrSeasonEnd();
  const mid=S.mgr&&S.mgr.tid!=null?S.mgr.tid:-1;
  const off=[],moved=new Set(),delta=[];
  S.teams.forEach(t=>{
    const tm=t.mom;
    t.pl.forEach(p=>{
      p.age++;
      const o=S.season.perf[p.n];
      const ex=o?clamp(o.s/o.w-p.r,-6,8):0;
      const old=p.r;
      p.r=clamp(Math.round(p.r+ageDelta(p)+.25*ex+.3*tm+(S.mgr&&S.mgr.tid===t.id?(S.mgr.ct||0)*.5+(S.mgr.focus==='ti'?.5:0)+coachB(S.mgr):0)-Math.max(0,p.r-88)*.2),55,99);
      p.d=p.r-old;p.f*=.4;
      if(p.age<=24)p.pot=Math.max(p.r,Math.round(p.pot+g()*.8));else p.pot=p.r;
      delta.push({p,t});
    });
    t.mom*=.5;t.hot=0;
  });
  const rs=delta.filter(x=>x.p.r>=76).sort((a,b)=>b.p.d-a.p.d);
  rs.slice(0,3).filter(x=>x.p.d>0).forEach(x=>off.push(`Em alta: ${x.p.n} (${x.t.name}) sobe ${x.p.d} e vai a ${x.p.r}.`));
  rs.slice(-3).reverse().filter(x=>x.p.d<0).forEach(x=>off.push(`Em queda: ${x.p.n} (${x.t.name}) cai ${-x.p.d} e vai a ${x.p.r}.`));
  S.teams.forEach(t=>t.pl.forEach((p,i)=>{
    const a=p.age;
    let pr=a>=35?1:a>=29?Math.min(.8,(a-28)*.09+(p.r<75?.1:0)):0;
    if(a<35)pr*=p.r>=88?.35:p.r>=84?.65:1;
    if(Math.random()<pr){
      off.push(`${p.n} (${t.name}) se aposentou aos ${a} anos.`);
      if((S.hof[p.n]&&sc(S.hof[p.n])>=40))news(`Lenda: ${p.n} se aposenta aos ${a} anos, com ${r1(sc(S.hof[p.n]))} pontos na carreira.`,S.year+1);
      pd(p.n).ret=S.year;
      const oth=t.pl.filter((_,j)=>j!==i);const nr=rookie(i,{r:p.r,avg:oth.reduce((s,x)=>s+x.r,0)/oth.length});t.pl[i]=nr;
      const d=pd(nr.n);d.role=i;d.debut=S.year+1;
      if(nr.pot>=88)off.push(`Promessa: ${nr.n}, ${nr.age} anos, chega ao ${t.name} com potencial ${nr.pot}.`);
    }
  }));
  for(let k=0;k<8;k++){
    const all=S.teams.flatMap(t=>t.pl.map((p,i)=>({t,p,i})));
    const A=pick(all.filter(x=>x.p.r>=80&&x.t.id!==mid&&!moved.has(x.p.n)));
    if(!A)break;
    const B=pick(all.filter(x=>x.t!==A.t&&x.t.id!==mid&&x.i===A.i&&!moved.has(x.p.n)));
    if(!B)continue;
    A.t.pl[A.i]=B.p;B.t.pl[B.i]=A.p;moved.add(A.p.n);moved.add(B.p.n);
    off.push(`${A.p.n} vai de ${A.t.name} para ${B.t.name}, em troca de ${B.p.n}.`);
  }
  S.inj={};S.year++;S.day=1;S.phase=0;S.season=freshSeason();S.off=off.slice(0,18);
  if(S.mgr)mgrNewYear();
}

function step(){
  fixPhase();cele=null;
  const p=PHASES[S.phase];
  if(!p){nextSeason();return}
  lastPlayed=null;
  switch(p.k){
    case 's1':case 's2':{
      if(p.k==='s1'&&mgrT())mExpire();
      if(true){if(!S.season.sp)spStart(p.k);else spStep();if(S.season.sp)return}
      else runSplit(p.k);
      if(p.k==='s1')startMSI();else startWorlds();
      break}
    case 'm0':case 'm1':case 'm2':if(playNext(S.season.msi,'msi'))finishTour(S.season.msi,'msi');break;
    case 'sw':playSwiss(S.season.wc);break;
    case 'wq':case 'ws':case 'wf':if(playNext(S.season.wc,'wc'))finishTour(S.season.wc,'wc');break;
    case 'aw':awards();break;
    case 'cg1':case 'cg2':case 'cg3':case 'ck1':case 'ck2':case 'ck3':case 'ck4':if(!S.season.cup)startCup();cupStep();break;
  }
  if(p.k==='m2'&&S.season.msi&&S.season.msi.champ!=null)cele={k:'Campeão do MSI '+S.year,n:T(S.season.msi.champ).name,s:'MVP '+S.season.msi.mvp};
  else if(p.k==='wf'&&S.season.wc&&S.season.wc.champ!=null)cele={k:'Campeão do Mundial '+S.year,n:T(S.season.wc.champ).name,s:'MVP '+S.season.wc.mvp};
  else if(p.k==='aw')cele={k:'Bola de Ouro '+S.year,n:S.hist[S.hist.length-1].top[0].n,s:S.hist[S.hist.length-1].top[0].team};
  else if(S.season.cup&&S.season.cup.champ!=null&&p.g===5)cele={k:'Campeão da Copa do Mundo '+S.year,n:CT(S.season.cup.champ).name,s:'MVP '+S.season.cup.mvp};
  S.phase++;fixPhase();
  if(S.phase===4&&mgrT())mMidYear();
}

/* Copa do Mundo de LoL: de 4 em 4 anos (2026, 2030...), 8 seleções com o melhor de cada posição */
const CUPY=y=>y>=2026&&(y-2026)%4===0;
const CONT={KOR:'AS',CHN:'AS',VIE:'AS',TWN:'AS',JPN:'AS',AUS:'OC',USA:'NA',CAN:'NA',MEX:'NA',BRA:'SA',ARG:'SA',CHI:'SA'};
['FRA','GER','ESP','DEN','SWE','POL','GRE','TUR','CZE','UKR','SLO','BUL','BEL','SVK','NED','ITA','POR','LTU','ROU','CRO','EST','FIN','NOR','SRB','HUN','IRL'].forEach(c=>CONT[c]='EU');
['THA','PHI','IDN','MAS','SIN','HKG','IND','KAZ'].forEach(c=>CONT[c]='AS');['COL','PER','URU'].forEach(c=>CONT[c]='SA');CONT.NZL='OC';
const NEAR={EU:['EU'],AS:['AS','OC'],OC:['OC','AS'],NA:['NA','SA'],SA:['SA','NA']};
/* formato da Copa do Mundo de futebol: grupos de 4 (todos contra todos, 3 rodadas), os 2 primeiros avançam,
   mata-mata (oitavas/quartas/semifinais), disputa de 3º lugar e final. 32 seleções quando há países suficientes, senão 16 ou 8. */
function startCup(){
  fixNat();
  const by={};
  S.teams.forEach(t=>t.pl.forEach(p=>{const c=natC(p.n);if(!c||(S.inj&&S.inj[p.n]))return;(by[c]=by[c]||[]).push(p)}));
  const all=Object.keys(by).map(c=>{
    const pl=[],cov=[];
    for(let i=0;i<5;i++){const b=by[c].filter(p=>p.role===i).sort((a,b)=>b.r-a.r)[0];if(b){pl[i]=b;cov.push(b.r)}}
    return{c,pl,n:cov.length,sum:cov.reduce((a,b)=>a+b,0)/Math.max(1,cov.length)};
  });
  let cand=all.filter(x=>x.n>=2);
  if(cand.length<8)cand=all.filter(x=>x.n>=1);
  cand.sort((a,b)=>(b.n>=3)-(a.n>=3)||b.sum-a.sum);
  const N=cand.length>=32?32:cand.length>=16?16:8;
  const top=cand.slice(0,N);
  const used=new Set();top.forEach(x=>x.pl.forEach(p=>p&&used.add(p.n)));
  const teams=top.map(x=>{
    const pl=[0,1,2,3,4].map(i=>{
      let p=x.pl[i],ext=false;
      if(!p){
        const al=S.teams.flatMap(t=>t.pl).filter(q=>q.role===i&&!used.has(q.n)&&!(S.inj&&S.inj[q.n]));
        const cont=CONT[x.c]||'EU',near=NEAR[cont]||[cont];
        for(const ck of [[cont],near,null]){
          const pool=ck?al.filter(q=>ck.includes(CONT[natC(q.n)])):al;
          if(pool.length){p=pool.sort((a,b)=>b.r-a.r)[0];break}
        }
        used.add(p.n);ext=true;
      }
      return{n:p.n,r:p.r,f:p.f,role:i,ext};
    });
    return{id:x.c,name:NATN[x.c]||x.c,pl,mom:0,hot:0};
  });
  teams.sort((a,b)=>eff(b)-eff(a));
  /* sorteio: 4 potes por força, um de cada pote em cada grupo */
  const G=N/4,groups=[];
  const pots=[0,1,2,3].map(k=>shuffle(teams.slice(k*G,(k+1)*G).map(t=>t.id)));
  for(let i=0;i<G;i++)groups.push({name:'Grupo '+String.fromCharCode(65+i),ids:[0,1,2,3].map(k=>pots[k][i])});
  const rec={};teams.forEach(t=>rec[t.id]={j:0,p:0,w:0,d:0,l:0,gw:0,gl:0});
  const cup={y:S.year,N,teams,groups,rec,gst:[],stages:[],elim:{},champ:null,third:null,mvp:null,gi:0};
  const RR=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  RR.forEach((rd,ri)=>{
    const ms=[];
    groups.forEach((g,gi)=>rd.forEach(([a,b])=>ms.push({...cupMk(CT2(cup,g.ids[a]),CT2(cup,g.ids[b]),2),grp:gi})));
    cup.gst.push({name:`Fase de grupos · Rodada ${ri+1}`,ms});
  });
  S.season.cup=cup;
}
const CT2=(cup,id)=>cup.teams.find(t=>t.id===id);
const CT=id=>CT2(S.season.cup,id);
function cupMk(a,b,n){
  const d=eff(a)-eff(b),qa=1/(1+Math.pow(10,-d/kgNow()));
  return{a:a.id,b:b.id,n,d,pa:n===2?qa*qa:seriesP(qa,n),pd:n===2?2*qa*(1-qa):0,qa,res:null};
}
function cupPlay(m){
  if(m.n===2){
    let wa=0,wb=0;for(let k=0;k<2;k++)Math.random()<m.qa?wa++:wb++;
    m.res={wa,wb,w:wa>wb?m.a:wb>wa?m.b:null};return m.res.w;
  }
  const need=Math.ceil(m.n/2);let wa=0,wb=0;
  while(wa<need&&wb<need){Math.random()<m.qa?wa++:wb++}
  m.res={wa,wb,w:wa>wb?m.a:m.b};
  return m.res.w;
}
function cupGroupOrder(cup,g){
  const sd=id=>cup.teams.findIndex(t=>t.id===id);
  return g.ids.slice().sort((a,b)=>{const x=cup.rec[a],y=cup.rec[b];return y.p-x.p||(y.gw-y.gl)-(x.gw-x.gl)||y.gw-x.gw||sd(a)-sd(b)});
}
const koName=n=>n>=8?'Oitavas':n>=4?'Quartas':'Semifinais';
function cupStep(){
  const cup=S.season.cup;if(!cup||cup.champ!=null)return;
  if(cup.gi<3){
    const st=cup.gst[cup.gi];
    st.ms.forEach(m=>{
      cupPlay(m);const r=m.res,A=cup.rec[m.a],B=cup.rec[m.b];
      A.j++;B.j++;A.gw+=r.wa;A.gl+=r.wb;B.gw+=r.wb;B.gl+=r.wa;
      if(r.w===m.a){A.w++;A.p+=3;B.l++}else if(r.w===m.b){B.w++;B.p+=3;A.l++}else{A.d++;B.d++;A.p++;B.p++}
    });

    if(cup.gi===3){
      const ord=cup.groups.map(g=>cupGroupOrder(cup,g));
      ord.forEach(o=>{cup.elim[o[2]]='Fase de grupos';cup.elim[o[3]]='Fase de grupos'});
      const l1=[],l2=[],G=cup.groups.length;
      for(let k=0;k<G;k+=2){l1.push([ord[k][0],ord[k+1][1]]);l2.push([ord[k+1][0],ord[k][1]])}
      const pairs=[...l1,...l2];
      cup.stages.push({name:koName(pairs.length),ms:pairs.map(([a,b])=>cupMk(CT2(cup,a),CT2(cup,b),3))});
    }
    return;
  }
  const si=cup.stages.length-1,st=cup.stages[si];

  if(st.final){
    const [m3,mf]=st.ms;cupPlay(m3);cupPlay(mf);
    cup.third=m3.res.w;cup.champ=mf.res.w;
    cup.elim[m3.res.w===m3.a?m3.b:m3.a]='Quarto';cup.elim[mf.res.w===mf.a?mf.b:mf.a]='Vice';cup.elim[cup.third]='Terceiro';
    cupFinish(cup);return;
  }
  const ws=[],ls=[];
  st.ms.forEach(m=>{cupPlay(m);ws.push(m.res.w);const l=m.res.w===m.a?m.b:m.a;ls.push(l);cup.elim[l]=st.name});
  if(ws.length===2){
    cup.stages.push({name:'Final',final:true,ms:[{...cupMk(CT(ls[0]),CT(ls[1]),3),lab:'Disputa do 3º lugar'},{...cupMk(CT(ws[0]),CT(ws[1]),5),lab:'Final'}]});
    return;
  }
  const pairs=[];for(let i=0;i<ws.length;i+=2)pairs.push([ws[i],ws[i+1]]);
  cup.stages.push({name:koName(pairs.length),ms:pairs.map(([a,b])=>cupMk(CT(a),CT(b),3))});
}

const sndOn=()=>!(S&&S.opt&&S.opt.snd===0);
let AC=null;
function tone(f,d,t0,type,v){
  const c=AC,o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);
  const t=c.currentTime+(t0||0);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.06,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.start(t);o.stop(t+d+.02);
}
function snd(k){
  if(!sndOn())return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    if(k==='win'){tone(523,.12,0,'triangle');tone(659,.12,.1,'triangle');tone(784,.22,.2,'triangle')}
    else if(k==='lose'){tone(330,.16,0,'sawtooth',.04);tone(247,.28,.14,'sawtooth',.04)}
    else if(k==='cheer'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.09,'triangle',.07));tone(1047,.5,.4,'sine',.06)}
    else tone(660,.05,0,'sine',.03);
  }catch(e){}
}
function sndAfter(){
  if(cele){snd('cheer');return}
  const mid=S.mgr&&S.mgr.tid;
  if(mid!=null){
    const ms=[...(S.season.sp&&S.season.sp.last||[]),...['wc','msi'].flatMap(k=>{const t=S.season[k];return t&&t.stages&&t.stages.length?t.stages[t.stages.length-1].ms:[]})];
    const my=ms.find(m=>m.res&&(m.a===mid||m.b===mid)&&lastPlayed);
    if(my){snd(my.res.w===mid?'win':'lose');return}
  }
  snd('click');
}

function ovrChart(ss){
  const pts=ss.filter(x=>x.r).map(x=>({y:x.y,r:x.r,a:x.age}));
  if(pts.length<2)return'';
  const W=320,H=130,P=26,lo=Math.min(...pts.map(p=>p.r))-2,hi=Math.max(...pts.map(p=>p.r))+2;
  const X=i=>P+i*(W-P*1.6)/(pts.length-1),Y=r=>H-22-(r-lo)*(H-40)/Math.max(1,hi-lo);
  const pk=pts.reduce((a,p)=>p.r>a.r?p:a,pts[0]);
  const step=Math.ceil(pts.length/6);
  return `<section class="pn"><h2>Evolução do OVR</h2><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do OVR por temporada" style="display:block"><polyline points="${pts.map((p,i)=>X(i)+','+Y(p.r)).join(' ')}" fill="none" stroke="#00F5A0" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.r)}" r="${p===pk?5:3}" fill="${p===pk?'#FFE27A':'#00C2FF'}"/>${i%step===0||p===pk?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#A9B4E6">${p.y}</text>`:''}`).join('')}<text x="${X(pts.indexOf(pk))}" y="${Y(pk.r)-9}" text-anchor="middle" font-size="12" font-weight="700" fill="#FFE27A">${pk.r}</text></svg><p class="note" style="margin:6px 0 0">Pico: ${pk.r} em ${pk.y}, aos ${pk.a} anos.</p></section>`;
}

  const tour=['sw','wq','ws','wf'].includes(p.k)?S.season.wc:['m0','m1','m2'].includes(p.k)?S.season.msi:null;
  if(tour&&tour.stages&&tour.stages.length){const st=tour.stages[tour.stages.length-1];return st.ms.filter(m=>!m.res)}

}
function heroMatch(){

  return ms.find(m=>m.a===mid||m.b===mid)||ms.slice().sort((a,b)=>(eff(T(b.a))+eff(T(b.b)))-(eff(T(a.a))+eff(T(a.b))))[0]||null;

function calGrid(){
  const td=dayNow(),x=dmy(td),f=new Date(Date.UTC(S.year,x.m,1)).getUTCDay(),n=MDN[x.m];

  const cells=[];for(let i=0;i<f;i++)cells.push('<i></i>');
  for(let d=1;d<=n;d++)cells.push(`<span class="cd${d===x.d?' td':''}${evs[d]?' ev':''}${base+d<td?' past':''}" ${evs[d]?`title="${esc(evs[d])}"`:''}>${d}</span>`);
  return `<div class="cgrid"><div class="chd">${DSEM.map(s=>`<b>${s}</b>`).join('')}</div><div class="cbd">${cells.join('')}</div></div>`;
}

  h+=`<section class="pn"><h2>Campeões de ${cur.y}</h2><div class="rowl"><span class="grow"><b>Mundial</b> ${esc(c.wc)}<br><small>MVP ${lk(c.mvp)}</small></span></div><div class="rowl"><span class="grow"><b>MSI</b> ${esc(c.msi)}<br><small>MVP ${c.msiMvp?lk(c.msiMvp):'–'}</small></span></div><div class="rowl"><span class="grow"><b>Split 1</b><br><small>${c.s1.map(esc).join(' · ')}</small>${c.mv1?`<br><small>MVPs: ${c.mv1.map(esc).join(' · ')}</small>`:''}</span></div><div class="rowl"><span class="grow"><b>Split 2</b><br><small>${c.s2.map(esc).join(' · ')}</small>${c.mv2?`<br><small>MVPs: ${c.mv2.map(esc).join(' · ')}</small>`:''}</span></div></section>`;
  return h+preHTML();
}

/* ---------- lendas ---------- */
function ttCount(t){
  return{wc:t.tt.filter(x=>x.k==='Mundial').length,msi:t.tt.filter(x=>x.k==='MSI').length,lg:t.tt.filter(x=>x.k!=='Mundial'&&x.k!=='MSI').length};
}
function plistHTML(){
  const PM=pmap();
  const names=[...new Set([...Object.keys(S.pdb),...Object.keys(S.hof)])];
  let rows=names.map(n=>{
    const P=PM[n],d=S.pdb[n]||{seasons:[]},h=S.hof[n]||{pts:0,bd:0,wc:0,msi:0,lg:0,mvp:0};
    const last=d.seasons[d.seasons.length-1];
    return{n,P,h,act:!!P,r:P?P.p.r:(last?last.r:0)};
  });
  if(pf==='a')rows=rows.filter(x=>x.act);else if(pf==='r')rows=rows.filter(x=>!x.act);
  const q=qStr.trim().toLowerCase();
  if(q)rows=rows.filter(x=>x.n.toLowerCase().includes(q));
  rows.sort((a,b)=>sc(b.h)-sc(a.h)||b.r-a.r||a.n.localeCompare(b.n));
  const tot=rows.length;
  let h=rows.slice(0,60).map(x=>{
    const tt=[x.h.bd?`${x.h.bd} Bola${x.h.bd>1?'s':''}`:'',x.h.wc?`${x.h.wc} Mundial${x.h.wc>1?'is':''}`:'',x.h.msi?`${x.h.msi} MSI`:''].filter(Boolean).join(' · ');
    return `<div class="pl">${x.r?hx(x.r,'sm'):'<span class="hx sm">–</span>'}<span><span class="nm2">${lk(x.n)}</span><span class="tag">${x.act?'ativo':'aposentado'}</span><br><small>${x.act?esc(x.P.t.name)+' · '+RN[x.P.p.role]:'fora do jogo'}${tt?' · '+tt:''}</small></span><span class="pt num">${r1(x.h.pts)}<small>pts</small></span></div>`;
  }).join('');
  if(!tot)h=`<p class="empty">Nenhum jogador encontrado.</p>`;
  if(tot>60)h+=`<p class="note">Mostrando 60 de ${tot}. Use a busca para achar os demais.</p>`;
  return h;
}

function pwr(t){
  let ti=0;t.tt.forEach(x=>{const a=S.year-x.y;if(a<0||a>4)return;const w=[1,.7,.5,.35,.2][a];ti+=w*(x.k==='Mundial'?10:x.k==='MSI'?5:2)});
  const yh=t.yh.slice(-2),gw=yh.reduce((a,s)=>a+s.gw,0),gl=yh.reduce((a,s)=>a+s.gl,0);
  const wr=gw+gl?gw/(gw+gl):.5;
  return (eff(t)-60)*2+Math.min(ti,30)*1.2+(wr-.5)*20;
}
function pwRank(){return S.teams.map(t=>({t,v:pwr(t)})).sort((a,b)=>b.v-a.v)}
function pwPos(t){return pwRank().findIndex(x=>x.t.id===t.id)+1}
function pwHTML(){
  const r=pwRank();
  if(!S.pwCur){S.pwCur={};r.forEach((x,i)=>S.pwCur[x.t.id]=i+1)}
  const rows=r.slice(0,30).map((x,i)=>{
    const o=S.pwCur[x.t.id],d=o?o-(i+1):0;
    const m=d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv dn">▼${-d}</span>`:'';
    const c=ttCount(x.t);
    return `<li><span class="pos num">${i+1}</span>${hx(Math.round(baseOvr(x.t)),'sm')}<span><span class="nm2">${tlk(x.t)}</span>${m}<span class="tag">${x.t.lg}</span><br><small>${c.wc} Mundial · ${c.msi} MSI · ${c.lg} ligas</small></span><span class="pt num">${Math.round(x.v)}<small>power</small></span></li>`;
  }).join('');
  return `<section class="pn"><h2>Power ranking</h2><ol class="rank">${rows}</ol><p class="note">Muda a cada jogo: força atual do elenco com a forma, títulos dos últimos 5 anos (peso maior nos recentes; Mundial pesa mais que MSI e liga) e aproveitamento das duas últimas temporadas. As setas comparam com o fim da última temporada.</p></section>`;
}
function vHof(){
  const PM=pmap();
  let h=`<div class="pills stk">${[['rank','Ranking'],['teams','Times'],['nat','Seleções'],['players','Jogadores']].map(([k,l])=>`<button class="pill" aria-pressed="${hofView===k}" data-act="hv" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(hofView==='rank'){
    const r=hofRank().slice(0,10);
    const rows=r.map((n,i)=>{
      const hh=S.hof[n],mv=S.mv[n],p=PM[n];
      const m=mv==='N'?'<span class="mv new">novo</span>':mv>0?`<span class="mv up">▲${mv}</span>`:mv<0?`<span class="mv dn">▼${-mv}</span>`:'';
      const tt=[hh.bd?`${hh.bd} Bola${hh.bd>1?'s':''} de Ouro`:'',hh.wc?`${hh.wc} Mundial${hh.wc>1?'is':''}`:'',hh.msi?`${hh.msi} MSI`:'',hh.lg?`${hh.lg} liga${hh.lg>1?'s':''}`:'',hh.mvp?`${hh.mvp} MVP${hh.mvp>1?'s':''}`:''].filter(Boolean).join(' · ');
      return `<li><span class="pos num">${i+1}</span>${p?hx(p.p.r,'sm'):'<span class="hx sm">–</span>'}<span><span class="nm2">${lk(n)}</span>${m}<span class="tag">${p?'ativo':'aposentado'}</span>${tt?`<br><small>${tt}</small>`:''}</span><span class="pt num">${Math.round(sc(hh))}<small>pts</small></span></li>`;
    }).join('');
    h+=`<section class="pn"><h2>Top 10 de todos os tempos</h2><ol class="rank">${rows}</ol><p class="note">Pontos = Bola de Ouro/temporada (${PTS.join(' · ')}) + Mundial 6 + MSI 3 + MVP 1,5 + liga 0,5. O hexágono mostra o OVR atual de quem ainda joga. Toque em um nome para abrir a ficha.</p></section>`;
    const bl=[...(S.pre||[]).map(x=>({y:x.y,n:x.top[0].n,team:x.top[0].team})),...S.hist.map(x=>({y:x.y,n:x.top[0].n,team:x.top[0].team}))].reverse();
    h+=`<section class="pn"><h2>Bolas de Ouro</h2>${bl.map(x=>`<div class="rowl"><span class="lg num">${x.y}</span><span class="grow"><b>${lk(x.n)}</b> <small>${esc(x.team)}</small></span></div>`).join('')}</section>`;
  }else if(hofView==='nat'){
    h+=natRankHTML();
  }else if(hofView==='teams'){
    h+=pwHTML();
    const rows=S.teams.map(t=>({t,c:ttCount(t)})).sort((a,b)=>b.c.wc-a.c.wc||b.c.msi-a.c.msi||b.c.lg-a.c.lg||baseOvr(b.t)-baseOvr(a.t));
    h+=`<section class="pn"><h2>Histórico de títulos</h2>${rows.map(({t,c})=>`<div class="pl"><span class="tag" style="margin:0">${t.lg}</span><span><span class="nm2">${tlk(t)}</span><br><small>${c.wc} Mundial · ${c.msi} MSI · ${c.lg} ligas</small></span>${hx(Math.round(baseOvr(t)),'sm')}</div>`).join('')}</section>`;
  }else{
    h+=`<div class="pills">${[['all','Todos'],['a','Ativos'],['r','Aposentados']].map(([k,l])=>`<button class="pill" aria-pressed="${pf===k}" data-act="pf" data-v="${k}">${l}</button>`).join('')}</div>`;
    h+=`<input id="q" class="search" type="search" placeholder="Buscar jogador" value="${esc(qStr)}" aria-label="Buscar jogador"><section class="pn"><h2>Jogadores</h2><div id="plist">${plistHTML()}</div></section>`;
  }
  return h;
}

/* ---------- elencos ---------- */
function fmtF(f){
  const v=r1(f);
  return Math.abs(v)<.5?'<span class="fm z">–</span>':v>0?`<span class="fm up">▲${v.toFixed(1)}</span>`:`<span class="fm dn">▼${(-v).toFixed(1)}</span>`;
}
function vTeams(){
  let h=`<div class="pills stk">${LGS.map(l=>`<button class="pill" aria-pressed="${l===selLg}" data-act="lg" data-v="${l}">${l}</button>`).join('')}<button class="pill" aria-pressed="${selLg==='TOP'}" data-act="lg" data-v="TOP">TOP 25</button><button class="pill" aria-pressed="${selLg==='NAT'}" data-act="lg" data-v="NAT">PAÍSES</button></div>`;
  if(selLg==='NAT')return h+natListHTML();
  if(selLg==='TOP'){
    const all=S.teams.flatMap(t=>t.pl.map(p=>({p,t}))).sort((a,b)=>(b.p.r+b.p.f)-(a.p.r+a.p.f)).slice(0,25);
    return h+`<section class="pn"><h2>Melhores jogadores agora</h2><ol class="rank">${all.map((x,i)=>`<li><span class="pos num">${i+1}</span>${hx(x.p.r,'sm')}<span><span class="nm2">${lk(x.p.n)}</span><br><small>${esc(x.t.name)} · ${RN[x.p.role]} · ${x.p.age} anos</small></span>${fmtF(x.p.f)}</li>`).join('')}</ol></section>`;
  }
  const ts=S.teams.filter(t=>t.lg===selLg).sort((a,b)=>eff(b)-eff(a));
  h+=`<div class="row"><button class="ghost" data-act="league" data-v="${selLg}">Ficha da liga ${selLg}</button></div>`;
  h+=ts.map(t=>{
    const f=r1(eff(t)-baseOvr(t));
    return `<section class="pn"><div class="th"><h3>${crest(t)}<span>${tlk(t)}${t.est?' <span class="tag">estimado</span>':''}</span></h3><span>${hx(Math.round(baseOvr(t)),'sm')}</span></div><small>Forma do time ${f>0?`<span class="st up">▲${f.toFixed(1)}</span>`:f<0?`<span class="st dn">▼${(-f).toFixed(1)}</span>`:'estável'}</small>
    ${t.pl.map(p=>`<div class="pr"><span class="role">${RN[p.role]}</span><span class="who">${lk(p.n)}<small>${p.age} anos${p.age<=24?` · potencial ${Math.round(p.pot)}`:''}${p.d?` · ${p.d>0?'+':''}${p.d} na virada`:''}</small><div class="ovb"><i style="width:${clamp((p.r-60)*2.5,4,100)}%"></i></div></span>${fmtF(p.f)}${hx(p.r,'sm')}</div>`).join('')}</section>`;
  }).join('');
  return h+`<p class="note">Elencos de 2026: os 19 times do Mundial seguem as listas divulgadas; os marcados como estimado são chutes meus. OVR e idades são notas minhas, não oficiais. O OVR sobe e cai com idade, potencial e desempenho; a seta mostra a forma atual, que também entra nas chances de vitória.</p>`;
}

/* ---------- ficha das seleções ---------- */
const natHue=c=>{let h=0;for(const x of c)h=(h*37+x.charCodeAt(0))%360;return h};
const natCrest=(c,cl='')=>`<span class="crest ${cl}" style="--h:${natHue(c)}" aria-hidden="true">${esc(c)}</span>`;
function natActive(c){return S.teams.flatMap(t=>t.pl.filter(p=>natC(p.n)===c).map(p=>({p,t})))}
function natXI(c){
  const a=natActive(c),pl=[];
  for(let i=0;i<5;i++){const b=a.filter(x=>x.p.role===i).sort((x,y)=>y.p.r-x.p.r)[0];pl.push(b||null)}
  return pl;
}
function natListHTML(){
  const cs={};
  S.teams.forEach(t=>t.pl.forEach(p=>{const c=natC(p.n);if(c)(cs[c]=cs[c]||[]).push(p)}));
  const rows=Object.keys(cs).map(c=>{const xi=natXI(c).filter(Boolean);return{c,n:cs[c].length,best:Math.max(...cs[c].map(p=>p.r)),cov:xi.length,avg:xi.length?xi.reduce((a,x)=>a+x.p.r,0)/xi.length:0}}).sort((a,b)=>b.avg*(b.cov>=4?1:.9)-a.avg*(a.cov>=4?1:.9)||b.n-a.n);
  return `<section class="pn"><h2>Seleções</h2>${rows.map((r,i)=>`<div class="pl" style="grid-template-columns:30px minmax(0,1fr) auto"><span class="pos num" style="font-size:20px">${i+1}</span><span><span class="nm2"><button class="lk" data-act="nation" data-v="${r.c}">${esc(NATN[r.c]||r.c)}</button></span><br><small>${r.n} jogador${r.n>1?'es':''} ativo${r.n>1?'s':''} · melhor ${r.best}${r.cov<5?` · ${r.cov}/5 posições`:''}</small></span>${hx(Math.round(r.avg),'sm')}</div>`).join('')}<p class="note">Ordenadas pelo OVR médio do melhor jogador de cada posição. Toque num país para abrir a ficha.</p></section>`;
}
function natTit(c,t){const ys=new Set();Object.keys(S.pdb).forEach(n=>{if(natC(n)===c)(S.pdb[n].tl||[]).forEach(e=>{if(e.t===t)ys.add(e.y)})});return ys.size}
function natRank(){
  const cs={};
  const g=c=>cs[c]||(cs[c]={c,pts:0,bd:0,wc:0,msi:0,cups:0,vice:0,n:0,top:null});
  Object.keys(S.hof).forEach(n=>{
    const c=natC(n);if(!c)return;const h=S.hof[n],x=g(c);
    x.pts+=sc(h);x.bd+=h.bd||0;
    if(sc(h)>0)x.n++;
    if(!x.top||sc(h)>x.top.pts)x.top={n,pts:sc(h)};
  });
  (S.cups||[]).forEach(cp=>{if(cp.code){g(cp.code).cups++;g(cp.code).pts+=40}Object.keys(cp.res||{}).forEach(c=>{if(cp.res[c]==='Vice'){g(c).vice++;g(c).pts+=15}})});
  Object.values(cs).forEach(x=>{x.wc=natTit(x.c,'Mundial');x.msi=natTit(x.c,'MSI')});
  return Object.values(cs).filter(x=>x.pts>0).sort((a,b)=>b.pts-a.pts);
}
function natRankHTML(){
  const rows=natRank();
  return `<section class="pn"><h2>Seleções de todos os tempos</h2><ol class="rank">${rows.map((x,i)=>{
    const tt=[x.bd?`${x.bd} Bola${x.bd>1?'s':''}`:'',x.wc?`${x.wc} Mundia${x.wc>1?'is':'l'}`:'',x.msi?`${x.msi} MSI`:'',x.cups?`${x.cups} Copa${x.cups>1?'s':''}`:'',x.vice?`${x.vice} vice${x.vice>1?'s':''} na Copa`:''].filter(Boolean).join(' · ');
    return `<li><span class="pos num">${i+1}</span>${natCrest(x.c,'sm')}<span><span class="nm2"><button class="lk" data-act="nation" data-v="${x.c}">${esc(NATN[x.c]||x.c)}</button></span><br><small>${tt||'sem títulos'} · ${x.n} lenda${x.n>1?'s':''}${x.top?` · melhor: ${esc(x.top.n)}`:''}</small></span><span class="pt num">${Math.round(x.pts)}<small>pts</small></span></li>`}).join('')}</ol><p class="note">Pontos do país = soma dos pontos de todas as lendas nascidas lá, mais 40 por Copa do Mundo de LoL vencida e 15 por vice. Toque num país para abrir a ficha.</p></section>`;
}
function vNation(c){
  const act=natActive(c),xi=natXI(c),have=xi.filter(Boolean);
  const nm=NATN[c]||c;
  const avg=have.length?have.reduce((a,x)=>a+x.p.r,0)/have.length:0;
  const leg=Object.keys(S.hof).filter(n=>natC(n)===c).map(n=>({n,h:S.hof[n]})).sort((a,b)=>sc(b.h)-sc(a.h)).slice(0,8);
  const sum=k=>Object.keys(S.hof).filter(n=>natC(n)===c).reduce((a,n)=>a+(S.hof[n][k]||0),0);
  const cups=(S.cups||[]).filter(x=>x.code===c);
  const part=(S.cups||[]).filter(x=>x.res&&x.res[c]);
  const byLg={};act.forEach(x=>{byLg[x.t.lg]=(byLg[x.t.lg]||0)+1});
  let o=`<div class="row"><button class="ghost" data-act="back">← Voltar</button></div>`;
  o+=`<section class="pn"><div class="ph">${natCrest(c,'lg')}<div style="flex:1;min-width:0"><h3>${esc(nm)}</h3><small>${act.length} jogador${act.length===1?'':'es'} ativo${act.length===1?'':'s'} nas 6 ligas${have.length?` · OVR da seleção ${Math.round(avg)}`:''}</small></div></div>
  <div class="cab"><div><b class="num">${cups.length}</b><small>Copas</small></div><div><b class="num">${sum('bd')}</b><small>Bolas de Ouro</small></div><div><b class="num">${natTit(c,'Mundial')}</b><small>Mundiais (edições)</small></div></div></section>`;
  o+=`<section class="pn"><h2>Técnico</h2>${S.nm&&S.nm.code===c?`<p class="note" style="margin:0 0 8px">Você é o técnico desta seleção${S.nm.titles?` · ${S.nm.titles} título${S.nm.titles>1?'s':''} de Copa`:''}. Na Copa você escolhe a convocação.</p><div class="row" style="margin:0"><button class="ghost" data-act="nmOff">Deixar a seleção</button></div>`:`<p class="note" style="margin:0 0 8px">${S.nm?`Você comanda ${esc(NATN[S.nm.code]||S.nm.code)}. Trocar de seleção zera seu histórico como técnico.`:'Comande este país na Copa do Mundo de LoL: você escolhe a convocação antes da primeira rodada.'}</p><div class="row" style="margin:0"><button class="ghost" data-act="nmSet" data-v="${c}">Ser técnico desta seleção</button></div>`}</section>`;
  o+=`<section class="pn"><h2>Seleção ideal agora</h2>${xi.map((x,i)=>x?`<div class="pr" style="grid-template-columns:38px minmax(0,1fr) 40px"><span class="role">${RN[i]}</span><span class="who">${lk(x.p.n)}<small>${esc(x.t.name)} · ${x.p.age} anos</small></span>${hx(x.p.r,'sm')}</div>`:`<div class="pr" style="grid-template-columns:38px minmax(0,1fr)"><span class="role">${RN[i]}</span><span class="who"><small>Sem jogador do país nesta posição. Na Copa entra um reforço do mesmo continente.</small></span></div>`).join('')}<p class="note">${have.length>=5?'Escalação completa.':have.length>=3?'Escalação incompleta, mas o país pode disputar a Copa com reforços.':'Poucos jogadores: dificilmente chega à Copa.'}</p></section>`;
  o+=`<section class="pn"><h2>Estante</h2><div class="sh-t"><span>Copa do Mundo de LoL</span><b class="num">${cups.length}</b></div>${shelfRow('w',cups.map(x=>({y:x.y,l:`Copa do Mundo ${x.y}`,sub:nm})),'wide')}</section>`;
  if(part.length)o+=`<section class="pn"><h2>Histórico na Copa</h2>${part.slice().reverse().map(x=>`<div class="rowl"><span class="lg num">${x.y}</span><span class="grow"><b>${x.res[c]}</b><br><small>campeão ${esc(x.champ)}</small></span></div>`).join('')}</section>`;
  else o+=`<section class="pn"><h2>Histórico na Copa</h2><p class="empty" style="margin:0">Nenhuma Copa disputada ainda. A primeira é depois da Bola de Ouro de 2026, e depois de 4 em 4 anos.</p></section>`;
  if(S.nm&&S.nm.code===c&&(S.nm.cups||[]).length)o+=`<section class="pn"><h2>Seu histórico como técnico</h2>${S.nm.cups.slice().reverse().map(x=>`<div class="rowl"><span class="lg num">${x.y}</span><span class="grow"><b>${x.res}</b></span></div>`).join('')}</section>`;
  if(Object.keys(byLg).length)o+=`<section class="pn"><h2>Jogadores por liga</h2>${Object.keys(byLg).sort((a,b)=>byLg[b]-byLg[a]).map(l=>`<div class="rowl"><span class="lg">${llk(l)}</span><span class="grow"><b class="num">${byLg[l]}</b> jogador${byLg[l]>1?'es':''}</span></div>`).join('')}</section>`;
  if(leg.length)o+=`<section class="pn"><h2>Lendas do país</h2><ol class="rank">${leg.map((x,i)=>`<li><span class="pos num">${i+1}</span><span class="hx sm t2">${Math.round(sc(x.h))}</span><span><span class="nm2">${lk(x.n)}</span><br><small>${x.h.bd||0} Bolas · ${x.h.wc||0} Mundiais · ${x.h.msi||0} MSI</small></span></li>`).join('')}</ol></section>`;
  return o;
}

/* ---------- fichas ---------- */
const CODE={C:'Campeão',F:'Vice',SF:'Semifinal',QF:'Quartas',G:'Suíço','-':'–'};
const pos=n=>n?`${n}º`:'–';

const DEFS=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8E3A6"/><stop offset=".55" stop-color="#D9B35F"/><stop offset="1" stop-color="#8F6A22"/></linearGradient>

const troSvg=k=>`<svg viewBox="0 0 48 64" aria-hidden="true"><use href="#tr-${k}"/></svg>`;
const BALIAS={'SKT':'T1','SK Telecom T1':'T1','DAMWON Gaming':'Dplus KIA','DWG KIA':'Dplus KIA','Bilibili Gaming':'BLG','G2 Esports':'G2'};
function teamBolas(t){
  const out=[];
  (S.pre||[]).forEach(x=>{const w=x.top[0];if((BALIAS[w.team]||w.team)===t.name)out.push({y:x.y,n:w.n})});
  S.hist.forEach(x=>{const w=x.top[0];if(w.team===t.name)out.push({y:x.y,n:w.n})});
  return out.sort((a,b)=>a.y-b.y);
}
function shelfHTML(t){
  const kinds=[['w','Mundial','Mundiais',x=>x.k==='Mundial'],['m','MSI','MSI',x=>x.k==='MSI'],['l','Liga','Ligas',x=>x.k!=='Mundial'&&x.k!=='MSI']];
  let h=`<section class="pn"><h2>Estante de troféus</h2>`;
  kinds.forEach(([k,one,pl,f])=>{
    const items=t.tt.filter(f).sort((a,b)=>a.y-b.y);
    h+=`<div class="sh-t"><span>${pl}</span><b class="num">${items.length}</b></div><div class="shelf">${items.length?items.map(x=>`<div class="tro" title="${esc(x.k)} ${x.y}" role="img" aria-label="${esc(x.k)} ${x.y}">${troSvg(k)}<b class="num">${x.y}</b></div>`).join(''):'<span class="none">Ainda vazia</span>'}</div>`;
  });
  return h+`</section>`;
}
function bolaShelfHTML(t){
  const b=teamBolas(t);

const LGN={LCK:'Coreia do Sul',LPL:'China',LEC:'Europa',LCS:'América do Norte',LCP:'Pacífico',CBLOL:'Brasil'};
const llk=lg=>`<button class="lk" data-act="league" data-v="${lg}">${lg}</button>`;
function shelfRow(k,items,cls=''){
  return `<div class="shelf">${items.length?items.map(x=>`<div class="tro ${cls}" title="${esc(x.l)}" role="img" aria-label="${esc(x.l)}">${troSvg(k)}<b class="num">${x.y}</b>${x.sub?`<span>${esc(x.sub)}</span>`:''}</div>`).join(''):'<span class="none">Ainda vazia</span>'}</div>`;

const byY=(a,b)=>(+a.y||0)-(+b.y||0);
function pshelfHTML(n,d,h){
  const tl=d.tl||[];
  const isMVP=x=>/^MVP/.test(x.t);
  const W=tl.filter(x=>x.t==='Mundial').sort(byY),M=tl.filter(x=>x.t==='MSI').sort(byY);
  const C=tl.filter(x=>x.t==='Copa do Mundo de LoL').sort(byY);
  const L=tl.filter(x=>x.t!=='Mundial'&&x.t!=='MSI'&&x.t!=='Copa do Mundo de LoL'&&!isMVP(x)&&x.t!=='Bola de Ouro'&&!/^Top 5/.test(x.t)&&x.y!=='—').sort(byY);
  const unk=Math.max(0,(h.lg||0)-L.length);
  const V=tl.filter(isMVP).sort(byY),B=tl.filter(x=>x.t==='Bola de Ouro').sort(byY);
  const mv=x=>/Copa do Mundo/.test(x.t)?'Copa':/Mundial/.test(x.t)?'Mundial':/MSI/.test(x.t)?'MSI':'Liga';
  const rows=[['w','Mundiais',W.map(x=>({y:x.y,l:`Mundial ${x.y}`,sub:''}))],['m','MSI',M.map(x=>({y:x.y,l:`MSI ${x.y}`,sub:''}))],['w','Copa do Mundo',C.map(x=>({y:x.y,l:`Copa do Mundo ${x.y} · ${x.tm}`,sub:x.tm}))],
    ['l','Ligas',[...Array(unk).fill({y:'–',l:'Título de liga',sub:''}),...L.map(x=>({y:x.y,l:`${x.t} ${x.y}`,sub:''}))]],['p','MVPs',V.map(x=>({y:x.y,l:`${x.t} ${x.y}`,sub:mv(x)}))]];
  let o='';
  if(rows.some(r=>r[2].length))o+=`<section class="pn"><h2>Estante de troféus</h2>${rows.map(([k,t,it])=>`<div class="sh-t"><span>${t}</span><b class="num">${it.length}</b></div>${shelfRow(k,it,k==='p'?'wide':'')}`).join('')}</section>`;
  if(B.length)o+=`<section class="pn"><h2>Estante de Bolas de Ouro</h2><div class="sh-t"><span>Bolas conquistadas</span><b class="num">${B.length}</b></div>${shelfRow('b',B.map(x=>({y:x.y,l:`Bola de Ouro ${x.y}`,sub:x.tm})),'bola')}</section>`;
  return o;
}
function vLeague(lg){

    `<div class="sh-t"><span>Bolas de Ouro</span><b class="num">${bolas.length}</b></div>${shelfRow('b',bolas.map(x=>({y:x.y,l:`Bola de Ouro ${x.y}: ${x.n}`,sub:x.n})),'bola')}</section>`;
  o+=`<section class="pn"><h2>Melhores jogadores</h2><ol class="rank">${top.map((x,i)=>`<li><span class="pos num">${i+1}</span>${hx(x.p.r,'sm')}<span><span class="nm2">${lk(x.p.n)}</span><br><small>${esc(x.t.name)} · ${RN[x.p.role]} · ${x.p.age} anos</small></span>${fmtF(x.p.f)}</li>`).join('')}</ol></section>`;
  if(lgt.length)o+=`<section class="pn"><details class="det"><summary>Campeões por temporada</summary>${lgt.map(x=>`<div class="trp"><span class="y num">${x.y}</span><span><b>${esc(x.k)}</b><small>${tlk(x.t)}</small></span></div>`).join('')}</details></section>`;
  return o;
}

function vPlayer(n){

  const status=P?`Ativo · ${esc(P.t.name)}${role!=null?' · '+RN[role]:''} · ${P.p.age} anos`:d.ret?`Aposentado em ${d.ret}${last?' · último time '+esc(last.tm):''}`:(d.note?esc(d.note):'Lenda do ranking inicial');
